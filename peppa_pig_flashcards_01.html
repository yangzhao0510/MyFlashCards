<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peppa Pig 英语闪卡 01</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f7f7f7, #e9e9e9);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #222;
  }
  .app {
    width: min(92vw, 720px);
    padding: 24px 0;
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .subtitle { color: #666; margin-bottom: 20px; }
  .progress {
    font-size: 15px;
    color: #666;
    margin-bottom: 12px;
  }
  .card-wrap {
    perspective: 1200px;
    height: 410px;
    cursor: pointer;
    user-select: none;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .45s ease;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 24px;
    background: white;
    box-shadow: 0 14px 40px rgba(0,0,0,.12);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px;
  }
  .back { transform: rotateY(180deg); text-align: left; align-items: stretch; }
  .word {
    font-size: clamp(42px, 9vw, 76px);
    font-weight: 750;
    margin-bottom: 12px;
  }
  .ipa {
    color: #777;
    font-size: 20px;
    margin-bottom: 24px;
  }
  .hint { color: #aaa; font-size: 14px; }
  .meaning {
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }
  .example {
    font-size: 22px;
    line-height: 1.5;
    margin: 12px 0;
  }
  .translation {
    color: #666;
    font-size: 18px;
    line-height: 1.5;
  }
  .tag {
    display: inline-block;
    align-self: center;
    padding: 6px 12px;
    border-radius: 999px;
    background: #eee;
    color: #666;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    border: 0;
    border-radius: 14px;
    padding: 14px 12px;
    font-size: 16px;
    cursor: pointer;
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
  }
  button:hover { transform: translateY(-1px); }
  .primary { font-weight: 700; }
  .tools {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 12px;
  }
  .tools button { font-size: 14px; padding: 10px 14px; }
  .tip {
    margin-top: 16px;
    color: #888;
    font-size: 13px;
  }
  @media (max-width: 600px) {
    .app { padding: 16px 0; }
    h1 { font-size: 23px; }
    .card-wrap { height: 390px; }
    .face { padding: 24px; }
    .meaning { font-size: 28px; }
    .example { font-size: 19px; }
    .translation { font-size: 16px; }
    .controls button { padding: 13px 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🐷 Peppa Pig 英语闪卡</h1>
  <div class="subtitle">第一季 · 词汇练习 01</div>
  <div class="progress" id="progress">1 / 15</div>

  <div class="card-wrap" id="cardWrap" title="点击卡片翻面">
    <div class="card" id="card">
      <div class="face front">
        <div class="word" id="word">favourite</div>
        <div class="ipa" id="ipa">/ˈfeɪvərɪt/</div>
        <div class="hint">点击卡片查看中文、例句</div>
      </div>
      <div class="face back">
        <div class="tag" id="part">词汇</div>
        <div class="meaning" id="meaning">最喜欢的</div>
        <div class="example" id="example">Peppa is my favourite character.</div>
        <div class="translation" id="translation">佩奇是我最喜欢的角色。</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← 上一个</button>
    <button id="speak">🔊 发音</button>
    <button id="next" class="primary">下一个 →</button>
  </div>

  <div class="tools">
    <button id="flip">🔄 翻面</button>
    <button id="random">🔀 随机</button>
  </div>

  <div class="tip">提示：← / → 切换单词，空格键翻面</div>
</div>

<script>
const cards = [
  {
    word:"favourite", ipa:"/ˈfeɪvərɪt/", meaning:"最喜欢的",
    part:"形容词", example:"Peppa is my favourite character.",
    translation:"佩奇是我最喜欢的角色。"
  },
  {
    word:"scare", ipa:"/skeə(r)/", meaning:"吓唬；使害怕",
    part:"动词", example:"Don't scare George!",
    translation:"不要吓乔治！"
  },
  {
    word:"suppertime", ipa:"/ˈsʌpətaɪm/", meaning:"晚餐时间",
    part:"名词", example:"It's suppertime.",
    translation:"到晚餐时间了。"
  },
  {
    word:"pardon", ipa:"/ˈpɑːdn/", meaning:"请再说一遍；原谅",
    part:"表达 / 动词", example:"Pardon? I didn't hear you.",
    translation:"什么？我没听见你说的话。"
  },
  {
    word:"bath", ipa:"/bɑːθ/", meaning:"洗澡；浴缸",
    part:"名词", example:"George is having a bath.",
    translation:"乔治正在洗澡。"
  },
  {
    word:"shares", ipa:"/ʃeəz/", meaning:"分享；分担",
    part:"动词", example:"Peppa shares her toy with George.",
    translation:"佩奇和乔治分享她的玩具。"
  },
  {
    word:"throwing", ipa:"/ˈθrəʊɪŋ/", meaning:"扔；投掷",
    part:"动词 -ing", example:"They are throwing a ball.",
    translation:"他们正在扔球。"
  },
  {
    word:"catching", ipa:"/ˈkætʃɪŋ/", meaning:"接住；抓住",
    part:"动词 -ing", example:"George is catching the ball.",
    translation:"乔治正在接球。"
  },
  {
    word:"draughts", ipa:"/drɑːfts/", meaning:"国际跳棋",
    part:"名词", example:"Grandpa Pig likes playing draughts.",
    translation:"猪爷爷喜欢下国际跳棋。"
  },
  {
    word:"matter", ipa:"/ˈmætə(r)/", meaning:"事情；问题",
    part:"名词 / 动词", example:"What's the matter?",
    translation:"怎么了？"
  },
  {
    word:"detective", ipa:"/dɪˈtektɪv/", meaning:"侦探",
    part:"名词", example:"Peppa is a little detective.",
    translation:"佩奇是一名小侦探。"
  },
  {
    word:"important", ipa:"/ɪmˈpɔːtənt/", meaning:"重要的",
    part:"形容词", example:"This is very important.",
    translation:"这非常重要。"
  },
  {
    word:"person", ipa:"/ˈpɜːsn/", meaning:"人；个人",
    part:"名词", example:"Who is that person?",
    translation:"那个人是谁？"
  },
  {
    word:"might", ipa:"/maɪt/", meaning:"可能；也许",
    part:"情态动词", example:"It might rain today.",
    translation:"今天可能会下雨。"
  },
  {
    word:"wonder", ipa:"/ˈwʌndə(r)/", meaning:"想知道；感到疑惑",
    part:"动词", example:"I wonder where George is.",
    translation:"我想知道乔治在哪里。"
  }
];

let order = cards.map((_, i) => i);
let current = 0;
let flipped = false;

const $ = id => document.getElementById(id);

function render() {
  const c = cards[order[current]];
  $("word").textContent = c.word;
  $("ipa").textContent = c.ipa;
  $("meaning").textContent = c.meaning;
  $("part").textContent = c.part;
  $("example").textContent = c.example;
  $("translation").textContent = c.translation;
  $("progress").textContent = `${current + 1} / ${order.length}`;
  $("card").classList.toggle("flipped", flipped);
}

function flip() {
  flipped = !flipped;
  $("card").classList.toggle("flipped", flipped);
}

function next() {
  current = (current + 1) % order.length;
  flipped = false;
  render();
}

function prev() {
  current = (current - 1 + order.length) % order.length;
  flipped = false;
  render();
}

function speak() {
  const text = cards[order[current]].word;
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 0.75;
    speechSynthesis.speak(utterance);
  } else {
    alert("当前浏览器不支持语音朗读。");
  }
}

function randomCard() {
  current = Math.floor(Math.random() * order.length);
  flipped = false;
  render();
}

$("cardWrap").addEventListener("click", flip);
$("flip").addEventListener("click", flip);
$("next").addEventListener("click", next);
$("prev").addEventListener("click", prev);
$("speak").addEventListener("click", speak);
$("random").addEventListener("click", randomCard);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    flip();
  }
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>胖哥学英语 · 听句子</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f7f8fa;
            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
        }


        body {
            min-height: 100vh;
        }


        button {
            font: inherit;
        }


        /* =================================================
           页面
           ================================================= */

        .app {

            width: 100%;
            max-width: 560px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                20px
                16px
                30px;

            display: flex;
            flex-direction: column;
        }


        /* =================================================
           顶部
           ================================================= */

        .header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;
        }


        .title {

            font-size: 20px;

            font-weight: 700;

            letter-spacing: -0.3px;
        }


        .subtitle {

            margin-top: 4px;

            color: #999;

            font-size: 12px;
        }


        .today-count {

            text-align: right;

            color: #888;

            font-size: 12px;

            line-height: 1.6;
        }


        .today-count strong {

            color: #333;

            font-size: 16px;
        }


        /* =================================================
           进度
           ================================================= */

        .progress-area {

            margin-bottom: 18px;
        }


        .progress-info {

            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            font-size: 12px;

            color: #999;
        }


        .progress-bar {

            width: 100%;

            height: 5px;

            overflow: hidden;

            border-radius: 999px;

            background: #e9eaed;
        }


        .progress-fill {

            width: 0%;

            height: 100%;

            border-radius: 999px;

            background: #222;

            transition:
                width 0.25s ease;
        }


        /* =================================================
           主卡片
           ================================================= */

        .card {

            flex: 1;

            min-height: 470px;

            background: #fff;

            border-radius: 20px;

            padding:
                30px
                22px
                26px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.05);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =================================================
           第几句
           ================================================= */

        .question-label {

            color: #aaa;

            font-size: 12px;

            margin-bottom: 18px;
        }


        /* =================================================
           句子区域
           ================================================= */

        .sentence-placeholder {

            width: 100%;

            min-height: 110px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #555;

            font-size: 17px;

            line-height: 1.8;

            padding:
                0
                8px;
        }


        .hidden-text {

            color: #bbb;

            font-size: 15px;

            line-height: 1.9;
        }


        /* =================================================
           答案
           ================================================= */

        .answer {

            display: none;

            width: 100%;

            margin-top: 4px;
        }


        .answer.show {

            display: block;
        }


        .english {

            font-size: 21px;

            font-weight: 600;

            line-height: 1.65;

            color: #222;

            margin-bottom: 12px;
        }


        .chinese {

            font-size: 16px;

            line-height: 1.7;

            color: #777;
        }


        /* =================================================
           播放区域
           ================================================= */

        .play-wrapper {

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .play-btn {

            width: 72px;

            height: 72px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: #fff;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            transition:
                transform 0.15s ease;

            box-shadow:
                0 7px 20px
                rgba(0, 0, 0, 0.12);
        }


        .play-btn:active {

            transform: scale(0.94);
        }


        .play-btn.playing {

            animation:
                pulse 1.4s infinite;
        }


        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }


        .play-hint {

            margin-top: 8px;

            color: #aaa;

            font-size: 11px;
        }


        /* =================================================
           操作区域
           
           播放按钮
              ↓
           显示答案
              ↓
           听懂 / 没听懂
              ↓
           下一句
           ================================================= */

        .actions {

            width: 100%;

            margin-top: 22px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;
        }


        /* =================================================
           显示答案
           ================================================= */

        .answer-btn {

            width: 100%;

            max-width: 360px;

            height: 48px;

            border: none;

            border-radius: 12px;

            background: #f0f1f3;

            color: #444;

            cursor: pointer;

            font-size: 14px;

            font-weight: 500;

            transition:
                transform 0.12s ease;
        }


        .answer-btn:active {

            transform: scale(0.97);
        }


        /* =================================================
           听懂 / 没听懂
           ================================================= */

        .judge-row {

            width: 100%;

            max-width: 360px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .judge-btn {

            height: 48px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 500;

            transition:
                transform 0.12s ease;
        }


        .judge-btn:active {

            transform: scale(0.97);
        }


        .understood-btn {

            background: #222;

            color: #fff;
        }


        .not-understood-btn {

            background: #f0f1f3;

            color: #444;
        }


        /* =================================================
           下一句
           ================================================= */

        .next-btn {

            width: 100%;

            max-width: 360px;

            height: 48px;

            border: none;

            border-radius: 12px;

            background: #222;

            color: #fff;

            cursor: pointer;

            font-size: 14px;

            font-weight: 500;

            transition:
                transform 0.12s ease;
        }


        .next-btn:active {

            transform: scale(0.97);
        }


        /* =================================================
           底部
           ================================================= */

        .footer {

            margin-top: 16px;

            text-align: center;

            color: #aaa;

            font-size: 11px;

            line-height: 1.7;
        }


        .footer-shortcuts {

            margin-top: 3px;

            opacity: 0.8;
        }


        /* =================================================
           小屏手机
           ================================================= */

        @media (max-width: 380px) {

            .app {

                padding:
                    15px
                    12px
                    24px;
            }


            .card {

                min-height: 450px;

                padding:
                    24px
                    17px
                    22px;
            }


            .english {

                font-size: 19px;
            }


            .chinese {

                font-size: 15px;
            }


            .play-btn {

                width: 66px;

                height: 66px;
            }


            .actions {

                margin-top: 18px;
            }
        }

    </style>

</head>


<body>

<div class="app">


    <!-- =================================================
         顶部
         ================================================= -->

    <header class="header">

        <div>

            <div class="title">
                胖哥学英语
            </div>

            <div class="subtitle">
                听一句 · 想意思 · 看答案
            </div>

        </div>


        <div class="today-count">

            今日<br>

            <strong id="todayCount">
                0
            </strong>
            句

        </div>

    </header>


    <!-- =================================================
         进度
         ================================================= -->

    <div class="progress-area">

        <div class="progress-info">

            <span id="progressText">
                1 / 300
            </span>

            <span id="progressPercent">
                0%
            </span>

        </div>


        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>

    </div>


    <!-- =================================================
         主卡片
         ================================================= -->

    <main class="card">


        <!-- 第几句 -->

        <div
            id="questionLabel"
            class="question-label"
        >
            第 1 句
        </div>


        <!-- =================================================
             句子
             ================================================= -->

        <div
            id="sentenceArea"
            class="sentence-placeholder"
        >

            <div class="hidden-text">

                🔊 先听英语

                <br>

                <span style="font-size:13px;">
                    想一想它是什么意思
                </span>

            </div>

        </div>


        <!-- =================================================
             答案
             ================================================= -->

        <div
            id="answer"
            class="answer"
        >

            <div
                id="englishText"
                class="english"
            ></div>


            <div
                id="chineseText"
                class="chinese"
            ></div>

        </div>


        <!-- =================================================
             播放按钮
             ================================================= -->

        <div class="play-wrapper">

            <button
                id="playBtn"
                class="play-btn"
                type="button"
                aria-label="播放英语"
            >
                ▶
            </button>


            <div class="play-hint">
                点击播放
            </div>

        </div>


        <!-- =================================================
             操作按钮
             ================================================= -->

        <div class="actions">


            <!-- 显示答案 -->

            <button
                id="showAnswerBtn"
                class="answer-btn"
                type="button"
            >
                显示答案
            </button>


            <!-- 听懂 / 没听懂 -->

            <div class="judge-row">

                <button
                    id="understoodBtn"
                    class="judge-btn understood-btn"
                    type="button"
                >
                    ✓ 听懂了
                </button>


                <button
                    id="notUnderstoodBtn"
                    class="judge-btn not-understood-btn"
                    type="button"
                >
                    ? 没听懂
                </button>

            </div>


            <!-- 下一句 -->

            <button
                id="nextBtn"
                class="next-btn"
                type="button"
            >
                下一句 →
            </button>

        </div>

    </main>


    <!-- =================================================
         底部
         ================================================= -->

    <footer class="footer">

        <div>
            随机复习会优先播放“没听懂”的句子
        </div>

        <div class="footer-shortcuts">
            空格：播放　 Enter：答案 / 下一句　 →：下一句
        </div>

    </footer>

</div>


<!-- =========================================================
     加载句子库
     ========================================================= -->

<script src="./data/listening-sentences.js?v=20260905"></script>


<script>

/* =========================================================
   1. 检查句子库
   ========================================================= */

if (
    !window.listeningSentences ||
    !Array.isArray(window.listeningSentences) ||
    window.listeningSentences.length === 0
) {

    document.getElementById(
        "sentenceArea"
    ).innerHTML = `

        <div style="
            color:#d33;
            line-height:1.8;
            font-size:14px;
        ">

            句子库加载失败。

            <br><br>

            请检查：

            <br>

            data/listening-sentences.js

        </div>

    `;

    throw new Error(
        "listeningSentences 未加载"
    );
}


/* =========================================================
   2. 句子库
   ========================================================= */

const sentences =
    window.listeningSentences;


/* =========================================================
   3. 状态
   ========================================================= */

let currentIndex = 0;


function getLocalDateKey() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


let todayKey =
    getLocalDateKey();


const STORAGE_KEY =
    "pangge_english_listening_v3";


/* =========================================================
   4. 创建默认进度
   ========================================================= */

function createEmptyProgress() {

    return {

        current: 0,

        understood: {},

        notUnderstood: {},

        today: {},

        todayKey: todayKey

    };
}


/* =========================================================
   5. 读取进度
   ========================================================= */

function loadProgress() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            return createEmptyProgress();

        }


        const data =
            JSON.parse(saved);


        /*
         * 新的一天：
         *
         * 清空今日数量，
         * 保留历史学习状态。
         */

        if (
            data.todayKey !== todayKey
        ) {

            data.today = {};

            data.todayKey =
                todayKey;
        }


        if (!data.understood) {

            data.understood = {};
        }


        if (!data.notUnderstood) {

            data.notUnderstood = {};
        }


        if (!data.today) {

            data.today = {};
        }


        return data;

    } catch (error) {

        console.warn(
            "读取学习进度失败：",
            error
        );

        return createEmptyProgress();

    }
}


let progress =
    loadProgress();


/* =========================================================
   6. 保存进度
   ========================================================= */

function saveProgress() {

    try {

        progress.current =
            currentIndex;

        progress.todayKey =
            todayKey;


        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(progress)

        );

    } catch (error) {

        console.warn(
            "保存学习进度失败：",
            error
        );

    }
}


/* =========================================================
   7. DOM
   ========================================================= */

const sentenceArea =
    document.getElementById(
        "sentenceArea"
    );


const answer =
    document.getElementById(
        "answer"
    );


const englishText =
    document.getElementById(
        "englishText"
    );


const chineseText =
    document.getElementById(
        "chineseText"
    );


const questionLabel =
    document.getElementById(
        "questionLabel"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const progressPercent =
    document.getElementById(
        "progressPercent"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const todayCount =
    document.getElementById(
        "todayCount"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


/* =========================================================
   8. SpeechSynthesis 状态
   ========================================================= */

let speechToken = 0;

let isSpeaking = false;

let speechTimer = null;


/* =========================================================
   9. 停止语音
   ========================================================= */

function stopSpeech() {

    /*
     * 让之前的播放任务失效
     */

    speechToken++;

    isSpeaking = false;


    /*
     * 清除等待播放
     */

    if (
        speechTimer !== null
    ) {

        clearTimeout(
            speechTimer
        );

        speechTimer = null;
    }


    /*
     * 停止浏览器语音
     */

    if (
        "speechSynthesis" in window
    ) {

        try {

            window.speechSynthesis.cancel();

        } catch (error) {

            console.warn(
                "停止语音失败：",
                error
            );

        }
    }


    /*
     * 恢复按钮
     */

    playBtn.classList.remove(
        "playing"
    );

    playBtn.textContent =
        "▶";
}


/* =========================================================
   10. 播放当前句子
   ========================================================= */

function speakCurrent() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "你的浏览器不支持英语语音播放。"
        );

        return;
    }


    const text =
        sentences[currentIndex].en;


    if (!text) {

        return;
    }


    /*
     * 正在播放时，
     * 再点击一次停止。
     */

    if (isSpeaking) {

        stopSpeech();

        return;
    }


    /*
     * 让旧任务失效
     */

    speechToken++;

    const currentToken =
        speechToken;


    /*
     * 取消旧语音
     */

    try {

        window.speechSynthesis.cancel();

    } catch (error) {}


    playBtn.classList.remove(
        "playing"
    );

    playBtn.textContent =
        "▶";


    /*
     * 延迟 150ms 再播放。
     *
     * 这是为了避免：
     *
     * cancel()
     * ↓
     * speak()
     *
     * 连续执行造成浏览器语音引擎异常。
     */

    speechTimer =
        setTimeout(
            function () {

                speechTimer =
                    null;


                if (
                    currentToken !==
                    speechToken
                ) {

                    return;
                }


                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                /*
                 * 美式英语
                 */

                utterance.lang =
                    "en-US";


                /*
                 * 稍慢一点，
                 * 适合英语学习。
                 */

                utterance.rate =
                    0.82;


                utterance.pitch =
                    1;


                utterance.volume =
                    1;


                /*
                 * 开始
                 */

                utterance.onstart =
                    function () {

                        if (
                            currentToken !==
                            speechToken
                        ) {

                            try {

                                window.speechSynthesis.cancel();

                            } catch (error) {}

                            return;
                        }


                        isSpeaking =
                            true;


                        playBtn.classList.add(
                            "playing"
                        );


                        playBtn.textContent =
                            "■";
                    };


                /*
                 * 播放结束
                 */

                utterance.onend =
                    function () {

                        if (
                            currentToken !==
                            speechToken
                        ) {

                            return;
                        }


                        isSpeaking =
                            false;


                        playBtn.classList.remove(
                            "playing"
                        );


                        playBtn.textContent =
                            "▶";
                    };


                /*
                 * 播放错误
                 */

                utterance.onerror =
                    function (event) {

                        if (
                            currentToken !==
                            speechToken
                        ) {

                            return;
                        }


                        console.warn(
                            "SpeechSynthesis error:",
                            event
                        );


                        isSpeaking =
                            false;


                        playBtn.classList.remove(
                            "playing"
                        );


                        playBtn.textContent =
                            "▶";
                    };


                /*
                 * 真正播放
                 */

                try {

                    window.speechSynthesis.speak(
                        utterance
                    );

                } catch (error) {

                    console.error(
                        "语音播放失败：",
                        error
                    );


                    isSpeaking =
                        false;


                    playBtn.classList.remove(
                        "playing"
                    );


                    playBtn.textContent =
                        "▶";
                }

            },

            150
        );
}


/* =========================================================
   11. 加载当前句子
   ========================================================= */

function loadCurrent() {

    /*
     * 换句子时停止语音
     */

    stopSpeech();


    const item =
        sentences[currentIndex];


    /*
     * 隐藏答案
     */

    answer.classList.remove(
        "show"
    );


    /*
     * 恢复提示
     */

    sentenceArea.innerHTML = `

        <div class="hidden-text">

            🔊 先听英语

            <br>

            <span style="font-size:13px;">
                想一想它是什么意思
            </span>

        </div>

    `;


    /*
     * 设置答案
     */

    englishText.textContent =
        item.en;


    chineseText.textContent =
        item.zh;


    /*
     * 第几句
     */

    questionLabel.textContent =
        `第 ${currentIndex + 1} 句`;


    /*
     * 更新进度
     */

    updateProgress();


    /*
     * 保存
     */

    saveProgress();
}


/* =========================================================
   12. 显示答案
   ========================================================= */

function showAnswer() {

    /*
     * 显示答案时停止语音
     */

    stopSpeech();


    answer.classList.add(
        "show"
    );
}


/* =========================================================
   13. 今日学习记录
   ========================================================= */

function recordToday() {

    const key =
        String(currentIndex);


    if (
        !progress.today[key]
    ) {

        progress.today[key] =
            true;
    }


    saveProgress();


    updateTodayCount();
}


/* =========================================================
   14. 听懂了
   ========================================================= */

function markUnderstood() {

    stopSpeech();


    const key =
        String(currentIndex);


    progress.understood[key] =
        true;


    delete progress.notUnderstood[key];


    recordToday();


    nextSentence();
}


/* =========================================================
   15. 没听懂
   ========================================================= */

function markNotUnderstood() {

    stopSpeech();


    const key =
        String(currentIndex);


    progress.notUnderstood[key] =
        true;


    delete progress.understood[key];


    recordToday();


    saveProgress();


    nextSentence();
}


/* =========================================================
   16. 下一句
   ========================================================= */

function nextSentence() {

    stopSpeech();


    currentIndex++;


    if (
        currentIndex >=
        sentences.length
    ) {

        currentIndex = 0;


        alert(
            "🎉 这一轮已经完成！\n\n继续下一轮吧。"
        );
    }


    loadCurrent();
}


/* =========================================================
   17. 随机复习
   ========================================================= */

function randomSentence() {

    stopSpeech();


    const difficultIndexes =
        Object.keys(
            progress.notUnderstood
        )
        .map(
            index =>
                Number(index)
        )
        .filter(
            index =>
                index >= 0 &&
                index < sentences.length
        );


    /*
     * 优先选择没听懂的句子
     */

    if (
        difficultIndexes.length > 0
    ) {

        const randomPosition =
            Math.floor(
                Math.random() *
                difficultIndexes.length
            );


        currentIndex =
            difficultIndexes[
                randomPosition
            ];

    } else {

        currentIndex =
            Math.floor(
                Math.random() *
                sentences.length
            );
    }


    loadCurrent();


    /*
     * 随机复习自动播放
     */

    setTimeout(
        function () {

            speakCurrent();

        },
        250
    );
}


/* =========================================================
   18. 更新进度
   ========================================================= */

function updateProgress() {

    const total =
        sentences.length;


    const current =
        currentIndex + 1;


    const percent =
        Math.round(
            (current / total) *
            100
        );


    progressText.textContent =
        `${current} / ${total}`;


    progressPercent.textContent =
        `${percent}%`;


    progressFill.style.width =
        `${percent}%`;
}


/* =========================================================
   19. 今日数量
   ========================================================= */

function updateTodayCount() {

    const count =
        Object.keys(
            progress.today
        ).length;


    todayCount.textContent =
        count;
}


/* =========================================================
   20. 按钮事件
   ========================================================= */

playBtn.addEventListener(
    "click",
    function () {

        speakCurrent();

    }
);


document
    .getElementById(
        "showAnswerBtn"
    )
    .addEventListener(
        "click",
        function () {

            showAnswer();

        }
    );


document
    .getElementById(
        "understoodBtn"
    )
    .addEventListener(
        "click",
        function () {

            markUnderstood();

        }
    );


document
    .getElementById(
        "notUnderstoodBtn"
    )
    .addEventListener(
        "click",
        function () {

            markNotUnderstood();

        }
    );


document
    .getElementById(
        "nextBtn"
    )
    .addEventListener(
        "click",
        function () {

            nextSentence();

        }
    );


/* =========================================================
   21. 键盘快捷键
   ========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.target.tagName ===
            "INPUT" ||
            event.target.tagName ===
            "TEXTAREA"
        ) {

            return;
        }


        /*
         * 空格
         */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            speakCurrent();

            return;
        }


        /*
         * Enter
         */

        if (
            event.code ===
            "Enter"
        ) {

            event.preventDefault();


            if (
                answer.classList.contains(
                    "show"
                )
            ) {

                nextSentence();

            } else {

                showAnswer();

            }

            return;
        }


        /*
         * 右方向键
         */

        if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextSentence();

        }

    }
);


/* =========================================================
   22. 页面进入后台
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.hidden
        ) {

            stopSpeech();

        }

    }
);


/* =========================================================
   23. 页面关闭 / 返回
   ========================================================= */

window.addEventListener(
    "pagehide",
    function () {

        stopSpeech();

    }
);


/* =========================================================
   24. 页面恢复
   ========================================================= */

window.addEventListener(
    "pageshow",
    function () {

        stopSpeech();

    }
);


/* =========================================================
   25. SpeechSynthesis 保护
   ========================================================= */

function keepSpeechEngineAlive() {

    if (
        document.hidden
    ) {

        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    try {

        if (
            window.speechSynthesis.paused
        ) {

            window.speechSynthesis.resume();

        }

    } catch (error) {

        console.warn(
            "SpeechSynthesis resume failed:",
            error
        );

    }
}


setInterval(
    keepSpeechEngineAlive,
    8000
);


/* =========================================================
   26. 初始化
   ========================================================= */

if (
    Number.isInteger(
        progress.current
    ) &&
    progress.current >= 0 &&
    progress.current < sentences.length
) {

    currentIndex =
        progress.current;

} else {

    currentIndex = 0;
}


loadCurrent();


updateTodayCount();


stopSpeech();


/* =========================================================
   27. 控制台
   ========================================================= */

console.log(
    "胖哥学英语已加载"
);


console.log(
    `句子数量：${sentences.length}`
);


console.log(
    `当前位置：${currentIndex + 1}`
);

</script>

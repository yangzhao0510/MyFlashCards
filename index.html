<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>胖哥学英语 · 听句子</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f8fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    color: #222;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 20px 18px 28px;
    display: flex;
    flex-direction: column;
}

/* 顶部 */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #222;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.logo-text {
    font-size: 18px;
    font-weight: 700;
}

.logo-sub {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
}

.stats {
    text-align: right;
    color: #888;
    font-size: 12px;
}

.stats strong {
    display: block;
    color: #222;
    font-size: 17px;
}

/* 主区域 */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* 进度 */
.progress-wrap {
    margin-bottom: 18px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #999;
    margin-bottom: 7px;
}

.progress {
    width: 100%;
    height: 4px;
    background: #e7e7e7;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0;
    height: 100%;
    background: #222;
    border-radius: 10px;
    transition: width .3s ease;
}

/* 听力区域 */
.listen-card {
    flex: 1;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* 序号 */
.number {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 28px;
}

/* 播放 */
.play-btn {
    width: 92px;
    height: 92px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 35px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    transition: transform .15s ease;
}

.play-btn:active {
    transform: scale(.94);
}

.playing {
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(0,0,0,.18);
    }
    70% {
        box-shadow: 0 0 0 18px rgba(0,0,0,0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
    }
}

.play-hint {
    margin-top: 16px;
    font-size: 13px;
    color: #999;
}

/* 提问 */
.question {
    margin-top: 38px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.6;
}

/* 答案 */
.answer {
    width: 100%;
    margin-top: 28px;
    padding: 18px 16px;
    border-radius: 14px;
    background: white;
    text-align: left;
    box-shadow: 0 3px 15px rgba(0,0,0,.04);
    display: none;
}

.answer.show {
    display: block;
}

.english {
    font-size: 17px;
    line-height: 1.65;
    font-weight: 600;
}

.chinese {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    color: #666;
    font-size: 15px;
    line-height: 1.7;
}

/* 按钮 */
.actions {
    margin-top: 24px;
}

.answer-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.after-answer {
    display: none;
}

.after-answer.show {
    display: block;
}

.small-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.small-btn {
    height: 46px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #333;
    font-size: 14px;
    cursor: pointer;
}

.small-btn:active,
.answer-btn:active {
    transform: scale(.98);
}

.next-btn {
    width: 100%;
    height: 48px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: #f0f0f0;
    color: #222;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

/* 底部 */
.footer {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.footer button {
    border: none;
    background: none;
    color: #999;
    font-size: 12px;
    cursor: pointer;
}

/* 今日完成 */
.today {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #aaa;
}

/* 手机 */
@media (max-width: 420px) {
    .app {
        padding: 16px 15px 22px;
    }

    .listen-card {
        min-height: 390px;
    }

    .question {
        font-size: 17px;
    }

    .play-btn {
        width: 86px;
        height: 86px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">

            <div class="avatar">胖</div>

            <div>
                <div class="logo-text">胖哥学英语</div>
                <div class="logo-sub">听句子</div>
            </div>

        </div>

        <div class="stats">
            <strong id="todayCount">0</strong>
            今日完成
        </div>

    </header>


    <main class="main">

        <div class="progress-wrap">

            <div class="progress-info">
                <span id="progressText">第 1 句</span>
                <span id="totalText">共 300 句</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>


        <section class="listen-card">

            <div class="number" id="sentenceNumber">
                Sentence 1
            </div>

            <button
                class="play-btn"
                id="playBtn"
                onclick="speakCurrent()">
                ▶
            </button>

            <div class="play-hint">
                先听句子，想一想是什么意思
            </div>


            <div class="question">
                这句话是什么意思？
            </div>


            <div class="answer" id="answer">

                <div class="english" id="english"></div>

                <div class="chinese" id="chinese"></div>

            </div>


            <div class="actions">

                <button
                    class="answer-btn"
                    id="answerBtn"
                    onclick="showAnswer()">
                    显示答案
                </button>


                <div
                    class="after-answer"
                    id="afterAnswer">

                    <div class="small-actions">

                        <button
                            class="small-btn"
                            onclick="speakCurrent()">
                            🔊 再听一次
                        </button>

                        <button
                            class="small-btn"
                            onclick="markNotUnderstand()">
                            没听懂
                        </button>

                    </div>

                    <button
                        class="next-btn"
                        onclick="markUnderstand()">
                        听懂了 · 下一句 →
                    </button>

                </div>

            </div>

        </section>


        <div class="today">
            今日已听 <span id="todayDone">0</span> 句
        </div>

    </main>


    <footer class="footer">

        <button onclick="randomSentence()">
            随机复习
        </button>

        <button onclick="resetToday()">
            重置今日
        </button>

    </footer>

</div>

    zh: "我会一直练习，直到我能轻松听懂。"
}

];


/* =========================================================
   状态
   ========================================================= */

let currentIndex = 0;

let todayKey =
    new Date().toISOString().slice(0, 10);

let progress = loadProgress();


/* =========================================================
   初始化
   ========================================================= */

document.getElementById("totalText").textContent =
    "共 " + sentences.length + " 句";

loadCurrent();


/* =========================================================
   本地数据
   ========================================================= */

function loadProgress() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem("pangge_english_listening")
            );

        if (data) {
            return data;
        }

    } catch (e) {}

    return {
        current: 0,
        understood: {},
        notUnderstood: {},
        today: {}
    };
}


function saveProgress() {

    localStorage.setItem(
        "pangge_english_listening",
        JSON.stringify(progress)
    );

}


/* =========================================================
   加载句子
   ========================================================= */

function loadCurrent() {

    if (currentIndex < 0) {
        currentIndex = 0;
    }

    if (currentIndex >= sentences.length) {
        currentIndex = 0;
    }

    progress.current = currentIndex;

    saveProgress();

    const item = sentences[currentIndex];

    document.getElementById("sentenceNumber")
        .textContent =
        "Sentence " + (currentIndex + 1);

    document.getElementById("progressText")
        .textContent =
        "第 " + (currentIndex + 1) + " 句";

    const percent =
        ((currentIndex + 1) / sentences.length) * 100;

    document.getElementById("progressBar")
        .style.width =
        percent + "%";

    document.getElementById("english")
        .textContent = item.en;

    document.getElementById("chinese")
        .textContent = item.zh;

    document.getElementById("answer")
        .classList.remove("show");

    document.getElementById("afterAnswer")
        .classList.remove("show");

    document.getElementById("answerBtn")
        .style.display = "block";

    updateToday();

}


/* =========================================================
   播放
   ========================================================= */

function speakCurrent() {

    if (!("speechSynthesis" in window)) {

        alert("你的浏览器不支持英语语音播放。");

        return;
    }

    window.speechSynthesis.cancel();

    const text =
        sentences[currentIndex].en;

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.82;

    utterance.pitch = 1;

    utterance.volume = 1;

    const btn =
        document.getElementById("playBtn");

    btn.classList.add("playing");

    utterance.onend = function () {

        btn.classList.remove("playing");

    };

    utterance.onerror = function () {

        btn.classList.remove("playing");

    };

    window.speechSynthesis.speak(utterance);

}


/* =========================================================
   显示答案
   ========================================================= */

function showAnswer() {

    document.getElementById("answer")
        .classList.add("show");

    document.getElementById("afterAnswer")
        .classList.add("show");

    document.getElementById("answerBtn")
        .style.display = "none";

}


/* =========================================================
   听懂
   ========================================================= */

function markUnderstand() {

    progress.understood[currentIndex] = true;

    delete progress.notUnderstood[currentIndex];

    addTodayRecord();

    saveProgress();

    nextSentence();

}


/* =========================================================
   没听懂
   ========================================================= */

function markNotUnderstand() {

    progress.notUnderstood[currentIndex] = true;

    delete progress.understood[currentIndex];

    addTodayRecord();

    saveProgress();

    nextSentence();

}


/* =========================================================
   下一句
   ========================================================= */

function nextSentence() {

    window.speechSynthesis.cancel();

    currentIndex++;

    if (currentIndex >= sentences.length) {

        currentIndex = 0;

        alert(
            "🎉 这一轮已经完成！\n\n继续下一轮吧。"
        );

    }

    loadCurrent();

}


/* =========================================================
   今日记录
   ========================================================= */

function addTodayRecord() {

    if (!progress.today[todayKey]) {

        progress.today[todayKey] = {};

    }

    progress.today[todayKey][currentIndex] = true;

}


function updateToday() {

    const today =
        progress.today[todayKey] || {};

    const count =
        Object.keys(today).length;

    document.getElementById("todayCount")
        .textContent = count;

    document.getElementById("todayDone")
        .textContent = count;

}


/* =========================================================
   随机复习
   ========================================================= */

function randomSentence() {

    window.speechSynthesis.cancel();

    const indexes = [];

    for (
        let i = 0;
        i < sentences.length;
        i++
    ) {

        if (
            progress.notUnderstood[i]
        ) {

            indexes.push(i);

        }

    }

    let target;

    /*
     * 优先随机复习没听懂的句子
     */
    if (indexes.length > 0) {

        target =
            indexes[
                Math.floor(
                    Math.random() * indexes.length
                )
            ];

    } else {

        target =
            Math.floor(
                Math.random() * sentences.length
            );

    }

    currentIndex = target;

    loadCurrent();

}


/* =========================================================
   重置今日
   ========================================================= */

function resetToday() {

    const ok =
        confirm(
            "确定要重置今天的学习记录吗？"
        );

    if (!ok) {
        return;
    }

    delete progress.today[todayKey];

    saveProgress();

    updateToday();

}


/* =========================================================
   键盘操作
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.code === "Space") {

            e.preventDefault();

            speakCurrent();

        }

        if (e.key === "Enter") {

            const answer =
                document.getElementById("answer");

            if (
                !answer.classList.contains("show")
            ) {

                showAnswer();

            } else {

                nextSentence();

            }

        }

        if (e.key === "ArrowRight") {

            nextSentence();

        }

    }
);


/* =========================================================
   防止页面切换后语音继续播放
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {

            window.speechSynthesis.cancel();

            document
                .getElementById("playBtn")
                .classList.remove("playing");

        }

    }
);

</script>

</body>
</html>

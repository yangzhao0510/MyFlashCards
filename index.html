<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>胖哥学英语</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "Noto Sans SC",
        sans-serif;

    background: #f5f7fb;

    color: #111827;

    overflow-x: hidden;
}

body.dark {

    background: #0f172a;

    color: #f8fafc;
}


/* =========================
   Header
========================= */

header {

    width: 100%;

    min-height: 70px;

    padding: 12px 20px;

    background: white;

    border-bottom: 1px solid #e5e7eb;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: sticky;

    top: 0;

    z-index: 10;
}

body.dark header {

    background: #1e293b;

    border-color: #334155;
}


.brand {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo {

    width: 44px;

    height: 44px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );
}

.brand h1 {

    margin: 0;

    font-size: 20px;
}

.brand p {

    margin: 2px 0 0;

    font-size: 12px;

    color: #6b7280;
}

.theme {

    width: 42px;

    height: 42px;

    border-radius: 10px;

    border: 1px solid #e5e7eb;

    background: white;

    cursor: pointer;

    font-size: 18px;
}


/* =========================
   Main
========================= */

main {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding:
        clamp(20px,4vw,40px)
        clamp(14px,4vw,25px)
        50px;
}


/* =========================
   Controls
========================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}

.controls-left {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;

    flex: 1;
}

.controls label {

    color: #6b7280;

    white-space: nowrap;
}

select {

    width: 280px;

    max-width: 100%;

    min-height: 44px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    padding: 8px 12px;

    background: white;

    color: #111827;
}

.random {

    min-height: 44px;

    padding: 0 18px;

    border: none;

    border-radius: 10px;

    background: #4f46e5;

    color: white;

    font-weight: 600;

    cursor: pointer;
}


/* =========================
   Stats
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 15px;

    margin-bottom: 30px;
}

.stat {

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    padding: 18px;
}

.stat-label {

    color: #6b7280;

    font-size: 13px;

    margin-bottom: 8px;
}

.stat-value {

    font-size: 28px;

    font-weight: 800;
}


/* =========================
   Card
========================= */

.card-container {

    width: 100%;

    max-width: 760px;

    height:
        clamp(
            350px,
            55vh,
            460px
        );

    margin:
        auto auto 25px;

    perspective: 1200px;
}

.card {

    width: 100%;

    height: 100%;

    position: relative;

    transform-style:
        preserve-3d;

    transition:
        transform .55s;

    cursor: pointer;
}

.card.flipped {

    transform:
        rotateY(180deg);
}

.face {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

    border-radius: 24px;

    background: white;

    border:
        1px solid #e5e7eb;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);

    backface-visibility:
        hidden;

    overflow: auto;
}

.back {

    transform:
        rotateY(180deg);
}

.label {

    font-size: 12px;

    letter-spacing: 2px;

    color: #6b7280;

    margin-bottom: 18px;
}

.word {

    font-size:
        clamp(
            42px,
            8vw,
            72px
        );

    font-weight: 800;

    overflow-wrap: anywhere;
}

.phonetic {

    margin-top: 12px;

    font-size: 19px;

    color: #6b7280;
}

.hint {

    margin-top: 25px;

    font-size: 14px;

    color: #9ca3af;
}

.meaning {

    font-size:
        clamp(
            25px,
            5vw,
            40px
        );

    font-weight: 700;

    margin-bottom: 20px;
}

.example {

    max-width: 650px;

    line-height: 1.7;

    font-size: 18px;
}

.example-cn {

    margin-top: 7px;

    color: #6b7280;

    line-height: 1.6;
}

.audio {

    margin-top: 20px;

    padding: 10px 18px;

    border: none;

    border-radius: 10px;

    background: #f3f4f6;

    cursor: pointer;
}


/* =========================
   Progress
========================= */

.progress {

    max-width: 760px;

    margin: auto auto 25px;
}

.progress-info {

    display: flex;

    justify-content: space-between;

    color: #6b7280;

    font-size: 13px;

    margin-bottom: 7px;
}

.progress-bar {

    height: 8px;

    border-radius: 10px;

    background: #e5e7eb;

    overflow: hidden;
}

.progress-value {

    width: 0%;

    height: 100%;

    background: #4f46e5;

    transition: width .3s;
}


/* =========================
   Buttons
========================= */

.actions {

    max-width: 760px;

    margin: auto auto 20px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}

.action {

    min-height: 50px;

    border: none;

    border-radius: 12px;

    font-weight: 700;

    cursor: pointer;
}

.unknown {

    background: #fee2e2;

    color: #dc2626;
}

.known {

    background: #dcfce7;

    color: #16a34a;
}


.navigation {

    max-width: 760px;

    margin: auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.nav {

    min-height: 46px;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    background: white;

    cursor: pointer;
}


/* =========================
   Loading
========================= */

.loading {

    min-height: 400px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 15px;

    color: #6b7280;
}

.spinner {

    width: 38px;

    height: 38px;

    border:
        4px solid #e5e7eb;

    border-top-color:
        #4f46e5;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================
   Error
========================= */

.error {

    max-width: 760px;

    margin: 30px auto;

    padding: 25px;

    border-radius: 15px;

    background: white;

    border:
        1px solid #fecaca;

    color: #b91c1c;

    line-height: 1.8;

    word-break: break-word;
}


/* =========================
   Mobile
========================= */

@media (max-width:700px) {

    header {

        padding:
            10px 14px;
    }

    .brand h1 {

        font-size: 17px;
    }

    .brand p {

        display: none;
    }

    .logo {

        width: 38px;

        height: 38px;

        font-size: 22px;
    }

    main {

        padding:
            20px 14px 40px;
    }

    .controls {

        flex-direction:
            column;

        align-items:
            stretch;
    }

    .controls-left {

        width: 100%;
    }

    select {

        flex: 1;

        width: 100%;
    }

    .random {

        width: 100%;
    }

    .stats {

        grid-template-columns:
            repeat(2,1fr);

        gap: 10px;
    }

    .stat {

        padding: 14px;
    }

    .stat-value {

        font-size: 23px;
    }

    .card-container {

        height:
            min(
                58vh,
                420px
            );

        min-height: 330px;
    }

    .face {

        padding: 20px;
    }

    .word {

        font-size:
            clamp(
                38px,
                12vw,
                58px
            );
    }

    .meaning {

        font-size:
            clamp(
                24px,
                8vw,
                34px
            );
    }

    .example {

        font-size: 16px;
    }

}


/* =========================
   Dark
========================= */

body.dark .stat,
body.dark .face,
body.dark .nav,
body.dark .error {

    background: #1e293b;

    border-color: #334155;
}

body.dark select,
body.dark .theme {

    background: #1e293b;

    color: #f8fafc;

    border-color: #334155;
}

body.dark .audio {

    background: #334155;

    color: white;
}

body.dark .nav {

    color: white;
}

body.dark .stat-label,
body.dark .phonetic,
body.dark .hint,
body.dark .example-cn {

    color: #94a3b8;
}

</style>

</head>


<body>


<header>

    <div class="brand">

        <div class="logo">
            🐼
        </div>

        <div>

            <h1>
                胖哥学英语
            </h1>

            <p>
                English Flash Cards
            </p>

        </div>

    </div>


    <button
        class="theme"
        id="themeButton">

        🌙

    </button>

</header>


<main>


    <div class="controls">

        <div class="controls-left">

            <label>
                📚 词库
            </label>

            <select
                id="deckSelect">

                <option>
                    加载中...
                </option>

            </select>

        </div>


        <button
            class="random"
            id="randomButton">

            🎲 随机单词

        </button>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                词库总数
            </div>

            <div
                class="stat-value"
                id="totalWords">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                已学习
            </div>

            <div
                class="stat-value"
                id="learnedWords">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                已掌握
            </div>

            <div
                class="stat-value"
                id="knownWords">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                掌握率
            </div>

            <div
                class="stat-value"
                id="masteryRate">

                0%

            </div>

        </div>

    </div>


    <div
        id="loading"
        class="loading">

        <div class="spinner"></div>

        <div id="loadingText">
            正在加载最新词库...
        </div>

    </div>


    <div
        id="error"
        class="error"
        style="display:none;">
    </div>


    <div
        id="learningArea"
        style="display:none;">


        <div class="card-container">

            <div
                class="card"
                id="card">


                <div class="face front">

                    <div class="label">
                        ENGLISH
                    </div>

                    <div
                        class="word"
                        id="word">
                    </div>

                    <div
                        class="phonetic"
                        id="phonetic">
                    </div>

                    <div class="hint">
                        点击卡片查看中文
                    </div>

                    <button
                        class="audio"
                        id="audioButton">

                        🔊 听发音

                    </button>

                </div>


                <div class="face back">

                    <div class="label">
                        中文释义
                    </div>

                    <div
                        class="meaning"
                        id="meaning">
                    </div>

                    <div
                        class="example"
                        id="example">
                    </div>

                    <div
                        class="example-cn"
                        id="exampleCn">
                    </div>

                    <button
                        class="audio"
                        id="audioButtonBack">

                        🔊 再听一次

                    </button>

                </div>

            </div>

        </div>


        <div class="progress">

            <div class="progress-info">

                <span>
                    当前进度
                </span>

                <span
                    id="progressText">
                    0 / 0
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-value"
                    id="progressValue">
                </div>

            </div>

        </div>


        <div class="actions">

            <button
                class="action unknown"
                id="unknownButton">

                ❌ 不认识

            </button>

            <button
                class="action known"
                id="knownButton">

                ❤️ 已掌握

            </button>

        </div>


        <div class="navigation">

            <button
                class="nav"
                id="previousButton">

                ← 上一个

            </button>

            <button
                class="nav"
                id="nextButton">

                下一个 →

            </button>

        </div>

    </div>

</main>


<script>


/* =====================================================
   关键配置

   使用 GitHub Pages 的绝对路径。
===================================================== */

const SITE_ROOT =
    "/MyFlashCards/";


const DATA_ROOT =
    SITE_ROOT + "data/";


const DECK_INDEX =
    DATA_ROOT + "index.json";


/* =====================================================
   全局变量
===================================================== */

let decks = [];

let words = [];

let currentDeck = null;

let currentIndex = 0;

let progress = {};


/* =====================================================
   获取最新 JSON

   重点：

   1. 时间戳
   2. no-store
   3. 10 秒超时
   4. 错误直接抛出
===================================================== */

async function getJSON(url) {

    const finalUrl =
        url +
        "?_=" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);


    console.log(
        "Loading:",
        finalUrl
    );


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => controller.abort(),
            10000
        );


    try {

        const response =
            await fetch(
                finalUrl,
                {
                    method: "GET",

                    cache: "no-store",

                    signal:
                        controller.signal,

                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        if (!text.trim()) {

            throw new Error(
                "服务器返回空内容"
            );

        }


        try {

            return JSON.parse(text);

        }
        catch (e) {

            throw new Error(
                "JSON 格式错误：" +
                e.message
            );

        }

    }
    catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "请求超时（10 秒）"
            );

        }

        throw error;

    }
    finally {

        clearTimeout(
            timeout
        );

    }

}


/* =====================================================
   初始化
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    loadTheme();

    bindEvents();

    try {

        setLoading(
            "正在连接 GitHub Pages..."
        );


        /*
         * 第一步：
         * 加载词库目录
         */

        setLoading(
            "正在读取 data/index.json..."
        );


        decks =
            await getJSON(
                DECK_INDEX
            );


        console.log(
            "Decks:",
            decks
        );


        if (
            !Array.isArray(decks)
        ) {

            throw new Error(
                "data/index.json 必须是 JSON 数组"
            );

        }


        if (
            decks.length === 0
        ) {

            throw new Error(
                "data/index.json 中没有词库"
            );

        }


        renderDecks();


        /*
         * 第二步：
         * 加载第一个词库
         */

        await loadDeck(
            decks[0].id
        );

    }
    catch (error) {

        console.error(
            "初始化失败：",
            error
        );


        showError(
            error
        );

    }

}


/* =====================================================
   显示加载状态
===================================================== */

function setLoading(text) {

    document.getElementById(
        "loadingText"
    ).textContent =
        text;

}


/* =====================================================
   显示词库
===================================================== */

function renderDecks() {

    const select =
        document.getElementById(
            "deckSelect"
        );


    select.innerHTML = "";


    decks.forEach(
        deck => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                deck.id;


            option.textContent =
                deck.name ||
                deck.id;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   加载词库
===================================================== */

async function loadDeck(id) {

    const deck =
        decks.find(
            item =>
                item.id === id
        );


    if (!deck) {

        throw new Error(
            "找不到词库：" + id
        );

    }


    currentDeck =
        deck;


    setLoading(
        "正在加载：" +
        deck.name
    );


    /*
     * 例如：
     *
     * /MyFlashCards/data/cet4.json
     */

    const url =
        DATA_ROOT +
        deck.file;


    console.log(
        "Loading deck:",
        url
    );


    words =
        await getJSON(
            url
        );


    if (
        !Array.isArray(words)
    ) {

        throw new Error(
            deck.file +
            " 必须是 JSON 数组"
        );

    }


    if (
        words.length === 0
    ) {

        throw new Error(
            deck.file +
            " 中没有单词"
        );

    }


    /*
     * 读取本地学习记录
     */

    loadProgress();


    const saved =
        progress[
            currentDeck.id
        ];


    if (
        saved &&
        typeof saved.currentIndex ===
            "number" &&
        saved.currentIndex >= 0 &&
        saved.currentIndex <
            words.length
    ) {

        currentIndex =
            saved.currentIndex;

    }
    else {

        currentIndex = 0;

    }


    renderWord();


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "learningArea"
    ).style.display =
        "block";


    document.getElementById(
        "error"
    ).style.display =
        "none";

}


/* =====================================================
   显示单词
===================================================== */

function renderWord() {

    if (!words.length) {
        return;
    }


    const item =
        words[currentIndex];


    document.getElementById(
        "word"
    ).textContent =
        item.word || "";


    document.getElementById(
        "phonetic"
    ).textContent =
        item.phonetic || "";


    document.getElementById(
        "meaning"
    ).textContent =
        item.meaning ||
        "暂无释义";


    document.getElementById(
        "example"
    ).textContent =
        item.example || "";


    document.getElementById(
        "exampleCn"
    ).textContent =
        item.example_cn || "";


    document.getElementById(
        "card"
    ).classList.remove(
        "flipped"
    );


    updateStats();

    saveCurrentIndex();

}


/* =====================================================
   统计
===================================================== */

function updateStats() {

    if (!currentDeck) {
        return;
    }


    const data =
        progress[
            currentDeck.id
        ] || {

            known: [],

            unknown: []

        };


    const known =
        data.known.length;


    const unknown =
        data.unknown.length;


    const learned =
        known + unknown;


    const rate =
        words.length
            ? Math.round(
                known /
                words.length *
                100
            )
            : 0;


    document.getElementById(
        "totalWords"
    ).textContent =
        words.length;


    document.getElementById(
        "learnedWords"
    ).textContent =
        learned;


    document.getElementById(
        "knownWords"
    ).textContent =
        known;


    document.getElementById(
        "masteryRate"
    ).textContent =
        rate + "%";


    const percent =
        (
            (currentIndex + 1) /
            words.length
        ) * 100;


    document.getElementById(
        "progressValue"
    ).style.width =
        percent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        `${currentIndex + 1} / ${words.length}`;

}


/* =====================================================
   LocalStorage
===================================================== */

function loadProgress() {

    try {

        const saved =
            localStorage.getItem(
                "pangge_progress"
            );


        progress =
            saved
                ? JSON.parse(saved)
                : {};

    }
    catch {

        progress = {};

    }

}


function saveProgress() {

    localStorage.setItem(
        "pangge_progress",
        JSON.stringify(
            progress
        )
    );

}


function saveCurrentIndex() {

    if (!currentDeck) {
        return;
    }


    if (
        !progress[
            currentDeck.id
        ]
    ) {

        progress[
            currentDeck.id
        ] = {

            known: [],

            unknown: [],

            currentIndex: 0

        };

    }


    progress[
        currentDeck.id
    ].currentIndex =
        currentIndex;


    saveProgress();

}


/* =====================================================
   标记
===================================================== */

function markWord(type) {

    if (!currentDeck) {
        return;
    }


    if (
        !progress[
            currentDeck.id
        ]
    ) {

        progress[
            currentDeck.id
        ] = {

            known: [],

            unknown: [],

            currentIndex: 0

        };

    }


    const data =
        progress[
            currentDeck.id
        ];


    const word =
        words[
            currentIndex
        ].word;


    data.known =
        data.known.filter(
            x => x !== word
        );


    data.unknown =
        data.unknown.filter(
            x => x !== word
        );


    if (
        type === "known"
    ) {

        data.known.push(
            word
        );

    }
    else {

        data.unknown.push(
            word
        );

    }


    saveProgress();

    updateStats();


    setTimeout(
        nextWord,
        150
    );

}


/* =====================================================
   Navigation
===================================================== */

function previousWord() {

    if (!words.length) {
        return;
    }


    currentIndex--;


    if (
        currentIndex < 0
    ) {

        currentIndex =
            words.length - 1;

    }


    renderWord();

}


function nextWord() {

    if (!words.length) {
        return;
    }


    currentIndex++;


    if (
        currentIndex >=
        words.length
    ) {

        currentIndex = 0;

    }


    renderWord();

}


function randomWord() {

    if (
        words.length <= 1
    ) {

        return;

    }


    let index;


    do {

        index =
            Math.floor(
                Math.random() *
                words.length
            );

    }
    while (
        index ===
        currentIndex
    );


    currentIndex =
        index;


    renderWord();

}


/* =====================================================
   发音
===================================================== */

function speak() {

    if (!words.length) {
        return;
    }


    const text =
        words[
            currentIndex
        ].word;


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";


    speech.rate =
        .85;


    speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   Theme
===================================================== */

function loadTheme() {

    if (
        localStorage.getItem(
            "pangge_theme"
        ) === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );


        document.getElementById(
            "themeButton"
        ).textContent =
            "☀️";

    }

}


function toggleTheme() {

    const dark =
        document.body.classList.toggle(
            "dark"
        );


    localStorage.setItem(
        "pangge_theme",
        dark
            ? "dark"
            : "light"
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark
            ? "☀️"
            : "🌙";

}


/* =====================================================
   Events
===================================================== */

function bindEvents() {


    document.getElementById(
        "deckSelect"
    ).addEventListener(
        "change",
        async event => {

            try {

                await loadDeck(
                    event.target.value
                );

            }
            catch (error) {

                showError(
                    error
                );

            }

        }
    );


    document.getElementById(
        "card"
    ).addEventListener(
        "click",
        event => {

            if (
                event.target.closest(
                    ".audio"
                )
            ) {

                return;

            }


            event.currentTarget
                .classList
                .toggle(
                    "flipped"
                );

        }
    );


    document.getElementById(
        "audioButton"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            speak();

        }
    );


    document.getElementById(
        "audioButtonBack"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            speak();

        }
    );


    document.getElementById(
        "randomButton"
    ).addEventListener(
        "click",
        randomWord
    );


    document.getElementById(
        "previousButton"
    ).addEventListener(
        "click",
        previousWord
    );


    document.getElementById(
        "nextButton"
    ).addEventListener(
        "click",
        nextWord
    );


    document.getElementById(
        "knownButton"
    ).addEventListener(
        "click",
        () =>
            markWord("known")
    );


    document.getElementById(
        "unknownButton"
    ).addEventListener(
        "click",
        () =>
            markWord("unknown")
    );


    document.getElementById(
        "themeButton"
    ).addEventListener(
        "click",
        toggleTheme
    );


    document.addEventListener(
        "keydown",
        event => {

            switch (
                event.key
            ) {

                case " ":

                    event.preventDefault();

                    document.getElementById(
                        "card"
                    ).classList.toggle(
                        "flipped"
                    );

                    break;


                case "ArrowLeft":

                    previousWord();

                    break;


                case "ArrowRight":

                    nextWord();

                    break;


                case "r":
                case "R":

                    randomWord();

                    break;


                case "s":
                case "S":

                    speak();

                    break;


                case "k":
                case "K":

                    markWord(
                        "known"
                    );

                    break;


                case "x":
                case "X":

                    markWord(
                        "unknown"
                    );

                    break;

            }

        }
    );

}


/* =====================================================
   错误显示

   不再无限 Loading。
===================================================== */

function showError(error) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "learningArea"
    ).style.display =
        "none";


    const box =
        document.getElementById(
            "error"
        );


    box.style.display =
        "block";


    box.innerHTML = `
        <strong>❌ 词库加载失败</strong>

        <br><br>

        ${error.message}

        <br><br>

        <strong>请检查：</strong>

        <br>

        1. data/index.json 是否存在

        <br>

        2. JSON 文件格式是否正确

        <br>

        3. GitHub Pages 是否已经完成部署

        <br>

        4. 文件名大小写是否完全一致

        <br><br>

        <strong>当前词库目录：</strong>

        <br>

        ${DATA_ROOT}

        <br><br>

        <button
            onclick="location.reload()"
            style="
                padding:10px 18px;
                border:0;
                border-radius:8px;
                background:#4f46e5;
                color:white;
                cursor:pointer;
            "
        >
            🔄 重新加载
        </button>
    `;

}

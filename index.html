<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- 尽量避免浏览器缓存旧版本 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>胖哥学英语 · 听句子</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f7f8fa;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 560px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 16px 30px;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           顶部
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .subtitle {
            margin-top: 4px;
            color: #999;
            font-size: 12px;
        }

        .today-count {
            text-align: right;
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }

        .today-count strong {
            color: #333;
            font-size: 16px;
        }

        /* =========================
           进度
           ========================= */

        .progress-area {
            margin-bottom: 18px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 12px;
            color: #999;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #e9eaed;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: #222;
            transition: width 0.25s ease;
        }

        /* =========================
           主卡片
           ========================= */

        .card {
            flex: 1;
            min-height: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .question-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 22px;
        }

        .sentence-placeholder {
            min-height: 110px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 17px;
            line-height: 1.8;
            padding: 0 8px;
        }

        .hidden-text {
            color: #bbb;
            font-size: 15px;
        }

        .answer {
            display: none;
            width: 100%;
        }

        .answer.show {
            display: block;
        }

        .english {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.65;
            color: #222;
            margin-bottom: 16px;
        }

        .chinese {
            font-size: 16px;
            line-height: 1.7;
            color: #777;
        }

        /* =========================
           播放按钮
           ========================= */

        .play-wrapper {
            margin-top: 25px;
        }

        .play-btn {
            width: 72px;
            height: 72px;
            border: none;
            border-radius: 50%;
            background: #222;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition:
                transform 0.15s ease,
                background 0.15s ease;
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.12);
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        .play-btn.playing {
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .play-hint {
            margin-top: 9px;
            color: #aaa;
            font-size: 11px;
        }

        /* =========================
           操作按钮
           ========================= */

        .actions {
            width: 100%;
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            height: 48px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.12s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #f0f1f3;
            color: #444;
        }

        .btn-success {
            background: #222;
            color: #fff;
        }

        .btn-warning {
            background: #f0f1f3;
            color: #444;
        }

        .btn-next {
            grid-column: 1 / -1;
            background: #222;
            color: #fff;
        }

        /* =========================
           底部
           ========================= */

        .footer {
            margin-top: 16px;
            text-align: center;
            color: #aaa;
            font-size: 11px;
            line-height: 1.7;
        }

        .footer-shortcuts {
            margin-top: 3px;
            opacity: 0.8;
        }

        /* =========================
           小屏幕
           ========================= */

        @media (max-width: 380px) {
            .app {
                padding: 15px 12px 24px;
            }

            .card {
                padding: 24px 17px;
                min-height: 390px;
            }

            .english {
                font-size: 19px;
            }

            .chinese {
                font-size: 15px;
            }

            .play-btn {
                width: 66px;
                height: 66px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         顶部
         ========================= -->

    <header class="header">

        <div>
            <div class="title">胖哥学英语</div>
            <div class="subtitle">听一句 · 想意思 · 看答案</div>
        </div>

        <div class="today-count">

            <strong id="todayCount">0</strong> 句

            <button

                ? 没听懂

            <button

    </main>


    <!-- =========================
         底部
         ========================= -->

    <footer class="footer">

        <div>
            随机复习会优先播放“没听懂”的句子

        </div>

    </footer>

</div>


<!-- =========================================================
     句子数据
     
     这里读取：
     data/listening-sentences.js

     里面必须存在：

     window.listeningSentences = [
         {
             en: "...",
             zh: "..."
         }
     ];
     ========================================================= -->

<script src="./data/listening-sentences.js?v=20260905"></script>


<script>
/* =========================================================
   胖哥学英语 · 听力训练
   ========================================================= */


/* =========================================================
   1. 检查句子数据
   ========================================================= */

if (
    !window.listeningSentences ||
    !Array.isArray(window.listeningSentences) ||
    window.listeningSentences.length === 0
) {

    document.getElementById("sentenceArea").innerHTML = `
        <div style="
            color:#d33;
            line-height:1.8;
            font-size:14px;
        ">
            句子库加载失败。<br><br>
            请检查：<br>
            data/listening-sentences.js
        </div>
    `;

    throw new Error(
        "listeningSentences 未加载"
    );
}


/* =========================================================
   2. 句子库
   ========================================================= */

const sentences = window.listeningSentences;


/* =========================================================
   3. 状态
   ========================================================= */

let currentIndex = 0;

/*
 * 不使用 toISOString()
 *
 * 因为 toISOString() 是 UTC 时间，
 * 在中国等 UTC+8 时区可能导致凌晨日期计算错误。
 */

function getLocalDateKey() {

    const now = new Date();

    const year = now.getFullYear();

    const month = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        now.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

let todayKey = getLocalDateKey();


const STORAGE_KEY =
    "pangge_english_listening_v3";


/* =========================================================
   4. 学习进度
   ========================================================= */

function createEmptyProgress() {

    return {
        current: 0,
        understood: {},
        notUnderstood: {},
        today: {},
        todayKey: todayKey
    };
}


function loadProgress() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            return createEmptyProgress();

        }

        const data =
            JSON.parse(saved);

        /*
         * 如果日期发生变化，
         * 只清除今日统计。
         */

        if (data.todayKey !== todayKey) {

            data.today = {};
            data.todayKey = todayKey;

        }

        if (!data.understood) {
            data.understood = {};
        }

        if (!data.notUnderstood) {
            data.notUnderstood = {};
        }

        if (!data.today) {
            data.today = {};
        }

        return data;

    } catch (error) {

        console.warn(
            "读取学习进度失败：",
            error
        );

        return createEmptyProgress();
    }
}


let progress = loadProgress();


/* =========================================================
   5. 保存进度
   ========================================================= */

function saveProgress() {

    try {

        progress.current =
            currentIndex;

        progress.todayKey =
            todayKey;

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(progress)
        );

    } catch (error) {

        console.warn(
            "保存学习进度失败：",
            error
        );

    }
}


/* =========================================================
   6. DOM
   ========================================================= */

const sentenceArea =
    document.getElementById(
        "sentenceArea"
    );

const answer =
    document.getElementById(
        "answer"
    );

const englishText =
    document.getElementById(
        "englishText"
    );

const chineseText =
    document.getElementById(
        "chineseText"
    );

const questionLabel =
    document.getElementById(
        "questionLabel"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const progressPercent =
    document.getElementById(
        "progressPercent"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const todayCount =
    document.getElementById(
        "todayCount"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );


/* =========================================================
   7. 语音状态
   ========================================================= */

/*
 * 这是这次重点修改的部分。
 *
 * 原来的方式：
 *
 * speechSynthesis.cancel();
 * speechSynthesis.speak(utterance);
 *
 * 某些浏览器 / iOS / 微信环境下，
 * 连续 cancel + speak 容易造成：
 *
 * - 爆音
 * - 杂音
 * - 语速异常
 * - 声音断裂
 * - 重复播放
 *
 * 现在加入：
 *
 * 1. speechToken
 * 2. speaking 状态
 * 3. 取消后短暂等待
 * 4. 防止旧任务重新启动
 */

let speechToken = 0;

let isSpeaking = false;

let speechTimer = null;


/* =========================================================
   8. 停止语音
   ========================================================= */

function stopSpeech() {

    /*
     * 让之前等待中的播放任务失效
     */

    speechToken++;

    isSpeaking = false;


    /*
     * 清除延迟播放
     */

    if (speechTimer !== null) {

        clearTimeout(
            speechTimer
        );

        speechTimer = null;
    }


    /*
     * 停止浏览器语音
     */

    if (
        "speechSynthesis" in window
    ) {

        try {

            window.speechSynthesis.cancel();

        } catch (error) {

            console.warn(
                "停止语音失败：",
                error
            );

        }

    }


    /*
     * 恢复按钮状态
     */

    playBtn.classList.remove(
        "playing"
    );

    playBtn.textContent = "▶";
}


/* =========================================================
   9. 播放当前句子
   ========================================================= */

function speakCurrent() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "你的浏览器不支持英语语音播放。"
        );

        return;
    }


    const text =
        sentences[currentIndex].en;


    if (!text) {
        return;
    }


    /*
     * 如果正在播放：
     *
     * 再点击一次 → 停止
     *
     * 这样可以避免用户连续点击
     * 导致语音堆积。
     */

    if (isSpeaking) {

        stopSpeech();

        return;
    }


    /*
     * 让所有旧任务失效
     */

    speechToken++;

    const currentToken =
        speechToken;


    /*
     * 停止当前可能存在的声音
     */

    try {

        window.speechSynthesis.cancel();

    } catch (error) {

        console.warn(
            "取消旧语音失败：",
            error
        );
    }


    playBtn.classList.remove(
        "playing"
    );

    playBtn.textContent = "▶";


    /*
     * 不立即 speak()
     *
     * 给浏览器 / iOS SpeechSynthesis
     * 留一点清理时间。
     */

    speechTimer = setTimeout(
        function () {

            speechTimer = null;


            /*
             * 如果用户在等待期间
             * 又进行了其他操作，
             * 当前播放任务直接取消。
             */

            if (
                currentToken !== speechToken
            ) {

                return;
            }


            /*
             * 创建新的语音对象
             */

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            /*
             * 英语美式发音
             */

            utterance.lang =
                "en-US";


            /*
             * 语速
             *
             * 0.82 比正常稍慢，
             * 比较适合英语学习。
             */

            utterance.rate =
                0.82;


            /*
             * 正常音调
             */

            utterance.pitch =
                1;


            /*
             * 最大音量
             */

            utterance.volume =
                1;


            /*
             * 开始播放
             */

            utterance.onstart =
                function () {

                    /*
                     * 如果已经不是当前任务，
                     * 立即停止。
                     */

                    if (
                        currentToken !== speechToken
                    ) {

                        try {

                            window.speechSynthesis.cancel();

                        } catch (error) {}

                        return;
                    }


                    isSpeaking = true;


                    playBtn.classList.add(
                        "playing"
                    );

                    playBtn.textContent =
                        "■";
                };


            /*
             * 正常结束
             */

            utterance.onend =
                function () {

                    if (
                        currentToken !== speechToken
                    ) {

                        return;
                    }


                    isSpeaking = false;


                    playBtn.classList.remove(
                        "playing"
                    );

                    playBtn.textContent =
                        "▶";
                };


            /*
             * 播放错误
             */

            utterance.onerror =
                function (event) {

                    if (
                        currentToken !== speechToken
                    ) {

                        return;
                    }


                    console.warn(
                        "SpeechSynthesis error:",
                        event
                    );


                    isSpeaking = false;


                    playBtn.classList.remove(
                        "playing"
                    );

                    playBtn.textContent =
                        "▶";
                };


            /*
             * 真正开始播放
             */

            try {

                window.speechSynthesis.speak(
                    utterance
                );

            } catch (error) {

                console.error(
                    "语音播放失败：",
                    error
                );

                isSpeaking = false;

                playBtn.classList.remove(
                    "playing"
                );

                playBtn.textContent =
                    "▶";
            }

        },

        /*
         * 关键：
         *
         * cancel 后等待 150ms
         */

        150
    );
}


/* =========================================================
   10. 加载当前句子
   ========================================================= */

function loadCurrent() {

    /*
     * 切换句子之前一定停止语音
     */

    stopSpeech();


    const item =
        sentences[currentIndex];


    /*
     * 隐藏答案
     */

    answer.classList.remove(
        "show"
    );


    /*
     * 显示提示
     */

    sentenceArea.innerHTML = `
        <div class="hidden-text">
            🔊 先听英语<br>
            <span style="font-size:13px;">
                想一想它是什么意思
            </span>
        </div>
    `;


    /*
     * 设置答案
     */

    englishText.textContent =
        item.en;

    chineseText.textContent =
        item.zh;


    /*
     * 当前句子编号
     */

    questionLabel.textContent =
        `第 ${currentIndex + 1} 句`;


    /*
     * 进度
     */

    updateProgress();


    /*
     * 保存当前位置
     */

    saveProgress();
}


/* =========================================================
   11. 显示答案
   ========================================================= */

function showAnswer() {

    /*
     * 显示答案时停止语音，
     * 避免用户看到答案后声音还在播放。
     */

    stopSpeech();


    answer.classList.add(
        "show"
    );
}


/* =========================================================
   12. 记录今天学习
   ========================================================= */

function recordToday() {

    /*
     * 每一句只统计一次
     */

    const key =
        String(currentIndex);


    if (
        !progress.today[key]
    ) {

        progress.today[key] =
            true;
    }


    saveProgress();

    updateTodayCount();
}


/* =========================================================
   13. 听懂了
   ========================================================= */

function markUnderstood() {

    stopSpeech();


    const key =
        String(currentIndex);


    progress.understood[key] =
        true;


    /*
     * 如果之前标记过“没听懂”，
     * 听懂之后取消这个标记。
     */

    delete progress.notUnderstood[key];


    recordToday();


    /*
     * 自动进入下一句
     */

    nextSentence();
}


/* =========================================================
   14. 没听懂
   ========================================================= */

function markNotUnderstood() {

    stopSpeech();


    const key =
        String(currentIndex);


    progress.notUnderstood[key] =
        true;


    /*
     * 如果之前标记为听懂，
     * 取消听懂状态。
     */

    delete progress.understood[key];


    recordToday();


    saveProgress();


    /*
     * 自动进入下一句
     */

    nextSentence();
}


/* =========================================================
   15. 下一句
   ========================================================= */

function nextSentence() {

    stopSpeech();


    currentIndex++;


    /*
     * 到最后一条后回到第一条
     */

    if (
        currentIndex >= sentences.length
    ) {

        currentIndex = 0;


        alert(
            "🎉 这一轮已经完成！\n\n继续下一轮吧。"
        );
    }


    loadCurrent();
}


/* =========================================================
   16. 随机复习
   ========================================================= */

function randomSentence() {

    stopSpeech();


    /*
     * 找出所有“没听懂”的句子
     */

    const difficultIndexes =
        Object.keys(
            progress.notUnderstood
        )
        .map(
            index => Number(index)
        )
        .filter(
            index =>
                index >= 0 &&
                index < sentences.length
        );


    /*
     * 如果存在没听懂的句子，
     * 优先从里面随机选择。
     */

    if (
        difficultIndexes.length > 0
    ) {

        const randomPosition =
            Math.floor(
                Math.random() *
                difficultIndexes.length
            );


        currentIndex =
            difficultIndexes[
                randomPosition
            ];

    } else {

        /*
         * 没有“没听懂”的句子，
         * 从全部句子随机选择。
         */

        currentIndex =
            Math.floor(
                Math.random() *
                sentences.length
            );
    }


    loadCurrent();


    /*
     * 随机出来后自动播放。
     *
     * 不立即播放，
     * 给页面状态更新一点时间。
     */

    setTimeout(
        function () {

            speakCurrent();

        },
        250
    );
}


/* =========================================================
   17. 更新进度
   ========================================================= */

function updateProgress() {

    const total =
        sentences.length;


    const current =
        currentIndex + 1;


    const percent =
        Math.round(
            (current / total) * 100
        );


    progressText.textContent =
        `${current} / ${total}`;


    progressPercent.textContent =
        `${percent}%`;


    progressFill.style.width =
        `${percent}%`;
}


/* =========================================================
   18. 更新今日数量
   ========================================================= */

function updateTodayCount() {

    const count =
        Object.keys(
            progress.today
        ).length;


    todayCount.textContent =
        count;
}


/* =========================================================
   19. 按钮事件
   ========================================================= */

playBtn.addEventListener(
    "click",
    function () {

        speakCurrent();

    }
);


document
    .getElementById(
        "showAnswerBtn"
    )
    .addEventListener(
        "click",
        function () {

            showAnswer();

        }
    );


document
    .getElementById(
        "understoodBtn"
    )
    .addEventListener(
        "click",
        function () {

            markUnderstood();

        }
    );


document
    .getElementById(
        "notUnderstoodBtn"
    )
    .addEventListener(
        "click",
        function () {

            markNotUnderstood();

        }
    );


document
    .getElementById(
        "nextBtn"
    )
    .addEventListener(
        "click",
        function () {

            nextSentence();

        }
    );


/* =========================================================
   20. 键盘快捷键
   ========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        /*
         * 输入框中不处理快捷键
         */

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {

            return;
        }


        /*
         * 空格
         *
         * 播放 / 停止
         */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            speakCurrent();

            return;
        }


        /*
         * Enter
         *
         * 没显示答案：
         * 显示答案
         *
         * 已显示：
         * 下一句
         */

        if (
            event.code === "Enter"
        ) {

            event.preventDefault();


            if (
                answer.classList.contains(
                    "show"
                )
            ) {

                nextSentence();

            } else {

                showAnswer();

            }

            return;
        }


        /*
         * 右方向键
         */

        if (
            event.code === "ArrowRight"
        ) {

            event.preventDefault();

            nextSentence();

        }

    }
);


/* =========================================================
   21. 页面进入后台时停止语音
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.hidden
        ) {

            stopSpeech();

        }

    }
);


/* =========================================================
   22. 页面关闭 / 返回时停止语音
   ========================================================= */

window.addEventListener(
    "pagehide",
    function () {

        stopSpeech();

    }
);


/* =========================================================
   23. 页面从后台恢复
   ========================================================= */

window.addEventListener(
    "pageshow",
    function () {

        /*
         * 不自动播放。
         *
         * 用户点击播放按钮后再播放。
         */

        stopSpeech();

    }
);


/* =========================================================
   24. 浏览器 SpeechSynthesis 某些环境的保护
   ========================================================= */

/*
 * 某些浏览器在长时间没有使用 speechSynthesis
 * 后可能出现卡住。
 *
 * 这里不自动播放，只在当前页面可见时
 * 做一次轻量 resume。
 */

function keepSpeechEngineAlive() {

    if (
        document.hidden
    ) {

        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    try {

        if (
            window.speechSynthesis.paused
        ) {

            window.speechSynthesis.resume();

        }

    } catch (error) {

        console.warn(
            "SpeechSynthesis resume failed:",
            error
        );
    }
}


/*
 * 每 8 秒检查一次。
 *
 * 不创建新的语音，
 * 只处理浏览器内部暂停状态。
 */

setInterval(
    keepSpeechEngineAlive,
    8000
);


/* =========================================================
   25. 页面初始化
   ========================================================= */

/*
 * 恢复上次学习位置
 */

if (
    Number.isInteger(
        progress.current
    ) &&
    progress.current >= 0 &&
    progress.current < sentences.length
) {

    currentIndex =
        progress.current;

} else {

    currentIndex = 0;

}


/*
 * 初始化页面
 */

loadCurrent();


/*
 * 初始化今日数量
 */

updateTodayCount();


/*
 * 防止页面打开后残留旧语音
 */

stopSpeech();


/* =========================================================
   26. 控制台信息
   ========================================================= */

console.log(
    "胖哥学英语已加载"
);

console.log(
    `句子数量：${sentences.length}`
);

console.log(
    `当前位置：${currentIndex + 1}`
);

</script>

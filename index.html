<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>胖哥学英语</title>

    <meta name="description" content="胖哥学英语 - 简洁高效的英语闪卡学习工具">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
            background: #f5f6f8;
            color: #222;
            transition: background .25s, color .25s;
        }

        button {
            font: inherit;
        }

        .app {
            min-height: 100vh;
            padding-bottom: 72px;
        }

        /* =========================
           Header
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 58px;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e9e9e9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: 0;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .icon-btn:hover {
            background: #f1f1f1;
        }

        /* =========================
           Main
        ========================= */

        .main {
            width: min(720px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 30px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================
           Learning
        ========================= */

        .deck-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .deck-select {
            flex: 1;
            min-width: 0;
            height: 42px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        .deck-select:focus {
            border-color: #999;
        }

        .progress-info {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
        }

        .progress {
            height: 4px;
            background: #e5e5e5;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: #222;
            border-radius: inherit;
            transition: width .25s ease;
        }

        /* =========================
           Flash Card
        ========================= */

        .card-container {
            perspective: 1200px;
            width: 100%;
            height: 390px;
            cursor: pointer;
            user-select: none;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform .45s ease;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: #fff;
            border: 1px solid #e9e9e9;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .word {
            font-size: clamp(38px, 8vw, 62px);
            font-weight: 700;
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 12px;
        }

        .phonetic {
            color: #888;
            font-size: 17px;
            margin-bottom: 24px;
        }

        .meaning {
            font-size: 27px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .example {
            max-width: 580px;
            text-align: center;
            line-height: 1.7;
            font-size: 16px;
            color: #555;
        }

        .example-cn {
            margin-top: 6px;
            color: #999;
        }

        .speak-btn {
            position: absolute;
            right: 18px;
            top: 18px;
            width: 40px;
            height: 40px;
            border: 0;
            background: #f4f4f4;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .speak-btn:hover {
            background: #e9e9e9;
        }

        .hint {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }

        /* =========================
           Controls
        ========================= */

        .controls {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .control-btn {
            height: 48px;
            border: 0;
            border-radius: 13px;
            background: #fff;
            color: #333;
            border: 1px solid #e6e6e6;
            cursor: pointer;
            font-weight: 600;
            transition: transform .12s, background .15s;
        }

        .control-btn:active {
            transform: scale(.97);
        }

        .control-btn:hover {
            background: #f7f7f7;
        }

        .control-btn.primary {
            background: #222;
            color: #fff;
            border-color: #222;
        }

        .control-btn.primary:hover {
            background: #333;
        }

        .knowledge-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .unknown-btn {
            color: #b42318;
        }

        .known-btn {
            color: #067647;
        }

        /* =========================
           Library
        ========================= */

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin: 4px 0 20px;
        }

        .deck-list {
            display: grid;
            gap: 10px;
        }

        .deck-item {
            width: 100%;
            text-align: left;
            padding: 16px;
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fff;
            cursor: pointer;
            transition: transform .12s, background .15s;
        }

        .deck-item:active {
            transform: scale(.985);
        }

        .deck-item:hover {
            background: #fafafa;
        }

        .deck-name {
            font-size: 16px;
            font-weight: 600;
        }

        .deck-meta {
            margin-top: 5px;
            color: #999;
            font-size: 13px;
        }

        /* =========================
           Stats
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 15px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 30px;
            font-weight: 700;
        }

        .stat-wide {
            grid-column: span 2;
        }

        .mastery-wrap {
            margin-top: 14px;
        }

        .mastery-track {
            height: 8px;
            background: #e8e8e8;
            border-radius: 99px;
            overflow: hidden;
        }

        .mastery-bar {
            height: 100%;
            width: 0;
            background: #222;
            transition: width .3s;
        }

        /* =========================
           Loading / Error
        ========================= */

        .loading,
        .error-box {
            padding: 60px 20px;
            text-align: center;
            color: #888;
        }

        .error-box {
            color: #b42318;
        }

        .error-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-detail {
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .retry-btn {
            margin-top: 18px;
            padding: 10px 18px;
            border: 0;
            border-radius: 10px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        /* =========================
           Update Toast
        ========================= */

        .update-toast {
            position: fixed;
            left: 50%;
            top: 72px;
            transform: translateX(-50%);
            z-index: 300;
            background: #222;
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        .update-toast.show {
            opacity: 1;
        }

        /* =========================
           Bottom Navigation
        ========================= */

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 64px;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(12px);
            border-top: 1px solid #e8e8e8;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-btn {
            border: 0;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .nav-icon {
            font-size: 19px;
        }

        .nav-btn.active {
            color: #222;
            font-weight: 600;
        }

        /* =========================
           Dark Mode
        ========================= */

        body.dark {
            background: #111;
            color: #eee;
        }

        body.dark .header {
            background: rgba(20,20,20,.94);
            border-color: #292929;
        }

        body.dark .icon-btn {
            color: #eee;
        }

        body.dark .icon-btn:hover {
            background: #292929;
        }

        body.dark .deck-select,
        body.dark .card-face,
        body.dark .control-btn,
        body.dark .deck-item,
        body.dark .stat-card {
            background: #1b1b1b;
            color: #eee;
            border-color: #303030;
        }

        body.dark .deck-select {
            color: #eee;
        }

        body.dark .progress {
            background: #333;
        }

        body.dark .progress-bar,
        body.dark .mastery-bar {
            background: #eee;
        }

        body.dark .example {
            color: #bbb;
        }

        body.dark .example-cn,
        body.dark .phonetic,
        body.dark .progress-info,
        body.dark .hint,
        body.dark .deck-meta,
        body.dark .stat-label {
            color: #888;
        }

        body.dark .control-btn.primary {
            background: #eee;
            color: #111;
            border-color: #eee;
        }

        body.dark .control-btn:hover,
        body.dark .deck-item:hover {
            background: #222;
        }

        body.dark .speak-btn {
            background: #292929;
            color: #eee;
        }

        body.dark .speak-btn:hover {
            background: #333;
        }

        body.dark .bottom-nav {
            background: rgba(20,20,20,.96);
            border-color: #292929;
        }

        body.dark .nav-btn {
            color: #777;
        }

        body.dark .nav-btn.active {
            color: #eee;
        }

        body.dark .mastery-track {
            background: #333;
        }

        /* =========================
           Desktop
        ========================= */

        @media (min-width: 768px) {
            .bottom-nav {
                width: 430px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                border-left: 1px solid #e8e8e8;
                border-right: 1px solid #e8e8e8;
                border-radius: 14px 14px 0 0;
            }
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {
            .header {
                height: 54px;
                padding: 0 14px;
            }

            .logo {
                font-size: 16px;
            }

            .main {
                width: calc(100% - 20px);
                padding-top: 15px;
            }

            .deck-bar {
                margin-bottom: 10px;
            }

            .deck-select {
                height: 40px;
                font-size: 13px;
            }

            .card-container {
                height: 330px;
            }

            .card-face {
                border-radius: 18px;
                padding: 22px 18px;
            }

            .word {
                font-size: 42px;
            }

            .phonetic {
                font-size: 15px;
                margin-bottom: 20px;
            }

            .meaning {
                font-size: 23px;
            }

            .example {
                font-size: 14px;
            }

            .controls {
                gap: 7px;
            }

            .control-btn {
                height: 45px;
                font-size: 13px;
            }

            .knowledge-controls {
                gap: 7px;
            }

            .page-title {
                font-size: 22px;
            }
        }

        /* =========================
           Small Mobile
        ========================= */

        @media (max-width: 380px) {
            .card-container {
                height: 310px;
            }

            .word {
                font-size: 37px;
            }

            .meaning {
                font-size: 21px;
            }

            .controls {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .control-btn {
                font-size: 12px;
            }
        }
    </style>
</head>

<script>
"use strict";

/* =========================================================
   基础配置
========================================================= */

const SITE_ROOT = "/MyFlashCards/";
const DATA_ROOT = SITE_ROOT + "data/";

const DECK_INDEX = DATA_ROOT + "index.json";
const VERSION_URL = DATA_ROOT + "version.json";

const VERSION_STORAGE_KEY = "myflashcards_site_version";
const STATE_STORAGE_PREFIX = "myflashcards_state_";
const THEME_STORAGE_KEY = "myflashcards_theme";


/* =========================================================
   全局状态
========================================================= */

let decks = [];
let currentDeck = null;
let currentWords = [];

let currentIndex = 0;
let isFlipped = false;

let learningState = {};


/* =========================================================
   DOM
========================================================= */

const loadingBox = document.getElementById("loadingBox");
const errorBox = document.getElementById("errorBox");
const errorDetail = document.getElementById("errorDetail");
const retryBtn = document.getElementById("retryBtn");

const learningContent = document.getElementById("learningContent");

const deckSelect = document.getElementById("deckSelect");

const currentNumber = document.getElementById("currentNumber");
const totalNumber = document.getElementById("totalNumber");
const progressBar = document.getElementById("progressBar");

const cardContainer = document.getElementById("cardContainer");
const flashcard = document.getElementById("flashcard");

const wordEl = document.getElementById("word");
const phoneticEl = document.getElementById("phonetic");
const meaningEl = document.getElementById("meaning");
const exampleEl = document.getElementById("example");
const exampleCnEl = document.getElementById("exampleCn");

const frontSpeakBtn = document.getElementById("frontSpeakBtn");
const backSpeakBtn = document.getElementById("backSpeakBtn");

const prevBtn = document.getElementById("prevBtn");
const flipBtn = document.getElementById("flipBtn");
const nextBtn = document.getElementById("nextBtn");

const unknownBtn = document.getElementById("unknownBtn");
const knownBtn = document.getElementById("knownBtn");

const deckList = document.getElementById("deckList");

const statTotal = document.getElementById("statTotal");
const statLearned = document.getElementById("statLearned");
const statKnown = document.getElementById("statKnown");
const statUnknown = document.getElementById("statUnknown");
const statMastery = document.getElementById("statMastery");
const masteryBar = document.getElementById("masteryBar");

const themeBtn = document.getElementById("themeBtn");

const updateToast = document.getElementById("updateToast");


/* =========================================================
   JSON 请求
   强制绕过浏览器 / CDN 缓存
========================================================= */

async function getJSON(url) {

    const separator = url.includes("?") ? "&" : "?";

    const finalUrl =
        url +
        separator +
        "_=" +
        Date.now() +
        "_" +
        Math.random().toString(36).substring(2);

    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 10000);

    try {

        const response = await fetch(finalUrl, {
            method: "GET",
            cache: "no-store",
            signal: controller.signal,
            headers: {
                "Cache-Control": "no-cache"
            }
        });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status} ${response.statusText}`
            );
        }

        const text = await response.text();

        if (!text.trim()) {
            throw new Error("服务器返回空内容");
        }

        try {
            return JSON.parse(text);
        } catch (e) {
            throw new Error(
                "JSON 格式错误：" + e.message
            );
        }

    } catch (error) {

        if (error.name === "AbortError") {
            throw new Error(
                "请求超时：10 秒内没有收到响应"
            );
        }

        throw error;

    } finally {

        clearTimeout(timeout);

    }
}


/* =========================================================
   版本检测
========================================================= */

async function checkVersion() {

    try {

        const data = await getJSON(VERSION_URL);

        if (!data || !data.version) {
            console.warn(
                "version.json 缺少 version"
            );
            return;
        }

        const serverVersion = String(data.version);

        const localVersion =
            localStorage.getItem(
                VERSION_STORAGE_KEY
            );

        /* 第一次访问 */
        if (!localVersion) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            return;
        }

        /* 检测到新版本 */
        if (localVersion !== serverVersion) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            showUpdateToast();

            setTimeout(() => {

                const newUrl =
                    window.location.pathname +
                    "?v=" +
                    encodeURIComponent(
                        serverVersion
                    );

                window.location.replace(newUrl);

            }, 700);
        }

    } catch (error) {

        console.warn(
            "版本检测失败：",
            error
        );

    }
}


/* =========================================================
   更新提示
========================================================= */

function showUpdateToast() {

    updateToast.classList.add("show");

}


/* =========================================================
   Loading / Error
========================================================= */

function showLoading() {

    loadingBox.style.display = "block";
    errorBox.style.display = "none";
    learningContent.style.display = "none";

}


function showError(error) {

    loadingBox.style.display = "none";
    learningContent.style.display = "none";
    errorBox.style.display = "block";

    errorDetail.textContent =
        error instanceof Error
            ? error.message
            : String(error);

}


function showContent() {

    loadingBox.style.display = "none";
    errorBox.style.display = "none";
    learningContent.style.display = "block";

}


/* =========================================================
   加载词库目录
========================================================= */

async function loadDecks() {

    showLoading();

    try {

        const data = await getJSON(DECK_INDEX);

        if (!Array.isArray(data)) {
            throw new Error(
                "index.json 必须是数组格式"
            );
        }

        decks = data;

        if (decks.length === 0) {
            throw new Error(
                "index.json 中没有任何词库"
            );
        }

        renderDeckSelect();
        renderLibrary();

        const savedDeck =
            localStorage.getItem(
                "myflashcards_current_deck"
            );

        let targetDeck =
            decks.find(
                deck => deck.id === savedDeck
            );

        if (!targetDeck) {
            targetDeck = decks[0];
        }

        await loadDeck(targetDeck.id);

        showContent();

    } catch (error) {

        console.error(
            "加载词库失败：",
            error
        );

        showError(error);

    }

}


/* =========================================================
   渲染词库下拉菜单
========================================================= */

function renderDeckSelect() {

    deckSelect.innerHTML = "";

    decks.forEach(deck => {

        const option =
            document.createElement("option");

        option.value = deck.id;
        option.textContent = deck.name || deck.id;

        deckSelect.appendChild(option);

    });

}


/* =========================================================
   加载具体词库
========================================================= */

async function loadDeck(deckId) {

    const deck =
        decks.find(
            item => item.id === deckId
        );

    if (!deck) {
        throw new Error(
            "找不到词库：" + deckId
        );
    }

    if (!deck.file) {
        throw new Error(
            "词库缺少 file 字段：" + deckId
        );
    }

    const url =
        DATA_ROOT + deck.file;

    const data =
        await getJSON(url);

    if (!Array.isArray(data)) {
        throw new Error(
            `${deck.file} 必须是数组格式`
        );
    }

    if (data.length === 0) {
        throw new Error(
            `${deck.file} 没有单词`
        );
    }

    currentDeck = deck;
    currentWords = data;

    localStorage.setItem(
        "myflashcards_current_deck",
        deck.id
    );

    loadLearningState();

    const savedPosition =
        Number(
            learningState.position
        );

    if (
        Number.isInteger(savedPosition) &&
        savedPosition >= 0 &&
        savedPosition < currentWords.length
    ) {
        currentIndex = savedPosition;
    } else {
        currentIndex = 0;
    }

    isFlipped = false;

    renderCurrentCard();
    updateStats();

}


/* =========================================================
   LocalStorage 学习状态
========================================================= */

function getStateKey() {

    return (
        STATE_STORAGE_PREFIX +
        (currentDeck
            ? currentDeck.id
            : "unknown")
    );

}


function loadLearningState() {

    try {

        const raw =
            localStorage.getItem(
                getStateKey()
            );

        if (raw) {

            const parsed =
                JSON.parse(raw);

            if (
                parsed &&
                typeof parsed === "object"
            ) {
                learningState = parsed;
            } else {
                learningState = {};
            }

        } else {

            learningState = {};

        }

    } catch (error) {

        console.warn(
            "学习状态读取失败：",
            error
        );

        learningState = {};

    }

}


function saveLearningState() {

    if (!currentDeck) {
        return;
    }

    learningState.position =
        currentIndex;

    try {

        localStorage.setItem(
            getStateKey(),
            JSON.stringify(
                learningState
            )
        );

    } catch (error) {

        console.warn(
            "学习状态保存失败：",
            error
        );

    }

}


/* =========================================================
   当前单词状态
========================================================= */

function getWordKey(index) {

    const item =
        currentWords[index];

    if (!item) {
        return String(index);
    }

    return (
        item.word +
        "_" +
        index
    );

}


function getWordStatus(index) {

    const key =
        getWordKey(index);

    return learningState[key] || null;

}


function setWordStatus(
    index,
    status
) {

    const key =
        getWordKey(index);

    learningState[key] = status;

    learningState.position =
        currentIndex;

    saveLearningState();

}


/* =========================================================
   渲染当前卡片
========================================================= */

function renderCurrentCard() {

    if (
        !currentWords ||
        currentWords.length === 0
    ) {
        return;
    }

    const item =
        currentWords[currentIndex];

    if (!item) {
        return;
    }

    wordEl.textContent =
        item.word || "—";

    phoneticEl.textContent =
        item.phonetic || "";

    meaningEl.textContent =
        item.meaning || "—";

    exampleEl.textContent =
        item.example || "";

    exampleCnEl.textContent =
        item.example_cn || "";

    totalNumber.textContent =
        currentWords.length;

    currentNumber.textContent =
        currentIndex + 1;

    const percent =
        (
            (currentIndex + 1) /
            currentWords.length
        ) * 100;

    progressBar.style.width =
        percent + "%";

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

    updateStats();

}


/* =========================================================
   翻转
========================================================= */

function flipCard() {

    isFlipped = !isFlipped;

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

}


/* =========================================================
   上一个
========================================================= */

function previousCard() {

    if (!currentWords.length) {
        return;
    }

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex =
            currentWords.length - 1;
    }

    isFlipped = false;

    saveLearningState();
    renderCurrentCard();

}


/* =========================================================
   下一个
========================================================= */

function nextCard() {

    if (!currentWords.length) {
        return;
    }

    currentIndex++;

    if (
        currentIndex >=
        currentWords.length
    ) {
        currentIndex = 0;
    }

    isFlipped = false;

    saveLearningState();
    renderCurrentCard();

}


/* =========================================================
   随机
========================================================= */

function randomCard() {

    if (currentWords.length <= 1) {
        return;
    }

    let nextIndex;

    do {

        nextIndex =
            Math.floor(
                Math.random() *
                currentWords.length
            );

    } while (
        nextIndex === currentIndex
    );

    currentIndex = nextIndex;

    isFlipped = false;

    saveLearningState();
    renderCurrentCard();

}


/* =========================================================
   发音
========================================================= */

function speakWord() {

    if (!currentWords.length) {
        return;
    }

    const item =
        currentWords[currentIndex];

    if (!item || !item.word) {
        return;
    }

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "当前浏览器不支持英语朗读"
        );

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            item.word
        );

    utterance.lang = "en-US";
    utterance.rate = 0.85;
    utterance.pitch = 1;
    utterance.volume = 1;

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   已掌握 / 不认识
========================================================= */

function markKnown() {

    setWordStatus(
        currentIndex,
        "known"
    );

    updateStats();

    nextCard();

}


function markUnknown() {

    setWordStatus(
        currentIndex,
        "unknown"
    );

    updateStats();

    nextCard();

}


/* =========================================================
   统计
========================================================= */

function calculateStats() {

    const total =
        currentWords.length;

    let known = 0;
    let unknown = 0;

    for (
        let i = 0;
        i < currentWords.length;
        i++
    ) {

        const status =
            getWordStatus(i);

        if (status === "known") {
            known++;
        }

        if (status === "unknown") {
            unknown++;
        }

    }

    const learned =
        known + unknown;

    const mastery =
        total > 0
            ? Math.round(
                (known / total) * 100
            )
            : 0;

    return {
        total,
        learned,
        known,
        unknown,
        mastery
    };

}


function updateStats() {

    const stats =
        calculateStats();

    statTotal.textContent =
        stats.total;

    statLearned.textContent =
        stats.learned;

    statKnown.textContent =
        stats.known;

    statUnknown.textContent =
        stats.unknown;

    statMastery.textContent =
        stats.mastery + "%";

    masteryBar.style.width =
        stats.mastery + "%";

}


/* =========================================================
   词库列表
========================================================= */

function renderLibrary() {

    deckList.innerHTML = "";

    decks.forEach(deck => {

        const button =
            document.createElement("button");

        button.className =
            "deck-item";

        const name =
            escapeHTML(
                deck.name || deck.id
            );

        const description =
            deck.description
                ? escapeHTML(
                    deck.description
                )
                : "";

        button.innerHTML = `
            <div class="deck-name">
                ${name}
            </div>
            ${
                description
                    ? `<div class="deck-meta">${description}</div>`
                    : ""
            }
        `;

        button.addEventListener(
            "click",
            async () => {

                try {

                    await loadDeck(
                        deck.id
                    );

                    showPage(
                        "learningPage"
                    );

                } catch (error) {

                    showError(error);

                    showPage(
                        "learningPage"
                    );

                }

            }
        );

        deckList.appendChild(
            button
        );

    });

}


/* =========================================================
   页面切换
========================================================= */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.toggle(
                "active",
                page.id === pageId
            );

        });

    document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === pageId
            );

        });

    if (pageId === "statsPage") {
        updateStats();
    }

}


/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   深色模式
========================================================= */

function loadTheme() {

    const savedTheme =
        localStorage.getItem(
            THEME_STORAGE_KEY
        );

    if (savedTheme === "dark") {

        document.body.classList.add(
            "dark"
        );

        themeBtn.textContent = "☀️";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeBtn.textContent = "🌙";

    }

}


function toggleTheme() {

    const isDark =
        document.body.classList.toggle(
            "dark"
        );

    localStorage.setItem(
        THEME_STORAGE_KEY,
        isDark
            ? "dark"
            : "light"
    );

    themeBtn.textContent =
        isDark
            ? "☀️"
            : "🌙";

}


/* =========================================================
   事件绑定
========================================================= */

cardContainer.addEventListener(
    "click",
    event => {

        if (
            event.target.closest(
                ".speak-btn"
            )
        ) {
            return;
        }

        flipCard();

    }
);


frontSpeakBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        speakWord();

    }
);


backSpeakBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        speakWord();

    }
);


flipBtn.addEventListener(
    "click",
    flipCard
);


prevBtn.addEventListener(
    "click",
    previousCard
);


nextBtn.addEventListener(
    "click",
    nextCard
);


unknownBtn.addEventListener(
    "click",
    markUnknown
);


knownBtn.addEventListener(
    "click",
    markKnown
);


deckSelect.addEventListener(
    "change",
    async event => {

        const deckId =
            event.target.value;

        try {

            await loadDeck(deckId);

        } catch (error) {

            showError(error);

        }

    }
);


retryBtn.addEventListener(
    "click",
    () => {

        loadDecks();

    }
);


themeBtn.addEventListener(
    "click",
    toggleTheme
);


/* =========================================================
   底部导航
========================================================= */

document
    .querySelectorAll(".nav-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                showPage(
                    button.dataset.page
                );

            }
        );

    });


/* =========================================================
   键盘快捷键
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /* 输入框 / 下拉框中不执行快捷键 */

        const tag =
            event.target.tagName;

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"
        ) {
            return;
        }

        switch (
            event.key.toLowerCase()
        ) {

            case " ":
                event.preventDefault();
                flipCard();
                break;

            case "arrowleft":
                previousCard();
                break;

            case "arrowright":
                nextCard();
                break;

            case "r":
                randomCard();
                break;

            case "s":
                speakWord();
                break;

            case "k":
                markKnown();
                break;

            case "x":
                markUnknown();
                break;

        }

    }
);


/* =========================================================
   防止移动端双击放大影响体验
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();

        if (
            now - lastTouchEnd <= 300
        ) {
            event.preventDefault();
        }

        lastTouchEnd = now;

    },
    {
        passive: false
    }
);


/* =========================================================
   初始化
========================================================= */

async function init() {

    loadTheme();

    /*
     * 先检测版本。
     *
     * version.json 本身也使用时间戳参数，
     * 避免 version.json 被缓存。
     */
    await checkVersion();

    await loadDecks();

}


/* =========================================================
   启动
========================================================= */

init().catch(error => {

    console.error(
        "程序初始化失败：",
        error
    );

    showError(error);

});
</script>

</body>

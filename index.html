<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>胖哥学英语 · 听句子</title>

<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #172033;
  --sub: #6b7280;
  --primary: #1769e0;
  --primary-dark: #0f4fae;
  --orange: #ff9f1c;
  --green: #19a974;
  --red: #e05252;
  --border: #e5eaf1;
  --shadow: 0 10px 30px rgba(24, 45, 80, .08);
  --radius: 22px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100dvh;
}

button {
  border: 0;
  font: inherit;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

#app {
  min-height: 100dvh;
}

/* ================================
   APP
================================ */

.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.page {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding:
    max(18px, env(safe-area-inset-top))
    18px
    calc(24px + env(safe-area-inset-bottom));
}

/* ================================
   Header
================================ */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
  box-shadow: var(--shadow);
  font-size: 21px;
}

.header-title {
  font-size: 20px;
  font-weight: 800;
}

.header-sub {
  font-size: 12px;
  color: var(--sub);
  margin-top: 2px;
}

.header-action {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
  font-size: 18px;
}

/* ================================
   Hero
================================ */

.hero {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  padding: 24px 20px;
  margin-bottom: 16px;
  background:
    linear-gradient(135deg, #135fd1, #2589ed);
  color: white;
  box-shadow: 0 15px 35px rgba(23, 105, 224, .22);
}

.hero::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  right: -45px;
  top: -45px;
}

.hero::after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  left: -35px;
  bottom: -45px;
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero-label {
  font-size: 13px;
  opacity: .86;
  margin-bottom: 6px;
}

.hero-title {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -.5px;
}

.hero-desc {
  margin-top: 8px;
  font-size: 14px;
  line-height: 1.6;
  opacity: .9;
}

.hero-stats {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.hero-stat {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(8px);
}

.hero-stat-number {
  font-size: 21px;
  font-weight: 900;
}

.hero-stat-label {
  font-size: 11px;
  opacity: .78;
  margin-top: 2px;
}

/* ================================
   Level
================================ */

.section {
  margin-top: 18px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.section-title strong {
  font-size: 17px;
}

.section-title span {
  font-size: 12px;
  color: var(--sub);
}

.level-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.level-btn {
  min-height: 48px;
  border-radius: 15px;
  background: var(--card);
  color: var(--sub);
  border: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
}

.level-btn.active {
  background: #eaf2ff;
  color: var(--primary);
  border-color: #bcd4fa;
}

/* ================================
   Listening Card
================================ */

.listen-card {
  margin-top: 16px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px 18px;
  box-shadow: var(--shadow);
}

.listen-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.listen-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #eef4ff;
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}

.listen-number {
  font-size: 12px;
  color: var(--sub);
}

.audio-area {
  text-align: center;
  padding: 26px 10px 20px;
}

.audio-button {
  width: 94px;
  height: 94px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  box-shadow:
    0 12px 28px rgba(23,105,224,.28),
    0 0 0 10px rgba(23,105,224,.07);
  font-size: 38px;
  transition: .2s;
}

.audio-button.playing {
  animation: pulse 1.1s infinite;
}

@keyframes pulse {
  0% {
    box-shadow:
      0 12px 28px rgba(23,105,224,.28),
      0 0 0 8px rgba(23,105,224,.07);
  }
  50% {
    box-shadow:
      0 12px 28px rgba(23,105,224,.28),
      0 0 0 18px rgba(23,105,224,.02);
  }
  100% {
    box-shadow:
      0 12px 28px rgba(23,105,224,.28),
      0 0 0 8px rgba(23,105,224,.07);
  }
}

.audio-title {
  margin-top: 17px;
  font-size: 15px;
  font-weight: 700;
}

.audio-hint {
  margin-top: 5px;
  color: var(--sub);
  font-size: 12px;
}

/* ================================
   Question
================================ */

.question {
  margin-top: 8px;
  text-align: center;
}

.question-title {
  font-size: 19px;
  font-weight: 800;
}

.question-desc {
  margin-top: 7px;
  font-size: 13px;
  color: var(--sub);
  line-height: 1.5;
}

/* ================================
   Answer
================================ */

.answer {
  display: none;
  margin-top: 18px;
  border-radius: 18px;
  background: #f5f8fc;
  border: 1px solid var(--border);
  padding: 17px;
}

.answer.show {
  display: block;
}

.answer-label {
  font-size: 11px;
  color: var(--sub);
  margin-bottom: 8px;
}

.answer-english {
  font-size: 18px;
  line-height: 1.55;
  font-weight: 800;
}

.answer-chinese {
  margin-top: 9px;
  font-size: 16px;
  line-height: 1.6;
}

.answer-hint {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--sub);
  line-height: 1.6;
}

/* ================================
   Buttons
================================ */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.btn {
  min-height: 48px;
  border-radius: 15px;
  font-weight: 800;
  font-size: 14px;
  padding: 0 14px;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-secondary {
  background: #eef3f8;
  color: var(--text);
}

.btn-green {
  background: #e8f8f2;
  color: var(--green);
}

.btn-orange {
  background: #fff4df;
  color: #d98500;
}

.btn-danger {
  background: #fff0f0;
  color: var(--red);
}

.full-btn {
  width: 100%;
  margin-top: 10px;
}

/* ================================
   Result
================================ */

.result {
  display: none;
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 15px;
  font-size: 13px;
  line-height: 1.5;
}

.result.show {
  display: block;
}

.result.success {
  background: #eaf8f2;
  color: #11815a;
}

.result.retry {
  background: #fff5e6;
  color: #b66a00;
}

/* ================================
   Progress
================================ */

.progress-card {
  margin-top: 16px;
  background: var(--card);
  border-radius: 18px;
  padding: 15px 16px;
  box-shadow: var(--shadow);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.progress-title {
  font-size: 13px;
  font-weight: 700;
}

.progress-value {
  font-size: 12px;
  color: var(--sub);
}

.progress-bar {
  margin-top: 10px;
  width: 100%;
  height: 8px;
  background: #edf0f4;
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: var(--primary);
  border-radius: 99px;
  transition: width .3s ease;
}

/* ================================
   Tips
================================ */

.tip {
  margin-top: 16px;
  padding: 14px 16px;
  background: #fff;
  border-radius: 17px;
  border-left: 4px solid var(--orange);
  box-shadow: var(--shadow);
}

.tip-title {
  font-size: 13px;
  font-weight: 800;
}

.tip-text {
  margin-top: 5px;
  font-size: 12px;
  color: var(--sub);
  line-height: 1.6;
}

/* ================================
   Bottom
================================ */

.bottom {
  margin-top: 18px;
  display: flex;
  gap: 9px;
}

.bottom-btn {
  flex: 1;
  min-height: 45px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

/* ================================
   Toast
================================ */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,28,40,.92);
  color: white;
  padding: 11px 16px;
  border-radius: 12px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  z-index: 1000;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ================================
   Settings Modal
================================ */

.modal-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 900;
  align-items: flex-end;
  justify-content: center;
}

.modal-mask.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 760px;
  background: var(--card);
  border-radius: 25px 25px 0 0;
  padding:
    20px
    20px
    calc(25px + env(safe-area-inset-bottom));
}

.modal-title {
  font-size: 19px;
  font-weight: 900;
}

.modal-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.modal-label {
  font-size: 14px;
  font-weight: 700;
}

.modal-desc {
  margin-top: 3px;
  color: var(--sub);
  font-size: 11px;
}

/* ================================
   Dark
================================ */

body.dark {
  --bg: #0e1420;
  --card: #171f2c;
  --text: #f1f5fb;
  --sub: #99a5b7;
  --border: #293344;
  --shadow: 0 10px 30px rgba(0,0,0,.25);
}

body.dark .level-btn.active {
  background: #192f52;
  border-color: #285996;
}

body.dark .answer {
  background: #121a26;
}

body.dark .btn-secondary {
  background: #222c3a;
  color: #f1f5fb;
}

body.dark .btn-green {
  background: #15372d;
}

body.dark .btn-orange {
  background: #3c2d18;
}

body.dark .btn-danger {
  background: #3b2022;
}

body.dark .tip {
  background: var(--card);
}

body.dark .progress-bar {
  background: #293344;
}

/* ================================
   Desktop
================================ */

@media (min-width: 768px) {
  .page {
    padding-top: 30px;
  }

  .listen-card {
    padding: 28px;
  }

  .audio-area {
    padding: 35px 10px 25px;
  }

  .audio-button {
    width: 108px;
    height: 108px;
    font-size: 42px;
  }
}

/* ================================
   Small phones
================================ */

@media (max-width: 360px) {
  .page {
    padding-left: 13px;
    padding-right: 13px;
  }

  .hero-title {
    font-size: 24px;
  }

  .question-title {
    font-size: 17px;
  }

  .audio-button {
    width: 84px;
    height: 84px;
    font-size: 32px;
  }
}
</style>
</head>

<body>

<div id="app">

  <main class="app">

    <div class="page">

      <!-- ============================
           Header
      ============================= -->

      <header class="header">

        <div class="header-left">

          <button
            class="back-btn"
            onclick="goHome()"
            aria-label="返回"
          >
            ←
          </button>

          <div>
            <div class="header-title">
              🎧 听句子
            </div>

            <div class="header-sub">
              听英语 · 猜意思 · 再看答案
            </div>
          </div>

        </div>

        <button
          class="header-action"
          onclick="openSettings()"
        >
          ⚙️
        </button>

      </header>


      <!-- ============================
           Hero
      ============================= -->

      <section class="hero">

        <div class="hero-content">

          <div class="hero-label">
            胖哥学英语 · Listening
          </div>

          <div class="hero-title">
            今天听懂了吗？🎧
          </div>

          <div class="hero-desc">
            先只听英文，不看文字。
            在脑子里想一想它是什么意思，再点击显示答案。
          </div>

          <div class="hero-stats">

            <div class="hero-stat">

              <div
                class="hero-stat-number"
                id="todayCount"
              >
                0
              </div>

              <div class="hero-stat-label">
                今日句子
              </div>

            </div>

            <div class="hero-stat">

              <div
                class="hero-stat-number"
                id="understoodCount"
              >
                0
              </div>

              <div class="hero-stat-label">
                听懂
              </div>

            </div>

            <div class="hero-stat">

              <div
                class="hero-stat-number"
                id="accuracy"
              >
                0%
              </div>

              <div class="hero-stat-label">
                理解率
              </div>

            </div>

          </div>

        </div>

      </section>


      <!-- ============================
           Level
      ============================= -->

      <section class="section">

        <div class="section-title">

          <strong>
            选择难度
          </strong>

          <span>
            当前：<span id="levelName">基础</span>
          </span>

        </div>

        <div class="level-tabs">

          <button
            class="level-btn active"
            data-level="1"
            onclick="changeLevel(1)"
          >
            🌱 基础
          </button>

          <button
            class="level-btn"
            data-level="2"
            onclick="changeLevel(2)"
          >
            🌿 日常
          </button>

          <button
            class="level-btn"
            data-level="3"
            onclick="changeLevel(3)"
          >
            🌳 进阶
          </button>

        </div>

      </section>


      <!-- ============================
           Listening Card
      ============================= -->

      <section class="listen-card">

        <div class="listen-top">

          <div class="listen-badge">
            🎧 英语听力
          </div>

          <div
            class="listen-number"
            id="sentenceNumber"
          >
            1 / 20
          </div>

        </div>


        <!-- Audio -->

        <div class="audio-area">

          <button
            class="audio-button"
            id="audioButton"
            onclick="playSentence()"
            aria-label="播放句子"
          >
            🔊
          </button>

          <div class="audio-title">
            点击播放英文句子
          </div>

          <div class="audio-hint">
            建议先闭上眼睛，只听声音
          </div>

        </div>


        <!-- Question -->

        <div class="question">

          <div class="question-title">
            这句话是什么意思？
          </div>

          <div class="question-desc">
            不要急着看答案，先自己想一想。
          </div>

        </div>


        <!-- Answer -->

        <div
          class="answer"
          id="answer"
        >

          <div class="answer-label">
            🇺🇸 英文原句
          </div>

          <div
            class="answer-english"
            id="answerEnglish"
          >
          </div>

          <div
            class="answer-chinese"
            id="answerChinese"
          >
          </div>

          <div
            class="answer-hint"
            id="answerHint"
          >
          </div>

        </div>


        <!-- Main actions -->

        <div class="actions">

          <button
            class="btn btn-primary"
            id="showAnswerBtn"
            onclick="showAnswer()"
          >
            👀 显示答案
          </button>

          <button
            class="btn btn-secondary"
            onclick="playSentence()"
          >
            🔊 再听一次
          </button>

        </div>


        <!-- Result -->

        <div
          class="result"
          id="result"
        >
        </div>


        <!-- Answer actions -->

        <div id="answerActions">

          <button
            class="btn btn-green full-btn"
            onclick="markUnderstood()"
          >
            ✅ 我听懂了
          </button>

          <button
            class="btn btn-orange full-btn"
            onclick="markRetry()"
          >
            🔄 没听懂，再练一次
          </button>

          <button
            class="btn btn-primary full-btn"
            onclick="nextSentence()"
          >
            下一句 →
          </button>

        </div>

      </section>


      <!-- ============================
           Progress
      ============================= -->

      <section class="progress-card">

        <div class="progress-header">

          <div class="progress-title">
            📅 今日听力目标
          </div>

          <div
            class="progress-value"
            id="progressText"
          >
            0 / 10
          </div>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            id="progressFill"
          >
          </div>

        </div>

      </section>


      <!-- ============================
           Tip
      ============================= -->

      <section class="tip">

        <div class="tip-title">
          💡 胖哥学习建议
        </div>

        <div class="tip-text">
          第一次只听声音，不要看英文。
          能猜出大概意思就算听懂。
          如果完全听不出来，再看答案并重复播放。
        </div>

      </section>


      <!-- ============================
           Bottom
      ============================= -->

      <div class="bottom">

        <button
          class="bottom-btn"
          onclick="randomSentence()"
        >
          🎲 随机一句
        </button>

        <button
          class="bottom-btn"
          onclick="showStats()"
        >
          📊 今日统计
        </button>

      </div>

    </div>

  </main>

</div>


<!-- ================================
     Settings Modal
================================= -->

<div
  class="modal-mask"
  id="settingsModal"
  onclick="closeSettings(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <div class="modal-title">
      ⚙️ 设置
    </div>


    <div class="modal-row">

      <div>

        <div class="modal-label">
          深色模式
        </div>

        <div class="modal-desc">
          夜间学习更加舒服
        </div>

      </div>

      <button
        class="btn btn-secondary"
        id="darkModeBtn"
        onclick="toggleDarkMode()"
      >
        开启
      </button>

    </div>


    <div class="modal-row">

      <div>

        <div class="modal-label">
          每日目标
        </div>

        <div class="modal-desc">
          每天建议完成 10 句话
        </div>

      </div>

      <button
        class="btn btn-secondary"
        onclick="setDailyTarget()"
      >
        10句
      </button>

    </div>


    <button
      class="btn btn-primary full-btn"
      onclick="closeSettings()"
    >
      完成
    </button>

  </div>

</div>


<!-- ================================
     Toast
================================= -->

<div
  class="toast"
  id="toast"
>
</div>


<script>

/* =====================================================
   胖哥学英语 · 听句子
   Version 1.0.0
===================================================== */

const APP_VERSION = "1.0.0";

const STORAGE_KEY = "pangge_listening_v1";

const DAILY_TARGET = 10;


/* =====================================================
   简单英语听力句子

   注意：
   这些句子均为原创学习句子，
   不直接复制任何影视作品台词。
===================================================== */

const SENTENCES = [

  /* =============================
     Level 1 基础
  ============================== */

  {
    id: "l1-001",
    level: 1,
    sentence: "What's this?",
    chinese: "这是什么？",
    hint: "What's = What is，用来询问某个东西是什么。"

/* =====================================================
   State
===================================================== */

let state = {

  level: 1,

  currentIndex: 0,

  todayCount: 0,

  understood: 0,

  retry: 0,

  streak: 0,

  lastDate: "",

  dailyTarget: DAILY_TARGET,

  darkMode: false,

  answered: false

};


/* =====================================================
   日期
===================================================== */

function getToday() {

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth() + 1).padStart(2, "0");

  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;

}


function getYesterday() {

  const d = new Date();

  d.setDate(d.getDate() - 1);

  const y = d.getFullYear();

  const m = String(d.getMonth() + 1).padStart(2, "0");

  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;

}


/* =====================================================
   保存
===================================================== */

function saveState() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =====================================================
   加载
===================================================== */

function loadState() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {

      const parsed = JSON.parse(saved);

      state = {
        ...state,
        ...parsed
      };

    }

  } catch (error) {

    console.warn(
      "无法读取学习记录",
      error
    );

  }

  checkDate();

}


/* =====================================================
   日期检查
===================================================== */

function checkDate() {

  const today = getToday();

  if (!state.lastDate) {

    state.lastDate = today;

    saveState();

    return;

  }

  if (state.lastDate === today) {

    return;

  }

  if (state.lastDate === getYesterday()) {

    state.streak =
      Number(state.streak || 0) + 1;

  } else {

    state.streak = 1;

  }

  state.todayCount = 0;

  state.understood = 0;

  state.retry = 0;

  state.lastDate = today;

  saveState();

}


/* =====================================================
   当前句子列表
===================================================== */

function getCurrentSentences() {

  return SENTENCES.filter(
    item => item.level === state.level
  );

}


/* =====================================================
   当前句子
===================================================== */

function getCurrentSentence() {

  const list = getCurrentSentences();

  if (!list.length) {

    return null;

  }

  if (
    state.currentIndex < 0 ||
    state.currentIndex >= list.length
  ) {

    state.currentIndex = 0;

  }

  return list[state.currentIndex];

}


/* =====================================================
   更新页面
===================================================== */

function render() {

  const list =
    getCurrentSentences();

  const item =
    getCurrentSentence();

  if (!item) return;


  /* 数量 */

  document.getElementById(
    "sentenceNumber"
  ).textContent =
    `${state.currentIndex + 1} / ${list.length}`;


  /* 答案 */

  document.getElementById(
    "answerEnglish"
  ).textContent =
    item.sentence;

  document.getElementById(
    "answerChinese"
  ).textContent =
    item.chinese;

  document.getElementById(
    "answerHint"
  ).textContent =
    "💡 " + item.hint;


  /* 隐藏答案 */

  document
    .getElementById("answer")
    .classList.remove("show");


  document.getElementById(
    "result"
  ).className = "result";


  state.answered = false;


  /* 更新按钮 */

  document.getElementById(
    "showAnswerBtn"
  ).style.display = "block";


  /* 首页统计 */

  updateStats();

}


/* =====================================================
   更新统计
===================================================== */

function updateStats() {

  const total =
    Number(state.todayCount || 0);

  const understood =
    Number(state.understood || 0);

  const accuracy =
    total > 0
      ? Math.round(
          understood / total * 100
        )
      : 0;


  document.getElementById(
    "todayCount"
  ).textContent = total;


  document.getElementById(
    "understoodCount"
  ).textContent = understood;


  document.getElementById(
    "accuracy"
  ).textContent =
    accuracy + "%";


  document.getElementById(
    "progressText"
  ).textContent =
    `${total} / ${state.dailyTarget}`;


  const percent =
    Math.min(
      100,
      Math.round(
        total /
        state.dailyTarget *
        100
      )
    );


  document.getElementById(
    "progressFill"
  ).style.width =
    percent + "%";

}


/* =====================================================
   播放句子
===================================================== */

function playSentence() {

  const item =
    getCurrentSentence();

  if (!item) return;


  if (
    !("speechSynthesis" in window)
  ) {

    showToast(
      "当前浏览器不支持语音播放"
    );

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      item.sentence
    );


  utterance.lang = "en-US";

  utterance.rate = 0.72;

  utterance.pitch = 1;


  const button =
    document.getElementById(
      "audioButton"
    );


  button.classList.add("playing");

  button.textContent = "🔊";


  utterance.onend = () => {

    button.classList.remove(
      "playing"
    );

  };


  utterance.onerror = () => {

    button.classList.remove(
      "playing"
    );

  };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   显示答案
===================================================== */

function showAnswer() {

  const answer =
    document.getElementById(
      "answer"
    );


  answer.classList.add("show");


  document.getElementById(
    "showAnswerBtn"
  ).style.display = "none";


  state.answered = true;

}


/* =====================================================
   听懂
===================================================== */

function markUnderstood() {

  if (!state.answered) {

    showToast(
      "请先查看答案"
    );

    return;

  }


  state.todayCount++;

  state.understood++;

  saveState();


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result show success";

  result.textContent =
    "🎉 很好！这句话你听懂了。";


  updateStats();


  showToast(
    "已记录：听懂 ✓"
  );


  setTimeout(() => {

    nextSentence();

  }, 700);

}


/* =====================================================
   没听懂
===================================================== */

function markRetry() {

  if (!state.answered) {

    showToast(
      "请先查看答案"
    );

    return;

  }


  state.todayCount++;

  state.retry++;

  saveState();


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result show retry";

  result.textContent =
    "💪 没关系，再听几遍。听力就是这样慢慢积累起来的。";


  updateStats();


  playSentence();


  showToast(
    "已记录，再听一次"
  );

}


/* =====================================================
   下一句
===================================================== */

function nextSentence() {

  const list =
    getCurrentSentences();

  if (!list.length) return;


  state.currentIndex++;

  if (
    state.currentIndex >= list.length
  ) {

    state.currentIndex = 0;

    showToast(
      "这一轮完成了，再来一轮吧！"
    );

  }


  saveState();

  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  setTimeout(() => {

    playSentence();

  }, 250);

}


/* =====================================================
   随机一句
===================================================== */

function randomSentence() {

  const list =
    getCurrentSentences();

  if (!list.length) return;


  let index =
    Math.floor(
      Math.random() * list.length
    );


  if (
    list.length > 1 &&
    index === state.currentIndex
  ) {

    index =
      (index + 1) %
      list.length;

  }


  state.currentIndex = index;

  saveState();

  render();


  setTimeout(() => {

    playSentence();

  }, 250);

}


/* =====================================================
   切换难度
===================================================== */

function changeLevel(level) {

  state.level = level;

  state.currentIndex = 0;

  saveState();


  document
    .querySelectorAll(".level-btn")
    .forEach(button => {

      const buttonLevel =
        Number(
          button.dataset.level
        );

      button.classList.toggle(
        "active",
        buttonLevel === level
      );

    });


  const names = {

    1: "基础",

    2: "日常",

    3: "进阶"

  };


  document.getElementById(
    "levelName"
  ).textContent =
    names[level];


  render();

  showToast(
    "已切换到：" + names[level]
  );

}


/* =====================================================
   统计
===================================================== */

function showStats() {

  const total =
    Number(state.todayCount || 0);

  const understood =
    Number(state.understood || 0);

  const retry =
    Number(state.retry || 0);

  const accuracy =
    total > 0
      ? Math.round(
          understood /
          total *
          100
        )
      : 0;


  alert(
`📊 今日听力统计

🎧 完成句子：${total}
✅ 听懂：${understood}
🔄 再练：${retry}
📈 理解率：${accuracy}%

🔥 连续学习：${state.streak || 0} 天

🎯 今日目标：${state.dailyTarget} 句`
  );

}


/* =====================================================
   Settings
===================================================== */

function openSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add("show");

}


function closeSettings(event) {

  if (
    event &&
    event.target !==
      document.getElementById(
        "settingsModal"
      )
  ) {

    return;

  }


  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove("show");

}


/* =====================================================
   Dark mode
===================================================== */

function toggleDarkMode() {

  state.darkMode =
    !state.darkMode;

  applyTheme();

  saveState();


  document.getElementById(
    "darkModeBtn"
  ).textContent =
    state.darkMode
      ? "关闭"
      : "开启";

}


function applyTheme() {

  document.body.classList.toggle(
    "dark",
    !!state.darkMode
  );


  const button =
    document.getElementById(
      "darkModeBtn"
    );

  if (button) {

    button.textContent =
      state.darkMode
        ? "关闭"
        : "开启";

  }

}


/* =====================================================
   每日目标
===================================================== */

function setDailyTarget() {

  const input =
    prompt(
      "请输入每日目标句子数量：",
      state.dailyTarget
    );


  if (input === null) return;


  const value =
    Number(input);


  if (
    !Number.isFinite(value) ||
    value < 1 ||
    value > 100
  ) {

    showToast(
      "请输入 1～100 之间的数字"
    );

    return;

  }


  state.dailyTarget =
    Math.floor(value);

  saveState();

  updateStats();

  showToast(
    "每日目标已修改"
  );

}


/* =====================================================
   Toast
===================================================== */

let toastTimer = null;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent = message;

  toast.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 1800);

}

   *
   */

  showToast(
    "这是独立的听力训练页面"
  );

}


/* =====================================================
   键盘快捷键
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.code === "Space"
    ) {

      event.preventDefault();

      playSentence();

    }


    if (
      event.key === "Enter"
    ) {

      const answer =
        document.getElementById(
          "answer"
        );


      if (
        !answer.classList.contains(
          "show"
        )
      ) {

        showAnswer();

      } else {

        nextSentence();

      }

    }


    if (
      event.key === "ArrowRight"
    ) {

      nextSentence();

    }

  }
);


/* =====================================================
   Swipe
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive: true
  }
);


document.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;


    const distance =
      touchEndX -
      touchStartX;


    if (
      Math.abs(distance) < 70
    ) {

      return;

    }


    if (distance < 0) {

      nextSentence();

    }

  },
  {
    passive: true
  }
);


/* =====================================================
   防止页面被双击放大
===================================================== */

let lastTouchEnd = 0;

document.addEventListener(
  "touchend",
  function(event) {

    const now =
      Date.now();

    if (
      now - lastTouchEnd <= 300
    ) {

      event.preventDefault();

    }

    lastTouchEnd = now;

  },
  {
    passive: false
  }
);


/* =====================================================
   初始化
===================================================== */

function init() {

  loadState();

  applyTheme();


  const level =
    Number(state.level || 1);


  changeLevel(level);


  updateStats();

}


/* =====================================================
   Start
===================================================== */

init();

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>胖哥学英语</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 560px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    /* =========================
       首页
       ========================= */

    .home {
      min-height: 100vh;
      padding: 24px 18px 30px;
    }

    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 700;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #999;
    }

    .today-card {
      background: #f5f6f8;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .today-title {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    .today-number {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
    }

    .today-number span {
      font-size: 14px;
      color: #999;
      margin-left: 4px;
      font-weight: 400;
    }

    .today-progress {
      margin-top: 16px;
      height: 6px;
      border-radius: 6px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .today-progress-bar {
      height: 100%;
      width: 0;
      background: #111;
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quick-item {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 16px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .quick-item:active {
      transform: scale(0.97);
      background: #f8f8f8;
    }

    .quick-icon {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .quick-name {
      font-size: 14px;
      font-weight: 600;
    }

    .quick-desc {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    .empty-home {
      margin-top: 30px;
      padding: 30px 20px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       听力页面
       ========================= */

    .listening-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .listening-header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    .back-btn {
      border: 0;
      background: transparent;
      padding: 8px 4px;
      font-size: 22px;
      cursor: pointer;
      color: #222;
    }

    .listening-title {
      font-size: 16px;
      font-weight: 700;
    }

    .header-progress {
      font-size: 12px;
      color: #999;
      min-width: 55px;
      text-align: right;
    }

    .listening-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .mode-label {
      font-size: 12px;
      color: #999;
    }

    .random-btn {
      border: 0;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    .sentence-card {
      flex: 1;
      min-height: 330px;
      border-radius: 20px;
      background: #f7f8fa;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .listen-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-bottom: 24px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .listen-icon:active {
      transform: scale(0.94);
    }

    .sentence-hidden {
      font-size: 17px;
      color: #aaa;
      letter-spacing: 0.5px;
      line-height: 1.7;
    }

    .sentence-en {
      display: none;
      font-size: 21px;
      font-weight: 650;
      line-height: 1.6;
      color: #111;
    }

    .sentence-zh {
      display: none;
      margin-top: 13px;
      font-size: 14px;
      color: #777;
      line-height: 1.7;
    }

    .sentence-card.show-answer .sentence-hidden {
      display: none;
    }

    .sentence-card.show-answer .sentence-en,
    .sentence-card.show-answer .sentence-zh {
      display: block;
    }

    .answer-btn {
      margin-top: 22px;
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 11px 24px;
      font-size: 14px;
      cursor: pointer;
    }

    .answer-btn:active {
      transform: scale(0.97);
    }

    .result-buttons {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .sentence-card.show-answer + .result-buttons {
      display: grid;
    }

    .result-btn {
      border: 1px solid #e5e5e5;
      background: #fff;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .result-btn:active {
      transform: scale(0.97);
    }

    .result-btn.good {
      background: #f2f2f2;
    }

    .next-btn {
      width: 100%;
      margin-top: 10px;
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      cursor: pointer;
    }

    .next-btn:active {
      transform: scale(0.98);
    }

    .listening-footer {
      padding: 12px 18px 20px;
      flex-shrink: 0;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .stats strong {
      color: #555;
      font-weight: 600;
    }

    /* =========================
       Toast
       ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       桌面端
       ========================= */

    @media (min-width: 700px) {
      body {
        background: #f0f1f3;
      }

      .app {
        min-height: 100vh;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
      }
    }
  </style>
</head>

<body>

<div class="app" id="app"></div>

<div class="toast" id="toast"></div>

<!--
  独立加载听力句子数据

  如果以后修改了 listening-sentences.js，
  可以把 ?v=20260905 改成新的版本号，
  例如 ?v=20260906，
  用于避免 GitHub Pages / 微信缓存旧文件。
-->
<script src="./data/listening-sentences.js?v=20260905"></script>

<script>
  "use strict";

  /* =========================================================
     基础配置
     ========================================================= */

  const STORAGE_KEY = "pangge_english_listening_v1";

  /*
   * 从独立 JS 文件读取句子
   */
  const sentences = Array.isArray(window.listeningSentences)
    ? window.listeningSentences
    : [];

  let currentIndex = 0;
  let listeningMode = "normal";

  /*
   * 学习记录
   *
   * {
   *   understood: {
   *     0: true,
   *     3: true
   *   },
   *   notUnderstood: {
   *     1: true,
   *     5: true
   *   },
   *   lastDate: "2026-09-05",
   *   todayCount: 5
   * }
   */
  let studyData = loadStudyData();


  /* =========================================================
     初始化
     ========================================================= */

  document.addEventListener("DOMContentLoaded", () => {
    if (!sentences.length) {
      showDataError();
      return;
    }

    showHome();
  });


  /* =========================================================
     首页
     ========================================================= */

  function showHome() {
    const app = document.getElementById("app");

    const todayCount = getTodayCount();

    app.innerHTML = `
      <div class="home">

        <div class="home-header">
          <div class="brand">
            <div class="avatar">胖</div>

            <div class="brand-text">
              <h1>胖哥学英语</h1>
              <p>每天听一点，英语自然就会了</p>
            </div>
          </div>
        </div>


        <div class="today-card">
          <div class="today-title">今日学习</div>

          <div class="today-number">
            ${todayCount}
            <span>句</span>
          </div>

          <div class="today-progress">
            <div
              class="today-progress-bar"
              style="width:${Math.min(todayCount * 10, 100)}%"
            ></div>
          </div>
        </div>


        <div class="section-title">快速学习</div>

        <div class="quick-grid">

          <button
            class="quick-item"
            onclick="openListening('normal')"
          >
            <div class="quick-icon">🎧</div>
            <div class="quick-name">听力训练</div>
            <div class="quick-desc">听一句，猜意思</div>
          </button>


          <button
            class="quick-item"
            onclick="openListening('review')"
          >
            <div class="quick-icon">🔄</div>
            <div class="quick-name">随机复习</div>
            <div class="quick-desc">重点复习没听懂的</div>
          </button>


          <button
            class="quick-item"
            onclick="showComingSoon('生词功能')"
          >
            <div class="quick-icon">📖</div>
            <div class="quick-name">我的生词</div>
            <div class="quick-desc">以后继续完善</div>
          </button>


          <button
            class="quick-item"
            onclick="showComingSoon('动画课程')"
          >
            <div class="quick-icon">📺</div>
            <div class="quick-name">动画课程</div>
            <div class="quick-desc">Peppa Pig / 神奇校车</div>
          </button>

        </div>


        <div class="section-title">学习内容</div>

        <div class="quick-grid">

          <button
            class="quick-item"
            onclick="openListening('normal')"
          >
            <div class="quick-icon">🎧</div>
            <div class="quick-name">300句生活英语</div>
            <div class="quick-desc">${sentences.length} 条短句</div>
          </button>


          <button
            class="quick-item"
            onclick="showComingSoon('更多课程')"
          >
            <div class="quick-icon">＋</div>
            <div class="quick-name">更多内容</div>
            <div class="quick-desc">后续可以继续增加</div>
          </button>

        </div>

      </div>
    `;
  }


  /* =========================================================
     听力页面
     ========================================================= */

  function openListening(mode = "normal") {
    listeningMode = mode;

    if (mode === "review") {
      const reviewIndexes = getReviewIndexes();

      if (reviewIndexes.length > 0) {
        currentIndex =
          reviewIndexes[
            Math.floor(Math.random() * reviewIndexes.length)
          ];
      } else {
        currentIndex =
          Math.floor(Math.random() * sentences.length);

        showToast("暂时没有没听懂的句子");
      }

    } else {
      currentIndex =
        Math.floor(Math.random() * sentences.length);
    }

    renderListeningPage();
  }


  function renderListeningPage() {
    const app = document.getElementById("app");

    const item = sentences[currentIndex];

    if (!item) {
      currentIndex = 0;
      renderListeningPage();
      return;
    }

    app.innerHTML = `
      <div class="listening-page">

        <div class="listening-header">

          <button
            class="back-btn"
            onclick="showHome()"
            aria-label="返回"
          >
            ‹
          </button>

          <div class="listening-title">
            听力训练
          </div>

          <div class="header-progress">
            ${currentIndex + 1}/${sentences.length}
          </div>

        </div>


        <div class="listening-content">

          <div class="status-row">

            <div class="mode-label">
              ${listeningMode === "review"
                ? "🔄 重点复习"
                : "🎧 正常训练"}
            </div>

            <button
              class="random-btn"
              onclick="randomSentence()"
            >
              随机
            </button>

          </div>


          <div
            class="sentence-card"
            id="sentenceCard"
          >

            <div
              class="listen-icon"
              onclick="speakCurrentSentence()"
              aria-label="播放"
            >
              ▶
            </div>


            <div class="sentence-hidden">
              仔细听，想想是什么意思？
            </div>


            <div class="sentence-en">
              ${escapeHtml(item.en)}
            </div>


            <div class="sentence-zh">
              ${escapeHtml(item.zh)}
            </div>


            <button
              class="answer-btn"
              onclick="showAnswer()"
            >
              显示答案
            </button>

          </div>


          <div
            class="result-buttons"
            id="resultButtons"
          >

            <button
              class="result-btn good"
              onclick="markUnderstood()"
            >
              ✓ 听懂了
            </button>

            <button
              class="result-btn"
              onclick="markNotUnderstood()"
            >
              ✕ 没听懂
            </button>

          </div>


          <button
            class="next-btn"
            onclick="nextSentence()"
          >
            下一句
          </button>

        </div>


        <div class="listening-footer">

          <div class="stats">
            <span>
              今日 <strong>${getTodayCount()}</strong> 句
            </span>

            <span>
              已掌握 <strong>${getUnderstoodCount()}</strong>
            </span>

            <span>
              待复习 <strong>${getReviewIndexes().length}</strong>
            </span>
          </div>

        </div>

      </div>
    `;

    /*
     * 页面出现后自动播放
     */
    setTimeout(() => {
      speakCurrentSentence();
    }, 350);
  }


  /* =========================================================
     播放语音
     ========================================================= */

  function speakCurrentSentence() {
    const item = sentences[currentIndex];

    if (!item) return;

    if (!("speechSynthesis" in window)) {
      showToast("当前浏览器不支持语音播放");
      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(item.en);

    utterance.lang = "en-US";
    utterance.rate = 0.82;
    utterance.pitch = 1;
    utterance.volume = 1;

    window.speechSynthesis.speak(utterance);
  }


  /* =========================================================
     显示答案
     ========================================================= */

  function showAnswer() {
    const card = document.getElementById("sentenceCard");

    if (!card) return;

    card.classList.add("show-answer");

    /*
     * 显示答案以后，
     * 自动停止正在播放的语音
     */
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  }


  /* =========================================================
     标记：听懂
     ========================================================= */

  function markUnderstood() {
    studyData.understood[currentIndex] = true;

    /*
     * 如果之前标记为没听懂，
     * 现在听懂了就删除待复习标记
     */
    delete studyData.notUnderstood[currentIndex];

    increaseTodayCount();

    saveStudyData();

    showToast("已记录：听懂了");

    setTimeout(() => {
      nextSentence();
    }, 250);
  }


  /* =========================================================
     标记：没听懂
     ========================================================= */

  function markNotUnderstood() {
    studyData.notUnderstood[currentIndex] = true;

    delete studyData.understood[currentIndex];

    increaseTodayCount();

    saveStudyData();

    showToast("已加入复习");

    setTimeout(() => {
      nextSentence();
    }, 250);
  }


  /* =========================================================
     下一句
     ========================================================= */

  function nextSentence() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }

    if (listeningMode === "review") {
      const reviewIndexes = getReviewIndexes();

      if (reviewIndexes.length > 0) {
        currentIndex =
          reviewIndexes[
            Math.floor(Math.random() * reviewIndexes.length)
          ];

        renderListeningPage();
        return;
      }
    }

    currentIndex++;

    if (currentIndex >= sentences.length) {
      currentIndex = 0;
    }

    renderListeningPage();
  }


  /* =========================================================
     随机一句
     ========================================================= */

  function randomSentence() {
    if (sentences.length <= 1) return;

    let newIndex;

    do {
      newIndex =
        Math.floor(Math.random() * sentences.length);
    } while (newIndex === currentIndex);

    currentIndex = newIndex;

    renderListeningPage();
  }


  /* =========================================================
     复习列表
     ========================================================= */

  function getReviewIndexes() {
    return Object.keys(studyData.notUnderstood)
      .map(Number)
      .filter(index =>
        index >= 0 &&
        index < sentences.length &&
        studyData.notUnderstood[index]
      );
  }


  /* =========================================================
     学习统计
     ========================================================= */

  function increaseTodayCount() {
    const today = getTodayString();

    if (studyData.lastDate !== today) {
      studyData.lastDate = today;
      studyData.todayCount = 0;
    }

    studyData.todayCount++;
  }


  function getTodayCount() {
    const today = getTodayString();

    if (studyData.lastDate !== today) {
      studyData.lastDate = today;
      studyData.todayCount = 0;
      saveStudyData();
    }

    return studyData.todayCount || 0;
  }


  function getUnderstoodCount() {
    return Object.keys(studyData.understood)
      .filter(index =>
        studyData.understood[index]
      ).length;
  }


  function getTodayString() {
    const now = new Date();

    const year = now.getFullYear();

    const month =
      String(now.getMonth() + 1).padStart(2, "0");

    const day =
      String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /* =========================================================
     LocalStorage
     ========================================================= */

  function loadStudyData() {
    const defaultData = {
      understood: {},
      notUnderstood: {},
      lastDate: getTodayString(),
      todayCount: 0
    };

    try {
      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return defaultData;
      }

      const data = JSON.parse(saved);

      return {
        understood:
          data.understood || {},

        notUnderstood:
          data.notUnderstood || {},

        lastDate:
          data.lastDate || getTodayString(),

        todayCount:
          Number(data.todayCount) || 0
      };

    } catch (error) {
      console.error(
        "读取学习记录失败:",
        error
      );

      return defaultData;
    }
  }


  function saveStudyData() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(studyData)
      );
    } catch (error) {
      console.error(
        "保存学习记录失败:",
        error
      );
    }
  }


  /* =========================================================
     数据错误
     ========================================================= */

  function showDataError() {
    const app = document.getElementById("app");

    app.innerHTML = `
      <div class="home">

        <div class="empty-home">
          <div style="font-size:32px;margin-bottom:12px;">
            😕
          </div>

          <div>
            听力数据加载失败
          </div>

          <div style="margin-top:8px;font-size:11px;">
            请检查 data/listening-sentences.js
          </div>

        </div>

      </div>
    `;
  }


  /* =========================================================
     HTML 转义
     ========================================================= */

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     Toast
     ========================================================= */

  let toastTimer = null;

  function showToast(message) {
    const toast =
      document.getElementById("toast");

    if (!toast) return;

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 1500);
  }


  /* =========================================================
     暂未开放功能
     ========================================================= */

  function showComingSoon(name) {
    showToast(name + "正在完善");
  }


  /* =========================================================
     防止页面退出时继续播放
     ========================================================= */

  window.addEventListener("pagehide", () => {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  });

</script>

</body>
</html>

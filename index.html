<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

    <meta
        http-equiv="Pragma"
        content="no-cache">

    <meta
        http-equiv="Expires"
        content="0">

    <title>胖哥学英语 · English Flash Cards</title>

    <meta
        name="description"
        content="胖哥学英语 - 英文单词闪卡学习工具">

    <meta
        name="theme-color"
        content="#111827">


<style>

/* =====================================================
   基础
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;

    -webkit-text-size-adjust: 100%;
}

body {

    width: 100%;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        "Noto Sans SC",
        sans-serif;

    background: #f5f7fb;

    color: #111827;

    overflow-x: hidden;

    transition:
        background .25s,
        color .25s;
}


:root {

    --bg: #f5f7fb;

    --card: #ffffff;

    --text: #111827;

    --secondary: #6b7280;

    --border: #e5e7eb;

    --primary: #4f46e5;

    --primary-hover: #4338ca;

    --success: #16a34a;

    --danger: #dc2626;

    --shadow:
        0 10px 35px rgba(0,0,0,.08);
}


body.dark {

    --bg: #0f172a;

    --card: #1e293b;

    --text: #f8fafc;

    --secondary: #94a3b8;

    --border: #334155;

    --shadow:
        0 10px 35px rgba(0,0,0,.35);
}


button,
select {

    font: inherit;
}


button {

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}


/* =====================================================
   Header
===================================================== */

header {

    width: 100%;

    min-height: 72px;

    background:
        var(--card);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        12px
        max(20px, env(safe-area-inset-right))
        12px
        max(20px, env(safe-area-inset-left));

    position: sticky;

    top: 0;

    z-index: 100;
}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}


.brand-logo {

    width: 44px;

    height: 44px;

    flex-shrink: 0;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 26px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );
}


.brand-text {

    min-width: 0;
}


.brand-text h1 {

    font-size: 20px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.brand-text p {

    font-size: 12px;

    color: var(--secondary);

    margin-top: 2px;
}


.header-actions {

    display: flex;

    gap: 8px;

    flex-shrink: 0;
}


.icon-button {

    width: 42px;

    height: 42px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    color:
        var(--text);

    border-radius: 10px;

    font-size: 18px;

    transition:
        transform .2s,
        background .2s;
}


.icon-button:hover {

    transform:
        translateY(-1px);

    background:
        var(--bg);
}


/* =====================================================
   Main
===================================================== */

main {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding:
        clamp(20px, 4vw, 40px)
        clamp(14px, 4vw, 25px)
        60px;
}


/* =====================================================
   控制区域
===================================================== */

.control-bar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}


.select-group {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;
}


.select-group label {

    color:
        var(--secondary);

    font-size: 14px;

    white-space: nowrap;
}


select {

    width: 260px;

    max-width: 100%;

    min-height: 44px;

    padding:
        10px
        35px
        10px
        13px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background:
        var(--card);

    color:
        var(--text);

    outline: none;
}


select:focus {

    border-color:
        var(--primary);
}


.random-button {

    min-height: 44px;

    padding:
        10px 18px;

    border: none;

    border-radius: 10px;

    background:
        var(--primary);

    color: white;

    font-weight: 600;

    white-space: nowrap;

    transition:
        transform .2s,
        background .2s;
}


.random-button:hover {

    background:
        var(--primary-hover);

    transform:
        translateY(-1px);
}


/* =====================================================
   统计
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    margin-bottom: 30px;
}


.stat-card {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 18px;

    box-shadow:
        var(--shadow);

    min-width: 0;
}


.stat-label {

    font-size: 13px;

    color:
        var(--secondary);

    margin-bottom: 7px;
}


.stat-value {

    font-size:
        clamp(22px, 3vw, 28px);

    font-weight: 800;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   Flash Card
===================================================== */

.flash-card-container {

    width: 100%;

    max-width: 760px;

    height:
        clamp(
            350px,
            55vh,
            460px
        );

    min-height: 330px;

    margin:
        0 auto 25px;

    perspective: 1200px;
}


.flash-card {

    width: 100%;

    height: 100%;

    position: relative;

    transform-style:
        preserve-3d;

    transition:
        transform .6s;

    cursor: pointer;

    touch-action: manipulation;
}


.flash-card.flipped {

    transform:
        rotateY(180deg);
}


.card-face {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    backface-visibility:
        hidden;

    border-radius:
        clamp(18px, 4vw, 25px);

    background:
        var(--card);

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        clamp(20px, 5vw, 40px);

    overflow: auto;
}


.card-back {

    transform:
        rotateY(180deg);
}


.card-label {

    font-size: 12px;

    color:
        var(--secondary);

    margin-bottom: 18px;

    text-transform:
        uppercase;

    letter-spacing: 1.5px;
}


.word {

    font-size:
        clamp(
            40px,
            8vw,
            72px
        );

    line-height: 1.1;

    font-weight: 800;

    letter-spacing:
        -1.5px;

    max-width: 100%;

    overflow-wrap:
        anywhere;

    margin-bottom: 15px;
}


.phonetic {

    font-size:
        clamp(16px, 3vw, 20px);

    color:
        var(--secondary);

    margin-bottom: 20px;
}


.hint {

    color:
        var(--secondary);

    font-size: 14px;
}


.meaning {

    font-size:
        clamp(
            25px,
            5vw,
            40px
        );

    line-height: 1.3;

    font-weight: 700;

    margin-bottom: 25px;

    max-width: 100%;

    overflow-wrap:
        anywhere;
}


.example {

    width: 100%;

    max-width: 650px;

    font-size:
        clamp(15px, 2.5vw, 18px);

    line-height: 1.7;

    margin-bottom: 8px;

    overflow-wrap:
        anywhere;
}


.example-cn {

    width: 100%;

    max-width: 650px;

    color:
        var(--secondary);

    font-size: 15px;

    line-height: 1.6;

    overflow-wrap:
        anywhere;
}


/* =====================================================
   Audio
===================================================== */

.audio-button {

    margin-top: 20px;

    border: none;

    padding:
        11px 18px;

    min-height: 42px;

    border-radius: 10px;

    background:
        var(--bg);

    color:
        var(--text);

    font-weight: 600;

    touch-action: manipulation;

    transition:
        transform .2s;
}


.audio-button:hover {

    transform:
        scale(1.03);
}


/* =====================================================
   Progress
===================================================== */

.progress-section {

    width: 100%;

    max-width: 760px;

    margin:
        0 auto 25px;
}


.progress-info {

    display: flex;

    justify-content:
        space-between;

    gap: 10px;

    font-size: 13px;

    color:
        var(--secondary);

    margin-bottom: 7px;
}


.progress-bar {

    width: 100%;

    height: 8px;

    background:
        var(--border);

    border-radius: 10px;

    overflow: hidden;
}


.progress-value {

    height: 100%;

    width: 0%;

    background:
        var(--primary);

    transition:
        width .3s;
}


/* =====================================================
   Action
===================================================== */

.action-buttons {

    width: 100%;

    max-width: 760px;

    margin:
        0 auto 25px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}


.action-button {

    min-height: 50px;

    padding:
        13px;

    border: none;

    border-radius: 12px;

    font-weight: 700;

    touch-action: manipulation;

    transition:
        transform .15s;
}


.action-button:active {

    transform:
        scale(.98);
}


.not-known {

    background:
        rgba(220,38,38,.1);

    color:
        var(--danger);
}


.known {

    background:
        rgba(22,163,74,.1);

    color:
        var(--success);
}


/* =====================================================
   Navigation
===================================================== */

.navigation {

    width: 100%;

    max-width: 760px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}


.nav-button {

    min-height: 46px;

    padding:
        11px 20px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    color:
        var(--text);

    border-radius: 10px;

    font-weight: 600;

    touch-action: manipulation;
}


.nav-button:hover {

    background:
        var(--bg);
}


/* =====================================================
   Loading
===================================================== */

.loading {

    min-height: 400px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 15px;

    color:
        var(--secondary);
}


.spinner {

    width: 35px;

    height: 35px;

    border:
        3px solid var(--border);

    border-top-color:
        var(--primary);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =====================================================
   Error
===================================================== */

.message {

    width: 100%;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 15px;

    padding: 30px;

    text-align: center;

    color:
        var(--secondary);

    line-height: 1.8;
}


/* =====================================================
   Footer
===================================================== */

footer {

    text-align: center;

    padding:
        30px 20px;

    color:
        var(--secondary);

    font-size: 13px;
}


/* =====================================================
   手机
===================================================== */

@media (max-width: 700px) {

    header {

        min-height: 62px;

        padding:
            9px 14px;
    }


    .brand-logo {

        width: 38px;

        height: 38px;

        font-size: 22px;

        border-radius: 10px;
    }


    .brand {

        gap: 9px;
    }


    .brand-text h1 {

        font-size: 17px;
    }


    .brand-text p {

        display: none;
    }


    main {

        padding:
            20px 14px 45px;
    }


    .control-bar {

        flex-direction:
            column;

        align-items:
            stretch;
    }


    .select-group {

        width: 100%;
    }


    select {

        flex: 1;

        width: 100%;

        min-width: 0;
    }


    .random-button {

        width: 100%;
    }


    .stats {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }


    .stat-card {

        padding: 14px;
    }


    .flash-card-container {

        height:
            min(
                58vh,
                420px
            );

        min-height: 340px;
    }


    .card-face {

        padding:
            22px 18px;
    }


    .word {

        font-size:
            clamp(
                38px,
                12vw,
                58px
            );
    }


    .meaning {

        font-size:
            clamp(
                24px,
                8vw,
                34px
            );
    }


    .action-button {

        min-height: 52px;
    }
}


/* =====================================================
   超小屏手机
===================================================== */

@media (max-width: 380px) {

    .brand-text h1 {

        font-size: 15px;
    }


    .icon-button {

        width: 38px;

        height: 38px;
    }


    .stats {

        gap: 8px;
    }


    .stat-card {

        padding: 12px;
    }


    .stat-value {

        font-size: 22px;
    }


    .flash-card-container {

        min-height: 320px;

        height: 55vh;
    }
}


/* =====================================================
   横屏手机
===================================================== */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    .flash-card-container {

        height: 360px;

        min-height: 300px;
    }


    main {

        padding-top: 15px;
    }
}


/* =====================================================
   大屏
===================================================== */

@media (min-width: 1400px) {

    main {

        max-width: 1200px;
    }


    .flash-card-container {

        max-width: 820px;

        height: 480px;
    }


    .progress-section,
    .action-buttons,
    .navigation {

        max-width: 820px;
    }
}


/* =====================================================
   减少动画
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        scroll-behavior:
            auto !important;

        transition-duration:
            .01ms !important;

        animation-duration:
            .01ms !important;
    }
}

</style>

</head>

<script>

/* =====================================================
   版本号

   每次修改 index.html 不需要手工修改这里。

   对 JSON 使用时间戳参数：

   ?v=当前时间

   浏览器会把它当成新的 URL，
   从而避免使用旧缓存。
===================================================== */


const BASE_URL = "./";

const DATA_INDEX = "./data/index.json";


/* =====================================================
   全局变量
===================================================== */

let decks = [];

let currentDeck = null;

let words = [];

let currentIndex = 0;

let progressData = {};


/* =====================================================
   DOM
===================================================== */

const deckSelect =
    document.getElementById("deckSelect");

const loading =
    document.getElementById("loading");

const learningArea =
    document.getElementById("learningArea");

const errorMessage =
    document.getElementById("errorMessage");

const flashCard =
    document.getElementById("flashCard");

const wordElement =
    document.getElementById("word");

const phoneticElement =
    document.getElementById("phonetic");

const meaningElement =
    document.getElementById("meaning");

const exampleElement =
    document.getElementById("example");

const exampleCnElement =
    document.getElementById("exampleCn");


/* =====================================================
   生成 Cache Busting URL
===================================================== */

function freshUrl(url) {

    const separator =
        url.includes("?")
            ? "&"
            : "?";

    return (
        url +
        separator +
        "v=" +
        Date.now()
    );

}


/* =====================================================
   初始化
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    loadTheme();

    bindEvents();

    /*
     * 加载最新词库
     */

    await loadDeckIndex();

}


/* =====================================================
   获取最新 JSON
===================================================== */

async function fetchFreshJson(url) {

    const response =
        await fetch(
            freshUrl(url),
            {
                method: "GET",

                cache: "no-store",

                headers: {
                    "Cache-Control":
                        "no-cache, no-store, must-revalidate",

                    "Pragma":
                        "no-cache"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}: ${url}`
        );

    }


    return await response.json();

}


/* =====================================================
   加载词库列表
===================================================== */

async function loadDeckIndex() {

    try {

        loading.style.display =
            "flex";

        learningArea.style.display =
            "none";

        errorMessage.style.display =
            "none";


        decks =
            await fetchFreshJson(
                DATA_INDEX
            );


        if (
            !Array.isArray(decks) ||
            decks.length === 0
        ) {

            throw new Error(
                "data/index.json 中没有词库"
            );

        }


        renderDeckList();


        /*
         * 默认加载第一个词库
         */

        await loadDeck(
            decks[0].id
        );

    }
    catch (error) {

        console.error(error);

        showError(
            "词库加载失败。<br><br>" +
            error.message +
            "<br><br>" +
            "请检查 GitHub Pages 中的 data/index.json。"
        );

    }

}


/* =====================================================
   显示词库列表
===================================================== */

function renderDeckList() {

    deckSelect.innerHTML = "";


    decks.forEach(
        deck => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                deck.id;


            option.textContent =
                deck.name ||
                deck.id;


            deckSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   加载词库
===================================================== */

async function loadDeck(deckId) {

    try {

        loading.style.display =
            "flex";

        learningArea.style.display =
            "none";


        const deck =
            decks.find(
                item =>
                    item.id === deckId
            );


        if (!deck) {

            throw new Error(
                "找不到词库：" +
                deckId
            );

        }


        currentDeck =
            deck;


        /*
         * 每次重新请求 JSON
         */

        words =
            await fetchFreshJson(
                "./data/" + deck.file
            );


        if (
            !Array.isArray(words)
        ) {

            throw new Error(
                deck.file +
                " 格式错误"
            );

        }


        if (
            words.length === 0
        ) {

            throw new Error(
                "当前词库没有单词"
            );

        }


        /*
         * 加载学习记录
         */

        loadProgress();


        /*
         * 恢复位置
         */

        const saved =
            progressData[
                currentDeck.id
            ];


        if (
            saved &&
            typeof saved.currentIndex ===
                "number" &&
            saved.currentIndex >= 0 &&
            saved.currentIndex <
                words.length
        ) {

            currentIndex =
                saved.currentIndex;

        }
        else {

            currentIndex = 0;

        }


        renderWord();


        loading.style.display =
            "none";

        learningArea.style.display =
            "block";

    }
    catch (error) {

        console.error(error);

        showError(
            "词库加载失败：<br><br>" +
            error.message
        );

    }

}


/* =====================================================
   显示单词
===================================================== */

function renderWord() {

    if (!words.length) {
        return;
    }


    const item =
        words[currentIndex];


    wordElement.textContent =
        item.word || "";


    phoneticElement.textContent =
        item.phonetic || "";


    meaningElement.textContent =
        item.meaning ||
        "暂无中文释义";


    exampleElement.textContent =
        item.example ||
        "";


    exampleCnElement.textContent =
        item.example_cn ||
        "";


    flashCard.classList.remove(
        "flipped"
    );


    updateStats();

    saveCurrentIndex();

}


/* =====================================================
   翻牌
===================================================== */

function flipCard() {

    flashCard.classList.toggle(
        "flipped"
    );

}


/* =====================================================
   上一个
===================================================== */

function previousWord() {

    if (!words.length) {
        return;
    }


    currentIndex--;


    if (currentIndex < 0) {

        currentIndex =
            words.length - 1;

    }


    renderWord();

}


/* =====================================================
   下一个
===================================================== */

function nextWord() {

    if (!words.length) {
        return;
    }


    currentIndex++;


    if (
        currentIndex >=
        words.length
    ) {

        currentIndex = 0;

    }


    renderWord();

}


/* =====================================================
   随机
===================================================== */

function randomWord() {

    if (words.length <= 1) {
        return;
    }


    let newIndex;


    do {

        newIndex =
            Math.floor(
                Math.random() *
                words.length
            );

    }
    while (
        newIndex === currentIndex
    );


    currentIndex =
        newIndex;


    renderWord();

}


/* =====================================================
   发音
===================================================== */

function speakWord() {

    if (!words.length) {
        return;
    }


    const text =
        words[currentIndex].word;


    if (!text) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-US";


    utterance.rate =
        0.85;


    utterance.pitch =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   标记学习状态
===================================================== */

function markWord(status) {

    if (
        !currentDeck ||
        !words.length
    ) {

        return;

    }


    if (
        !progressData[
            currentDeck.id
        ]
    ) {

        progressData[
            currentDeck.id
        ] = {

            known: [],

            unknown: [],

            currentIndex: 0

        };

    }


    const data =
        progressData[
            currentDeck.id
        ];


    const word =
        words[currentIndex].word;


    /*
     * 先从两个列表删除
     */

    data.known =
        data.known.filter(
            item =>
                item !== word
        );


    data.unknown =
        data.unknown.filter(
            item =>
                item !== word
        );


    /*
     * 加入新的状态
     */

    if (
        status === "known"
    ) {

        data.known.push(
            word
        );

    }
    else {

        data.unknown.push(
            word
        );

    }


    saveProgress();

    updateStats();


    /*
     * 自动进入下一个
     */

    setTimeout(
        nextWord,
        150
    );

}


/* =====================================================
   统计
===================================================== */

function updateStats() {

    if (
        !currentDeck ||
        !words.length
    ) {

        return;

    }


    const data =
        progressData[
            currentDeck.id
        ] || {

            known: [],

            unknown: []

        };


    const known =
        data.known.length;


    const unknown =
        data.unknown.length;


    const learned =
        known + unknown;


    const rate =
        Math.round(
            known /
            words.length *
            100
        );


    document.getElementById(
        "totalWords"
    ).textContent =
        words.length;


    document.getElementById(
        "learnedWords"
    ).textContent =
        learned;


    document.getElementById(
        "knownWords"
    ).textContent =
        known;


    document.getElementById(
        "masteryRate"
    ).textContent =
        rate + "%";


    const progress =
        (
            (currentIndex + 1) /
            words.length
        ) * 100;


    document.getElementById(
        "progressValue"
    ).style.width =
        progress + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        `${currentIndex + 1} / ${words.length}`;

}


/* =====================================================
   学习进度
===================================================== */

function loadProgress() {

    try {

        const saved =
            localStorage.getItem(
                "pangge_english_progress"
            );


        progressData =
            saved
                ? JSON.parse(saved)
                : {};

    }
    catch (error) {

        console.error(
            "读取学习进度失败",
            error
        );


        progressData = {};

    }

}


function saveProgress() {

    try {

        localStorage.setItem(
            "pangge_english_progress",
            JSON.stringify(
                progressData
            )
        );

    }
    catch (error) {

        console.error(
            "保存学习进度失败",
            error
        );

    }

}


function saveCurrentIndex() {

    if (!currentDeck) {
        return;
    }


    if (
        !progressData[
            currentDeck.id
        ]
    ) {

        progressData[
            currentDeck.id
        ] = {

            known: [],

            unknown: [],

            currentIndex: 0

        };

    }


    progressData[
        currentDeck.id
    ].currentIndex =
        currentIndex;


    saveProgress();

}


/* =====================================================
   Theme
===================================================== */

function loadTheme() {

    const theme =
        localStorage.getItem(
            "pangge_english_theme"
        );


    if (
        theme === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );


        document.getElementById(
            "themeButton"
        ).textContent =
            "☀️";

    }

}


function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "pangge_english_theme",
        isDark
            ? "dark"
            : "light"
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        isDark
            ? "☀️"
            : "🌙";

}

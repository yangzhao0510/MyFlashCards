<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>胖哥学英语</title>

    <style>

        /* =====================================================
           Base
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;

            background: #f6f7fb;
            color: #202124;

            overflow-x: hidden;

            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        button,
        select {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           Header
        ===================================================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            height: 62px;

            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e8e9ee;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-inner {
            width: min(1100px, calc(100% - 32px));
            height: 100%;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background: #f0f1f5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* =====================================================
           Main
        ===================================================== */

        .main {
            width: min(1100px, calc(100% - 32px));

            margin: 0 auto;

            padding-top: 18px;

            /*
             * Reserve enough space for the fixed bottom nav.
             */
            padding-bottom:
                calc(110px + env(safe-area-inset-bottom));
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =====================================================
           Loading
        ===================================================== */

        .loading {
            min-height: 45vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #777;
            font-size: 14px;
            text-align: center;
        }

        /* =====================================================
           Error
        ===================================================== */

        .error-box {
            display: none;

            width: 100%;
            max-width: 760px;

            margin: 25px auto;

            padding: 18px 20px;

            border-radius: 14px;

            background: #fff;

            border: 1px solid #f0caca;

            color: #c62828;

            font-size: 14px;
            line-height: 1.7;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .error-title {
            margin-bottom: 8px;

            font-size: 16px;
            font-weight: 700;
        }

        /* =====================================================
           Learning Top
        ===================================================== */

        .learning-top {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 10px;
        }

        .deck-select {
            flex: 1;

            width: 100%;
            height: 44px;

            padding: 0 14px;

            border: 1px solid #dedfe6;
            border-radius: 12px;

            outline: none;

            background: #fff;
            color: #202124;

            font-size: 14px;

            cursor: pointer;
        }

        .progress-info {
            flex-shrink: 0;

            color: #777;

            font-size: 12px;
            white-space: nowrap;
        }

        .progress {
            width: 100%;
            height: 4px;

            margin-bottom: 14px;

            overflow: hidden;

            border-radius: 999px;

            background: #e6e7ec;
        }

        .progress-bar {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background: #202124;

            transition: width 0.25s ease;
        }

        /* =====================================================
           Flash Card
        ===================================================== */

        .card-container {
            width: 100%;

            height: 430px;
            min-height: 430px;

            perspective: 1200px;
        }

        .flashcard {
            position: relative;

            width: 100%;
            height: 100%;

            cursor: pointer;

            transform-style: preserve-3d;

            transition:
                transform 0.55s ease;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px;

            border-radius: 24px;

            background: #fff;

            border: 1px solid #e8e9ee;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.06);

            overflow: hidden;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-front {
            transform: rotateY(0deg);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .word-label {
            margin-bottom: 10px;

            color: #999;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .word {
            max-width: 95%;

            text-align: center;

            font-size: clamp(46px, 7vw, 76px);

            line-height: 1.05;

            font-weight: 800;

            letter-spacing: -2px;

            word-break: break-word;
        }

        .phonetic {
            margin-top: 12px;

            color: #777;

            font-size: 16px;

            text-align: center;
        }

        .speak-main {
            width: 48px;
            height: 48px;

            margin-top: 18px;

            border: 0;
            border-radius: 50%;

            background: #202124;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;

            cursor: pointer;

            transition:
                transform 0.2s ease;
        }

        .speak-main:active {
            transform: scale(0.90);
        }

        .card-hint {
            position: absolute;

            bottom: 18px;

            color: #aaa;

            font-size: 11px;
        }

        .meaning {
            max-width: 90%;

            text-align: center;

            font-size: 30px;

            line-height: 1.35;

            font-weight: 700;

            word-break: break-word;
        }

        .example {
            max-width: 90%;

            margin-top: 18px;

            text-align: center;

            color: #555;

            font-size: 16px;

            line-height: 1.7;

            word-break: break-word;
        }

        .example-cn {
            margin-top: 5px;

            color: #888;
        }

        /* =====================================================
           Navigation
        ===================================================== */

        .navigation {
            display: grid;

            grid-template-columns:
                1fr
                1.2fr
                1fr;

            gap: 8px;

            margin-top: 10px;
        }

        .nav-control {
            width: 100%;
            height: 46px;

            border: 1px solid #e2e3e8;
            border-radius: 12px;

            background: #fff;
            color: #333;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease;
        }

        .nav-control:active {
            transform: scale(0.98);
        }

        .flip-btn {
            background: #202124;
            color: #fff;

            border-color: #202124;
        }

        /* =====================================================
           Knowledge Buttons
        ===================================================== */

        .knowledge {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-top: 8px;
        }

        .knowledge-btn {
            width: 100%;
            height: 46px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease;
        }

        .knowledge-btn:active {
            transform: scale(0.98);
        }

        .unknown-btn {
            background: #fff0f0;
            color: #c62828;

            border: 1px solid #ffd3d3;
        }

        .known-btn {
            background: #eef8f0;
            color: #25813a;

            border: 1px solid #cfe8d4;
        }

        /* =====================================================
           Library
        ===================================================== */

        .page-title {
            margin: 4px 0 18px;

            font-size: 28px;
            font-weight: 800;
        }

        .deck-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap: 14px;
        }

        .deck-card {
            padding: 20px;

            border-radius: 16px;

            background: #fff;

            border: 1px solid #e8e9ee;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .deck-card:active {
            transform: scale(0.98);
        }

        .deck-name {
            font-size: 17px;
            font-weight: 750;
        }

        .deck-description {
            margin-top: 8px;

            color: #777;

            font-size: 13px;
            line-height: 1.6;
        }

        .deck-count {
            margin-top: 14px;

            color: #999;

            font-size: 12px;
        }

        /* =====================================================
           Stats
        ===================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;
        }

        .stat-card {
            padding: 20px;

            border-radius: 16px;

            background: #fff;

            border: 1px solid #e8e9ee;
        }

        .stat-label {
            color: #777;

            font-size: 13px;
        }

        .stat-value {
            margin-top: 7px;

            font-size: 32px;
            font-weight: 800;
        }

        .mastery-wrap {
            margin-top: 14px;
        }

        .mastery-label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 7px;

            color: #777;

            font-size: 12px;
        }

        .mastery-bar {
            width: 100%;
            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background: #e8e9ee;
        }

        .mastery-progress {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background: #202124;

            transition: width 0.25s ease;
        }

        /* =====================================================
           Bottom Navigation
        ===================================================== */

        .bottom-nav {
            position: fixed;

            z-index: 2000;

            left: 50%;

            bottom:
                calc(12px + env(safe-area-inset-bottom));

            transform: translateX(-50%);

            width: min(
                500px,
                calc(100% - 32px)
            );

            height: 62px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            padding: 4px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #e4e5ea;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-btn {
            width: 100%;
            height: 100%;

            border: 0;

            border-radius: 15px;

            background: transparent;

            color: #888;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            font-size: 11px;

            cursor: pointer;
        }

        .nav-btn.active {
            background: #202124;
            color: #fff;
        }

        .nav-icon {
            font-size: 19px;
            line-height: 1;
        }

        /* =====================================================
           Dark Mode
        ===================================================== */

        body.dark {
            background: #111214;
            color: #f3f3f3;
        }

        body.dark .header {
            background: rgba(24, 25, 28, 0.96);

            border-color: #2a2b30;
        }

        body.dark .theme-toggle {
            background: #2b2c31;
        }

        body.dark .deck-select,
        body.dark .card-face,
        body.dark .nav-control,
        body.dark .deck-card,
        body.dark .stat-card,
        body.dark .bottom-nav {
            background: #1b1c20;

            border-color: #2d2e34;

            color: #f3f3f3;
        }

        body.dark .phonetic,
        body.dark .progress-info,
        body.dark .deck-description,
        body.dark .deck-count,
        body.dark .stat-label,
        body.dark .mastery-label {
            color: #999;
        }

        body.dark .example {
            color: #bbb;
        }

        body.dark .example-cn {
            color: #888;
        }

        body.dark .progress {
            background: #303138;
        }

        body.dark .flip-btn {
            background: #f3f3f3;
            color: #111;
        }

        body.dark .bottom-nav {
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.4);
        }

        body.dark .nav-btn.active {
            background: #f3f3f3;
            color: #111;
        }

        body.dark .unknown-btn {
            background: #321c1e;
            border-color: #52282c;
        }

        body.dark .known-btn {
            background: #193020;
            border-color: #294d31;
        }

        body.dark .mastery-bar {
            background: #303138;
        }

        body.dark .mastery-progress {
            background: #f3f3f3;
        }

        body.dark .error-box {
            background: #1b1c20;
            border-color: #5a2929;
        }

        /* =====================================================
           Mobile
        ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 54px;
            }

            .header-inner {
                width:
                    calc(100% - 24px);
            }

            .logo {
                font-size: 17px;
            }

            .main {
                width:
                    calc(100% - 20px);

                padding-top: 10px;

                /*
                 * Bottom nav:
                 * approximately 54px high
                 * + bottom gap
                 * + safe area
                 */
                padding-bottom:
                    calc(
                        82px +
                        env(safe-area-inset-bottom)
                    );
            }

            .learning-top {
                gap: 7px;
                margin-bottom: 6px;
            }

            .deck-select {
                height: 40px;

                padding: 0 10px;

                border-radius: 10px;

                font-size: 13px;
            }

            .progress-info {
                font-size: 11px;
            }

            .progress {
                height: 3px;

                margin-bottom: 9px;
            }

            /*
             * This is intentionally NOT too small.
             */
            .card-container {
                height: 360px;
                min-height: 360px;
            }

            .card-face {
                padding: 24px 18px;

                border-radius: 18px;
            }

            .word-label {
                margin-bottom: 8px;

                font-size: 10px;

                letter-spacing: 1.2px;
            }

            .word {
                font-size:
                    clamp(
                        40px,
                        11vw,
                        54px
                    );

                letter-spacing: -1px;

                line-height: 1.06;
            }

            .phonetic {
                margin-top: 10px;

                font-size: 15px;
            }

            .speak-main {
                width: 44px;
                height: 44px;

                margin-top: 14px;

                font-size: 18px;
            }

            .card-hint {
                bottom: 14px;

                font-size: 10px;
            }

            .meaning {
                max-width: 92%;

                font-size: 25px;

                line-height: 1.3;
            }

            .example {
                max-width: 95%;

                margin-top: 14px;

                font-size: 14px;

                line-height: 1.55;
            }

            .example-cn {
                margin-top: 4px;
            }

            .navigation {
                gap: 7px;

                margin-top: 8px;
            }

            .nav-control {
                height: 42px;

                border-radius: 10px;

                font-size: 13px;
            }

            .knowledge {
                gap: 7px;

                margin-top: 7px;
            }

            .knowledge-btn {
                height: 42px;

                border-radius: 10px;

                font-size: 13px;
            }

            .bottom-nav {
                bottom:
                    calc(
                        8px +
                        env(safe-area-inset-bottom)
                    );

                width:
                    calc(100% - 20px);

                height: 54px;

                border-radius: 16px;
            }

            .nav-btn {
                font-size: 10px;

                gap: 2px;
            }

            .nav-icon {
                font-size: 16px;
            }

            .page-title {
                margin-top: 2px;

                font-size: 21px;
            }

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 7px;
            }

            .stat-card {
                padding: 16px;

                border-radius: 13px;
            }

            .stat-label {
                font-size: 12px;
            }

            .stat-value {
                margin-top: 5px;

                font-size: 27px;
            }

            .mastery-wrap {
                margin-top: 10px;
            }

            .deck-grid {
                grid-template-columns: 1fr;

                gap: 9px;
            }

            .deck-card {
                padding: 16px;

                border-radius: 13px;
            }
        }

        /* =====================================================
           Narrow Phone
        ===================================================== */

        @media (max-width: 380px) {

            .header {
                height: 52px;
            }

            .logo {
                font-size: 16px;
            }

            .main {
                width:
                    calc(100% - 16px);

                padding-top: 8px;

                padding-bottom:
                    calc(
                        78px +
                        env(safe-area-inset-bottom)
                    );
            }

            .learning-top {
                gap: 5px;

                margin-bottom: 5px;
            }

            .deck-select {
                height: 38px;

                padding: 0 8px;

                border-radius: 9px;

                font-size: 12px;
            }

            .progress-info {
                font-size: 10px;
            }

            .progress {
                margin-bottom: 8px;
            }

            /*
             * Still reasonably large.
             */
            .card-container {
                height: 330px;
                min-height: 330px;
            }

            .card-face {
                padding: 20px 15px;

                border-radius: 17px;
            }

            .word-label {
                margin-bottom: 6px;

                font-size: 9px;
            }

            .word {
                font-size: 40px;

                letter-spacing: -.8px;
            }

            .phonetic {
                margin-top: 9px;

                font-size: 14px;
            }

            .speak-main {
                width: 42px;
                height: 42px;

                margin-top: 12px;

                font-size: 17px;
            }

            .card-hint {
                bottom: 11px;

                font-size: 9px;
            }

            .meaning {
                font-size: 22px;
            }

            .example {
                margin-top: 11px;

                font-size: 13px;

                line-height: 1.45;
            }

            .navigation {
                gap: 6px;

                margin-top: 7px;
            }

            .nav-control {
                height: 40px;

                border-radius: 9px;

                font-size: 12px;
            }

            .knowledge {
                gap: 6px;

                margin-top: 6px;
            }

            .knowledge-btn {
                height: 40px;

                border-radius: 9px;

                font-size: 12px;
            }

            .bottom-nav {
                bottom:
                    calc(
                        6px +
                        env(safe-area-inset-bottom)
                    );

                width:
                    calc(100% - 16px);

                height: 50px;

                border-radius: 15px;
            }

            .nav-btn {
                font-size: 9px;
            }

            .nav-icon {
                font-size: 15px;
            }
        }

        /* =====================================================
           Short Screen
        ===================================================== */

        @media (
            max-width: 600px
        ) and (
            max-height: 700px
        ) {

            .main {
                padding-top: 7px;

                padding-bottom:
                    calc(
                        76px +
                        env(safe-area-inset-bottom)
                    );
            }

            .learning-top {
                margin-bottom: 4px;
            }

            .deck-select {
                height: 36px;
            }

            .progress {
                margin-bottom: 7px;
            }

            /*
             * Only reduce when screen height is really short.
             */
            .card-container {
                height: 310px;
                min-height: 310px;
            }

            .card-face {
                padding: 18px 14px;
            }

            .word {
                font-size: 38px;
            }

            .phonetic {
                margin-top: 8px;

                font-size: 13px;
            }

            .speak-main {
                width: 40px;
                height: 40px;

                margin-top: 10px;
            }

            .card-hint {
                bottom: 9px;
            }

            .navigation {
                margin-top: 6px;
            }

            .nav-control {
                height: 38px;
            }

            .knowledge {
                margin-top: 5px;
            }

            .knowledge-btn {
                height: 38px;
            }

            .bottom-nav {
                height: 48px;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================================
         Header
    ====================================================== -->

    <header class="header">

        <div class="header-inner">

            <div class="logo">
                胖哥学英语
            </div>

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="切换主题"
            >
                ☀️
            </button>

        </div>

    </header>


    <!-- =====================================================
         Main
    ====================================================== -->

    <main class="main">

        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >
            正在加载词库...
        </div>


        <!-- Error -->

        <div
            id="errorBox"
            class="error-box"
        ></div>


        <!-- =================================================
             Learning Page
        ================================================== -->

        <section
            id="learningPage"
            class="page"
        >

            <div class="learning-top">

                <select
                    id="deckSelect"
                    class="deck-select"
                >
                    <option value="">
                        正在加载词库...
                    </option>
                </select>

                <div
                    id="progressInfo"
                    class="progress-info"
                >
                    0 / 0
                </div>

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>


            <!-- =================================================
                 Flash Card
            ================================================== -->

            <div class="card-container">

                <div
                    id="flashcard"
                    class="flashcard"
                    role="button"
                    tabindex="0"
                    aria-label="单词卡片，点击翻转"
                >

                    <!-- Front -->

                    <div
                        class="card-face card-front"
                    >

                        <div class="word-label">
                            WORD
                        </div>

                        <div
                            id="cardWord"
                            class="word"
                        >
                            —
                        </div>

                        <div
                            id="cardPhonetic"
                            class="phonetic"
                        >
                            —
                        </div>

                        <button
                            id="speakMain"
                            class="speak-main"
                            type="button"
                            aria-label="播放单词"
                        >
                            🔊
                        </button>

                        <div class="card-hint">

    <script>

        "use strict";


        /* =====================================================
           Configuration
        ===================================================== */

        const SITE_ROOT = "/MyFlashCards/";

        const DATA_ROOT =
            SITE_ROOT + "data/";

        const DECK_INDEX =
            DATA_ROOT + "index.json";

        const VERSION_URL =
            DATA_ROOT + "version.json";

        const VERSION_STORAGE_KEY =
            "myflashcards_site_version";

        const STATE_STORAGE_PREFIX =
            "myflashcards_state_";

        const THEME_STORAGE_KEY =
            "myflashcards_theme";

        const CURRENT_DECK_KEY =
            "myflashcards_current_deck";


        /* =====================================================
           Global State
        ===================================================== */

        let decks = [];

        let currentDeck = null;

        let currentWords = [];

        let currentIndex = 0;

        let isFlipped = false;

        let initialized = false;


        /* =====================================================
           DOM
        ===================================================== */

        const loadingEl =
            document.getElementById("loading");

        const errorBoxEl =
            document.getElementById("errorBox");

        const learningPageEl =
            document.getElementById("learningPage");

        const libraryPageEl =
            document.getElementById("libraryPage");

        const statsPageEl =
            document.getElementById("statsPage");

        const deckSelectEl =
            document.getElementById("deckSelect");

        const deckGridEl =
            document.getElementById("deckGrid");

        const flashcardEl =
            document.getElementById("flashcard");

        const cardWordEl =
            document.getElementById("cardWord");

        const cardPhoneticEl =
            document.getElementById("cardPhonetic");

        const cardMeaningEl =
            document.getElementById("cardMeaning");

        const cardExampleEl =
            document.getElementById("cardExample");

        const cardExampleCnEl =
            document.getElementById("cardExampleCn");

        const progressInfoEl =
            document.getElementById("progressInfo");

        const progressBarEl =
            document.getElementById("progressBar");


        /* =====================================================
           Utility
        ===================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function normalizeText(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value).trim();
        }


        function normalizeDeckId(deck, index) {

            if (!deck || typeof deck !== "object") {
                return String(index);
            }

            return normalizeText(
                deck.id ??
                deck.slug ??
                deck.key ??
                deck.name ??
                index
            );
        }


        function normalizeDeckName(deck, index) {

            if (!deck || typeof deck !== "object") {
                return `词库 ${index + 1}`;
            }

            return normalizeText(
                deck.name ??
                deck.title ??
                deck.display_name ??
                deck.id ??
                `词库 ${index + 1}`
            );
        }


        function normalizeDeckFile(deck) {

            if (!deck || typeof deck !== "object") {
                return "";
            }

            return normalizeText(
                deck.file ??
                deck.path ??
                deck.url ??
                deck.src ??
                ""
            );
        }


        function getDeckDescription(deck) {

            if (!deck || typeof deck !== "object") {
                return "";
            }

            return normalizeText(
                deck.description ??
                deck.desc ??
                ""
            );
        }


        function resolveDeckURL(file) {

            const value =
                normalizeText(file);

            if (!value) {
                return "";
            }

            /*
             * Absolute URL
             */
            if (
                value.startsWith("http://") ||
                value.startsWith("https://")
            ) {
                return value;
            }

            /*
             * Absolute site path
             */
            if (value.startsWith("/")) {
                return value;
            }

            /*
             * data/xxx.json
             */
            if (
                value.startsWith("data/")
            ) {
                return SITE_ROOT + value;
            }

            /*
             * xxx.json
             */
            return DATA_ROOT + value;
        }


        function showLoading(message) {

            loadingEl.textContent =
                message || "正在加载词库...";

            loadingEl.style.display =
                "flex";

            errorBoxEl.style.display =
                "none";

            learningPageEl.classList.remove(
                "active"
            );

            libraryPageEl.classList.remove(
                "active"
            );

            statsPageEl.classList.remove(
                "active"
            );
        }


        function hideLoading() {

            loadingEl.style.display =
                "none";
        }


        function showError(message) {

            hideLoading();

            errorBoxEl.style.display =
                "block";

            errorBoxEl.innerHTML = `
                <div class="error-title">
                    词库加载失败
                </div>
                <div>
                    ${escapeHTML(message)}
                </div>
            `;
        }


        function clearError() {

            errorBoxEl.style.display =
                "none";

            errorBoxEl.innerHTML =
                "";
        }


        function showContent() {

            hideLoading();

            clearError();

            learningPageEl.classList.add(
                "active"
            );
        }


        /* =====================================================
           JSON Loading
        ===================================================== */

        async function fetchJSON(url) {

            const response =
                await fetch(
                    url,
                    {
                        method: "GET",
                        cache: "no-store",
                        credentials: "same-origin",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                );
            }

            const text =
                await response.text();

            if (!text.trim()) {

                throw new Error(
                    "服务器返回了空内容"
                );
            }

            try {

                return JSON.parse(text);

            } catch (error) {

                throw new Error(
                    `JSON 格式错误：${error.message}`
                );
            }
        }


        /* =====================================================
           Version
           Version is OPTIONAL.
           Failure must NOT stop the application.
        ===================================================== */

        async function checkVersion() {

            try {

                const data =
                    await fetchJSON(
                        VERSION_URL
                    );

                let version = "";

                if (
                    typeof data ===
                    "string"
                ) {

                    version = data;

                } else if (
                    data &&
                    typeof data === "object"
                ) {

                    version =
                        normalizeText(
                            data.version ??
                            data.current_version ??
                            data.site_version
                        );
                }

                if (!version) {
                    return;
                }

                localStorage.setItem(
                    VERSION_STORAGE_KEY,
                    version
                );

            } catch (error) {

                /*
                 * version.json is optional.
                 * Do NOT block the application.
                 */

                console.warn(
                    "version.json 加载失败，继续加载词库:",
                    error
                );
            }
        }


        /* =====================================================
           Deck Index
        ===================================================== */

        function extractDeckList(data) {

            if (Array.isArray(data)) {
                return data;
            }

            if (
                data &&
                Array.isArray(data.decks)
            ) {
                return data.decks;
            }

            if (
                data &&
                Array.isArray(data.items)
            ) {
                return data.items;
            }

            if (
                data &&
                Array.isArray(data.data)
            ) {
                return data.data;
            }

            return null;
        }


        async function loadDecks() {

            console.log(
                "[MyFlashCards] Loading:",
                DECK_INDEX
            );

            let data;

            try {

                data =
                    await fetchJSON(
                        DECK_INDEX
                    );

            } catch (error) {

                throw new Error(
                    `无法加载词库索引。\n\n` +
                    `请求地址：${DECK_INDEX}\n` +
                    `错误：${error.message}\n\n` +
                    `请确认 data/index.json 存在，并且服务器可以正常访问。`
                );
            }

            const rawDecks =
                extractDeckList(data);

            if (!rawDecks) {

                throw new Error(
                    `data/index.json 格式不正确。\n\n` +
                    `支持的格式：\n` +
                    `1. [ {...}, {...} ]\n` +
                    `2. { "decks": [ {...}, {...} ] }`
                );
            }

            decks =
                rawDecks
                    .map(
                        (deck, index) => {

                            if (
                                !deck ||
                                typeof deck !== "object"
                            ) {
                                return null;
                            }

                            const normalized = {
                                ...deck,

                                id:
                                    normalizeDeckId(
                                        deck,
                                        index
                                    ),

                                name:
                                    normalizeDeckName(
                                        deck,
                                        index
                                    ),

                                file:
                                    normalizeDeckFile(
                                        deck
                                    ),

                                description:
                                    getDeckDescription(
                                        deck
                                    )
                            };

                            return normalized;
                        }
                    )
                    .filter(Boolean);

            if (decks.length === 0) {

                throw new Error(
                    "index.json 中没有有效的词库。"
                );
            }

            renderDeckSelect();

            renderLibrary();

            /*
             * Restore previous deck.
             */

            const savedDeck =
                localStorage.getItem(
                    CURRENT_DECK_KEY
                );

            let deckToLoad = null;

            if (savedDeck) {

                deckToLoad =
                    decks.find(
                        deck =>
                            String(deck.id) ===
                            String(savedDeck)
                    );
            }

            /*
             * If saved deck doesn't exist,
             * use the first deck.
             */

            if (!deckToLoad) {
                deckToLoad = decks[0];
            }

            if (!deckToLoad) {

                throw new Error(
                    "没有可以加载的词库。"
                );
            }

            deckSelectEl.value =
                deckToLoad.id;

            await loadDeck(
                deckToLoad.id
            );
        }


        /* =====================================================
           Render Deck Select
        ===================================================== */

        function renderDeckSelect() {

            deckSelectEl.innerHTML =
                "";

            if (decks.length === 0) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = "";

                option.textContent =
                    "没有可用词库";

                deckSelectEl.appendChild(
                    option
                );

                return;
            }

            decks.forEach(
                deck => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        deck.id;

                    option.textContent =
                        deck.name;

                    deckSelectEl.appendChild(
                        option
                    );
                }
            );
        }


        /* =====================================================
           Load One Deck
        ===================================================== */

        function extractWords(data) {

            if (Array.isArray(data)) {
                return data;
            }

            if (
                data &&
                Array.isArray(data.words)
            ) {
                return data.words;
            }

            if (
                data &&
                Array.isArray(data.items)
            ) {
                return data.items;
            }

            if (
                data &&
                Array.isArray(data.data)
            ) {
                return data.data;
            }

            return null;
        }


        function normalizeWord(word, index) {

            if (
                typeof word === "string"
            ) {

                return {
                    word: word,
                    phonetic: "",
                    meaning: "",
                    example: "",
                    example_cn: "",
                    level: ""
                };
            }

            if (
                !word ||
                typeof word !== "object"
            ) {
                return null;
            }

            return {
                ...word,

                word:
                    normalizeText(
                        word.word ??
                        word.term ??
                        word.text ??
                        word.name ??
                        ""
                    ),

                phonetic:
                    normalizeText(
                        word.phonetic ??
                        word.ipa ??
                        word.pronunciation ??
                        ""
                    ),

                meaning:
                    normalizeText(
                        word.meaning ??
                        word.definition ??
                        word.translation ??
                        word.cn ??
                        ""
                    ),

                example:
                    normalizeText(
                        word.example ??
                        word.sentence ??
                        ""
                    ),

                example_cn:
                    normalizeText(
                        word.example_cn ??
                        word.exampleCn ??
                        word.example_zh ??
                        word.translation_example ??
                        ""
                    ),

                level:
                    word.level ??
                    ""
            };
        }


        async function loadDeck(deckId) {

            const deck =
                decks.find(
                    item =>
                        String(item.id) ===
                        String(deckId)
                );

            if (!deck) {

                throw new Error(
                    `找不到词库：${deckId}`
                );
            }

            const file =
                normalizeDeckFile(deck);

            if (!file) {

                throw new Error(
                    `词库「${deck.name}」没有配置 file。\n\n` +
                    `请在 data/index.json 中为该词库配置：\n` +
                    `"file": "xxx.json"`
                );
            }

            const url =
                resolveDeckURL(file);

            console.log(
                "[MyFlashCards] Loading deck:",
                url
            );

            let data;

            try {

                data =
                    await fetchJSON(
                        url
                    );

            } catch (error) {

                throw new Error(
                    `无法加载词库「${deck.name}」。\n\n` +
                    `请求地址：${url}\n` +
                    `错误：${error.message}`
                );
            }

            const words =
                extractWords(data);

            if (!words) {

                throw new Error(
                    `词库「${deck.name}」JSON 格式不正确。\n\n` +
                    `支持：\n` +
                    `1. [ {...}, {...} ]\n` +
                    `2. { "words": [ {...}, {...} ] }`
                );
            }

            currentWords =
                words
                    .map(
                        normalizeWord
                    )
                    .filter(
                        word =>
                            word &&
                            word.word
                    );

            if (
                currentWords.length === 0
            ) {

                throw new Error(
                    `词库「${deck.name}」没有有效单词。`
                );
            }

            currentDeck =
                deck;

            localStorage.setItem(
                CURRENT_DECK_KEY,
                deck.id
            );

            /*
             * Restore learning position.
             */

            currentIndex = 0;

            const state =
                loadLearningState();

            if (
                state &&
                Number.isInteger(
                    state.currentIndex
                ) &&
                state.currentIndex >= 0 &&
                state.currentIndex <
                    currentWords.length
            ) {

                currentIndex =
                    state.currentIndex;
            }

            isFlipped = false;

            renderCurrentCard();

            updateStats();
        }


        /* =====================================================
           Learning State
        ===================================================== */

        function getStateKey() {

            if (!currentDeck) {
                return null;
            }

            return (
                STATE_STORAGE_PREFIX +
                String(currentDeck.id)
            );
        }


        function createEmptyState() {

            return {
                currentIndex: 0,
                statuses: {}
            };
        }


        function loadLearningState() {

            const key =
                getStateKey();

            if (!key) {
                return createEmptyState();
            }

            try {

                const raw =
                    localStorage.getItem(
                        key
                    );

                if (!raw) {
                    return createEmptyState();
                }

                const state =
                    JSON.parse(raw);

                if (
                    !state ||
                    typeof state !== "object"
                ) {
                    return createEmptyState();
                }

                if (
                    !state.statuses ||
                    typeof state.statuses !==
                        "object"
                ) {
                    state.statuses = {};
                }

                if (
                    !Number.isInteger(
                        state.currentIndex
                    )
                ) {
                    state.currentIndex = 0;
                }

                return state;

            } catch (error) {

                console.warn(
                    "读取学习状态失败:",
                    error
                );

                return createEmptyState();
            }
        }


        function saveLearningState() {

            const key =
                getStateKey();

            if (!key) {
                return;
            }

            const state =
                loadLearningState();

            state.currentIndex =
                currentIndex;

            try {

                localStorage.setItem(
                    key,
                    JSON.stringify(state)
                );

            } catch (error) {

                console.warn(
                    "保存学习状态失败:",
                    error
                );
            }
        }


        /* =====================================================
           Word Key / Status
        ===================================================== */

        function getWordKey(
            word,
            index
        ) {

            if (
                word &&
                word.id !== undefined &&
                word.id !== null
            ) {

                return String(word.id);
            }

            if (
                word &&
                word.word
            ) {

                return String(
                    word.word
                ).toLowerCase();
            }

            return String(index);
        }


        function getWordStatus(index) {

            const state =
                loadLearningState();

            const word =
                currentWords[index];

            const key =
                getWordKey(
                    word,
                    index
                );

            return (
                state.statuses[key] ||
                null
            );
        }


        function setWordStatus(
            index,
            status
        ) {

            if (
                index < 0 ||
                index >= currentWords.length
            ) {
                return;
            }

            const state =
                loadLearningState();

            const word =
                currentWords[index];

            const key =
                getWordKey(
                    word,
                    index
                );

            state.statuses[key] =
                status;

            state.currentIndex =
                currentIndex;

            const storageKey =
                getStateKey();

            if (!storageKey) {
                return;
            }

            try {

                localStorage.setItem(
                    storageKey,
                    JSON.stringify(state)
                );

            } catch (error) {

                console.warn(
                    "保存单词状态失败:",
                    error
                );
            }

            updateStats();
        }


        /* =====================================================
           Card Render
        ===================================================== */

        function renderCurrentCard() {

            if (
                !currentWords ||
                currentWords.length === 0
            ) {

                cardWordEl.textContent =
                    "暂无单词";

                cardPhoneticEl.textContent =
                    "";

                cardMeaningEl.textContent =
                    "";

                cardExampleEl.textContent =
                    "";

                cardExampleCnEl.textContent =
                    "";

                progressInfoEl.textContent =
                    "0 / 0";

                progressBarEl.style.width =
                    "0%";

                return;
            }

            /*
             * Safety check.
             */

            if (
                currentIndex < 0 ||
                currentIndex >= currentWords.length
            ) {

                currentIndex = 0;
            }

            const word =
                currentWords[currentIndex];

            cardWordEl.textContent =
                word.word || "—";

            cardPhoneticEl.textContent =
                word.phonetic || "";

            cardMeaningEl.textContent =
                word.meaning || "暂无释义";

            cardExampleEl.textContent =
                word.example || "";

            cardExampleCnEl.textContent =
                word.example_cn || "";

            /*
             * Always return to front
             * when changing cards.
             */

            isFlipped = false;

            flashcardEl.classList.remove(
                "flipped"
            );

            const total =
                currentWords.length;

            const position =
                currentIndex + 1;

            progressInfoEl.textContent =
                `${position} / ${total}`;

            const percent =
                Math.min(
                    100,
                    Math.max(
                        0,
                        (position / total) *
                        100
                    )
                );

            progressBarEl.style.width =
                `${percent}%`;

            saveLearningState();
        }


        /* =====================================================
           Card Actions
        ===================================================== */

        function flipCard() {

            if (
                !currentWords.length
            ) {
                return;
            }

            isFlipped =
                !isFlipped;

            flashcardEl.classList.toggle(
                "flipped",
                isFlipped
            );
        }


        function previousCard() {

            if (
                !currentWords.length
            ) {
                return;
            }

            currentIndex--;

            if (
                currentIndex < 0
            ) {

                currentIndex =
                    currentWords.length - 1;
            }

            renderCurrentCard();
        }


        function nextCard() {

            if (
                !currentWords.length
            ) {
                return;
            }

            currentIndex++;

            if (
                currentIndex >=
                currentWords.length
            ) {

                currentIndex = 0;
            }

            renderCurrentCard();
        }


        function randomCard() {

            if (
                currentWords.length <= 1
            ) {
                return;
            }

            let nextIndex;

            do {

                nextIndex =
                    Math.floor(
                        Math.random() *
                        currentWords.length
                    );

            } while (
                nextIndex ===
                currentIndex
            );

            currentIndex =
                nextIndex;

            renderCurrentCard();
        }


        /* =====================================================
           Speech
        ===================================================== */

        function speakWord() {

            if (
                !currentWords.length
            ) {
                return;
            }

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }

            const word =
                currentWords[currentIndex];

            if (
                !word ||
                !word.word
            ) {
                return;
            }

            try {

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(
                        word.word
                    );

                utterance.lang =
                    "en-GB";

                utterance.rate =
                    0.85;

                utterance.pitch =
                    1;

                window.speechSynthesis.speak(
                    utterance
                );

            } catch (error) {

                console.warn(
                    "语音播放失败:",
                    error
                );
            }
        }


        /* =====================================================
           Knowledge
        ===================================================== */

        function markKnown() {

            if (
                !currentWords.length
            ) {
                return;
            }

            setWordStatus(
                currentIndex,
                "known"
            );

            nextCard();
        }


        function markUnknown() {

            if (
                !currentWords.length
            ) {
                return;
            }

            setWordStatus(
                currentIndex,
                "unknown"
            );

            nextCard();
        }


        /* =====================================================
           Statistics
        ===================================================== */

        function calculateStats() {

            const total =
                currentWords.length;

            let known = 0;

            let unknown = 0;

            const state =
                loadLearningState();

            const statuses =
                state.statuses || {};

            /*
             * Only count words that actually
             * belong to the current deck.
             *
             * This prevents stale localStorage
             * entries from inflating statistics.
             */

            currentWords.forEach(
                (word, index) => {

                    const key =
                        getWordKey(
                            word,
                            index
                        );

                    const status =
                        statuses[key];

                    if (
                        status === "known"
                    ) {

                        known++;

                    } else if (
                        status === "unknown"
                    ) {

                        unknown++;
                    }
                }
            );

            const mastery =
                total > 0
                    ? Math.round(
                        (known / total) *
                        100
                    )
                    : 0;

            return {
                total,
                known,
                unknown,
                mastery
            };
        }


        function updateStats() {

            const stats =
                calculateStats();

            document.getElementById(
                "totalWords"
            ).textContent =
                stats.total;

            document.getElementById(
                "knownWords"
            ).textContent =
                stats.known;

            document.getElementById(
                "unknownWords"
            ).textContent =
                stats.unknown;

            document.getElementById(
                "masteryRate"
            ).textContent =
                `${stats.mastery}%`;

            document.getElementById(
                "masteryText"
            ).textContent =
                `${stats.mastery}%`;

            document.getElementById(
                "masteryProgress"
            ).style.width =
                `${stats.mastery}%`;
        }


        /* =====================================================
           Library
        ===================================================== */

        function renderLibrary() {

            deckGridEl.innerHTML =
                "";

            if (
                !decks ||
                decks.length === 0
            ) {

                deckGridEl.innerHTML = `
                    <div class="deck-card">
                        暂无词库
                    </div>
                `;

                return;
            }

            decks.forEach(
                deck => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "deck-card";

                    const description =
                        getDeckDescription(
                            deck
                        );

                    let countText =
                        "";

                    const count =
                        deck.count ??
                        deck.word_count ??
                        deck.words_count ??
                        "";

                    if (
                        count !== "" &&
                        count !== null &&
                        count !== undefined
                    ) {

                        countText =
                            `${count} 个单词`;
                    }

                    card.innerHTML = `

                        <div class="deck-name">
                            ${escapeHTML(deck.name)}
                        </div>

                        ${
                            description
                                ? `
                                    <div class="deck-description">
                                        ${escapeHTML(description)}
                                    </div>
                                  `
                                : ""
                        }

                        ${
                            countText
                                ? `
                                    <div class="deck-count">
                                        ${escapeHTML(countText)}
                                    </div>
                                  `
                                : ""
                        }

                    `;

                    card.addEventListener(
                        "click",
                        async () => {

                            try {

                                showLoading(
                                    `正在加载「${deck.name}」...`
                                );

                                await loadDeck(
                                    deck.id
                                );

                                showPage(
                                    "learning"
                                );

                            } catch (error) {

                                console.error(
                                    error
                                );

                                showError(
                                    error.message
                                );
                            }
                        }
                    );

                    deckGridEl.appendChild(
                        card
                    );
                }
            );
        }


        /* =====================================================
           Page Switching
        ===================================================== */

        function setActiveNav(
            page
        ) {

            document
                .getElementById(
                    "learningNav"
                )
                .classList.toggle(
                    "active",
                    page === "learning"
                );

            document
                .getElementById(
                    "libraryNav"
                )
                .classList.toggle(
                    "active",
                    page === "library"
                );

            document
                .getElementById(
                    "statsNav"
                )
                .classList.toggle(
                    "active",
                    page === "stats"
                );
        }


        function showPage(page) {

            learningPageEl.classList.remove(
                "active"
            );

            libraryPageEl.classList.remove(
                "active"
            );

            statsPageEl.classList.remove(
                "active"
            );

            if (
                page === "learning"
            ) {

                learningPageEl.classList.add(
                    "active"
                );

                setActiveNav(
                    "learning"
                );

            } else if (
                page === "library"
            ) {

                libraryPageEl.classList.add(
                    "active"
                );

                setActiveNav(
                    "library"
                );

                renderLibrary();

            } else if (
                page === "stats"
            ) {

                statsPageEl.classList.add(
                    "active"
                );

                setActiveNav(
                    "stats"
                );

                updateStats();

            } else {

                learningPageEl.classList.add(
                    "active"
                );

                setActiveNav(
                    "learning"
                );
            }

            /*
             * Do not use smooth scrolling here.
             * It can feel strange on mobile when switching
             * between fixed navigation pages.
             */

            window.scrollTo(
                0,
                0
            );
        }


        /* =====================================================
           Theme
        ===================================================== */

        function loadTheme() {

            let theme = "light";

            try {

                theme =
                    localStorage.getItem(
                        THEME_STORAGE_KEY
                    ) || "light";

            } catch (error) {

                console.warn(
                    "读取主题失败:",
                    error
                );
            }

            applyTheme(
                theme === "dark"
                    ? "dark"
                    : "light"
            );
        }


        function applyTheme(theme) {

            const isDark =
                theme === "dark";

            document.body.classList.toggle(
                "dark",
                isDark
            );

            const toggle =
                document.getElementById(
                    "themeToggle"
                );

            toggle.textContent =
                isDark
                    ? "🌙"
                    : "☀️";

            toggle.setAttribute(
                "aria-label",
                isDark
                    ? "切换到浅色模式"
                    : "切换到深色模式"
            );

            const themeColor =
                isDark
                    ? "#111214"
                    : "#ffffff";

            const meta =
                document.querySelector(
                    'meta[name="theme-color"]'
                );

            if (meta) {
                meta.setAttribute(
                    "content",
                    themeColor
                );
            }
        }


        function toggleTheme() {

            const isDark =
                document.body.classList.contains(
                    "dark"
                );

            const newTheme =
                isDark
                    ? "light"
                    : "dark";

            applyTheme(
                newTheme
            );

            try {

                localStorage.setItem(
                    THEME_STORAGE_KEY,
                    newTheme
                );

            } catch (error) {

                console.warn(
                    "保存主题失败:",
                    error
                );
            }
        }


        /* =====================================================
           Event Handlers
        ===================================================== */

        deckSelectEl.addEventListener(
            "change",
            async function () {

                const deckId =
                    this.value;

                if (!deckId) {
                    return;
                }

                try {

                    showLoading(
                        "正在切换词库..."
                    );

                    await loadDeck(
                        deckId
                    );

                    showContent();

                } catch (error) {

                    console.error(
                        error
                    );

                    showError(
                        error.message
                    );
                }
            }
        );


        document
            .getElementById(
                "themeToggle"
            )
            .addEventListener(
                "click",
                toggleTheme
            );


        document
            .getElementById(
                "previousBtn"
            )
            .addEventListener(
                "click",
                previousCard
            );


        document
            .getElementById(
                "flipBtn"
            )
            .addEventListener(
                "click",
                flipCard
            );


        document
            .getElementById(
                "nextBtn"
            )
            .addEventListener(
                "click",
                nextCard
            );


        document
            .getElementById(
                "unknownBtn"
            )
            .addEventListener(
                "click",
                markUnknown
            );


        document
            .getElementById(
                "knownBtn"
            )
            .addEventListener(
                "click",
                markKnown
            );


        document
            .getElementById(
                "speakMain"
            )
            .addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    speakWord();
                }
            );


        document
            .getElementById(
                "learningNav"
            )
            .addEventListener(
                "click",
                function () {

                    showPage(
                        "learning"
                    );
                }
            );


        document
            .getElementById(
                "libraryNav"
            )
            .addEventListener(
                "click",
                function () {

                    showPage(
                        "library"
                    );
                }
            );


        document
            .getElementById(
                "statsNav"
            )
            .addEventListener(
                "click",
                function () {

                    showPage(
                        "stats"
                    );
                }
            );


        /* =====================================================
           Card Keyboard / Touch
        ===================================================== */

        flashcardEl.addEventListener(
            "click",
            function () {

                flipCard();
            }
        );


        flashcardEl.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    flipCard();
                }
            }
        );


        /* =====================================================
           Keyboard Shortcuts
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                /*
                 * Don't intercept keyboard input
                 * from select or form controls.
                 */

                if (
                    event.target &&
                    (
                        event.target.tagName ===
                        "SELECT" ||
                        event.target.tagName ===
                        "INPUT" ||
                        event.target.tagName ===
                        "TEXTAREA"
                    )
                ) {
                    return;
                }

                switch (event.key) {

                    case "ArrowLeft":

                        event.preventDefault();

                        previousCard();

                        break;


                    case "ArrowRight":

                        event.preventDefault();

                        nextCard();

                        break;


                    case " ":

                        event.preventDefault();

                        flipCard();

                        break;


                    case "r":
                    case "R":

                        speakWord();

                        break;


                    case "k":
                    case "K":

                        markKnown();

                        break;


                    case "u":
                    case "U":

                        markUnknown();

                        break;
                }
            }
        );


        /* =====================================================
           Initialisation
        ===================================================== */

        async function init() {

            if (initialized) {
                return;
            }

            initialized = true;

            loadTheme();

            showLoading(
                "正在加载词库..."
            );

            /*
             * Version check is deliberately executed
             * in parallel and independently.
             *
             * Even if version.json is missing,
             * the main vocabulary must still load.
             */

            const versionPromise =
                checkVersion();

            try {

                await loadDecks();

                await versionPromise;

                showContent();

                updateStats();

                console.log(
                    "[MyFlashCards] Ready.",
                    {
                        decks:
                            decks.length,
                        currentDeck:
                            currentDeck
                                ? currentDeck.id
                                : null,
                        words:
                            currentWords.length
                    }
                );

            } catch (error) {

                console.error(
                    "[MyFlashCards] Initialisation failed:",
                    error
                );

                showError(
                    error.message ||
                    "词库加载失败，请检查网络或 JSON 文件。"
                );
            }
        }


        /* =====================================================
           Start
        ===================================================== */

        init();

    </script>

</body>

/* =========================================================
   Configuration
========================================================= */

const SITE_ROOT = "/MyFlashCards/";
const DATA_ROOT = SITE_ROOT + "data/";

const DECK_INDEX = DATA_ROOT + "index.json";
const VERSION_URL = DATA_ROOT + "version.json";

const VERSION_STORAGE_KEY =
    "myflashcards_site_version";

const DARK_MODE_KEY =
    "myflashcards_dark_mode";

/* =========================================================
   State
========================================================= */

let decks = [];

let currentDeck = null;
let currentWords = [];

let currentIndex = 0;

let flipped = false;

/*
 * learningState:
 *
 * {
 *   "word": "known" | "unknown"
 * }
 */
let learningState = {};

/* =========================================================
   JSON Loader
========================================================= */

async function getJSON(url) {

    const finalUrl =
        url +
        "?_=" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            10000
        );

    try {

        const response =
            await fetch(
                finalUrl,
                {
                    method: "GET",

                    cache: "no-store",

                    signal: controller.signal,

                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const text =
            await response.text();

        if (!text.trim()) {

            throw new Error(
                "服务器返回空内容"
            );

        }

        try {

            return JSON.parse(text);

        } catch (e) {

            throw new Error(
                "JSON 格式错误：" +
                e.message
            );

        }

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "请求超时：10 秒内没有收到响应"
            );

        }

        throw error;

    } finally {

        clearTimeout(timeout);

    }

}

/* =========================================================
   Version Check
========================================================= */

async function checkVersion() {

    try {

        const data =
            await getJSON(
                VERSION_URL
            );

        if (
            !data ||
            !data.version
        ) {

            console.warn(
                "version.json 缺少 version"
            );

            return;

        }

        const serverVersion =
            String(data.version);

        const localVersion =
            localStorage.getItem(
                VERSION_STORAGE_KEY
            );

        /*
         * 第一次访问
         */
        if (!localVersion) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            return;

        }

        /*
         * 检测到新版
         */
        if (
            localVersion !==
            serverVersion
        ) {

            console.log(
                "检测到网站新版本:",
                localVersion,
                "→",
                serverVersion
            );

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            showUpdateToast();

            /*
             * 给用户一个很短的提示时间
             */
            setTimeout(
                () => {

                    /*
                     * 加随机参数，
                     * 避免手机继续使用旧 HTML
                     */
                    const newUrl =
                        window.location.pathname +
                        "?v=" +
                        encodeURIComponent(
                            serverVersion
                        );

                    window.location.replace(
                        newUrl
                    );

                },
                700
            );

        }

    } catch (error) {

        /*
         * 版本检测失败不阻塞网站。
         *
         * 例如：
         * - GitHub Pages 临时网络问题
         * - 手机离线
         */
        console.warn(
            "版本检测失败:",
            error
        );

    }

}

/* =========================================================
   Update Toast
========================================================= */

function showUpdateToast() {

    const toast =
        document.getElementById(
            "updateToast"
        );

    toast.classList.add("show");

}

/* =========================================================
   Load Deck Index
========================================================= */

async function loadDecks() {

    decks =
        await getJSON(
            DECK_INDEX
        );

    if (
        !Array.isArray(decks) ||
        decks.length === 0
    ) {

        throw new Error(
            "index.json 中没有找到任何词库"
        );

    }

}

/* =========================================================
   Load Deck
========================================================= */

async function loadDeck(deck) {

    try {

        showLoading(true);

        const words =
            await getJSON(
                DATA_ROOT +
                deck.file
            );

        if (
            !Array.isArray(words) ||
            words.length === 0
        ) {

            throw new Error(
                "词库为空"
            );

        }

        currentDeck = deck;
        currentWords = words;

        currentIndex = 0;

        flipped = false;

        learningState =
            loadLearningState(
                deck.id
            );

        updateDeckName();

        renderDeck();

        renderLibrary();

        updateStats();

    } catch (error) {

        throw new Error(
            `加载词库「${deck.name}」失败：${error.message}`
        );

    } finally {

        showLoading(false);

    }

}

/* =========================================================
   Learning State
========================================================= */

function getLearningStorageKey(
    deckId
) {

    return (
        "myflashcards_learning_" +
        deckId
    );

}

function loadLearningState(
    deckId
) {

    try {

        const value =
            localStorage.getItem(
                getLearningStorageKey(
                    deckId
                )
            );

        if (!value) {

            return {};

        }

        return JSON.parse(
            value
        ) || {};

    } catch (e) {

        return {};

    }

}

function saveLearningState() {

    if (!currentDeck) {
        return;
    }

    localStorage.setItem(
        getLearningStorageKey(
            currentDeck.id
        ),
        JSON.stringify(
            learningState
        )
    );

}

/* =========================================================
   Render
========================================================= */

function renderDeck() {

    if (
        !currentWords.length
    ) {
        return;
    }

    const word =
        currentWords[
            currentIndex
        ];

    document.getElementById(
        "word"
    ).textContent =
        word.word || "—";

    document.getElementById(
        "backWord"
    ).textContent =
        word.word || "—";

    document.getElementById(
        "phonetic"
    ).textContent =
        word.phonetic || "";

    document.getElementById(
        "meaning"
    ).textContent =
        word.meaning || "";

    document.getElementById(
        "example"
    ).textContent =
        word.example
            ? `“${word.example}”`
            : "";

    document.getElementById(
        "exampleCn"
    ).textContent =
        word.example_cn || "";

    flipped = false;

    document.getElementById(
        "flashcard"
    ).classList.remove(
        "flipped"
    );

    updateProgress();

    savePosition();

}

/* =========================================================
   Deck Name
========================================================= */

function updateDeckName() {

    if (!currentDeck) {
        return;
    }

    document.getElementById(
        "deckName"
    ).textContent =
        currentDeck.name;

}

/* =========================================================
   Progress
========================================================= */

function updateProgress() {

    const total =
        currentWords.length;

    const position =
        currentIndex + 1;

    const known =
        getKnownCount();

    const mastery =
        total > 0
            ? Math.round(
                known / total * 100
            )
            : 0;

    document.getElementById(
        "progressText"
    ).textContent =
        `${position} / ${total}`;

    document.getElementById(
        "masteryText"
    ).textContent =
        `掌握率 ${mastery}%`;

    document.getElementById(
        "progressFill"
    ).style.width =
        `${position / total * 100}%`;

}

/* =========================================================
   Card
========================================================= */

function flipCard() {

    flipped = !flipped;

    document.getElementById(
        "flashcard"
    ).classList.toggle(
        "flipped",
        flipped
    );

}

function speakCurrent() {

    if (
        !currentWords.length
    ) {
        return;
    }

    const word =
        currentWords[
            currentIndex
        ].word;

    if (
        !word ||
        !("speechSynthesis" in window)
    ) {

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            word
        );

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    window.speechSynthesis.speak(
        utterance
    );

}

/* =========================================================
   Navigation
========================================================= */

function nextCard() {

    if (
        !currentWords.length
    ) {
        return;
    }

    currentIndex =
        (currentIndex + 1) %
        currentWords.length;

    renderDeck();

}

function previousCard() {

    if (
        !currentWords.length
    ) {
        return;
    }

    currentIndex =
        (
            currentIndex -
            1 +
            currentWords.length
        ) %
        currentWords.length;

    renderDeck();

}

function randomCard() {

    if (
        currentWords.length <= 1
    ) {
        return;
    }

    let newIndex;

    do {

        newIndex =
            Math.floor(
                Math.random() *
                currentWords.length
            );

    } while (
        newIndex ===
        currentIndex
    );

    currentIndex =
        newIndex;

    renderDeck();

}

/* =========================================================
   Mark Known / Unknown
========================================================= */

function markKnown() {

    if (
        !currentWords.length
    ) {
        return;
    }

    const word =
        currentWords[
            currentIndex
        ].word;

    learningState[word] =
        "known";

    saveLearningState();

    updateProgress();

    nextCard();

}

function markUnknown() {

    if (
        !currentWords.length
    ) {
        return;
    }

    const word =
        currentWords[
            currentIndex
        ].word;

    learningState[word] =
        "unknown";

    saveLearningState();

    updateProgress();

    nextCard();

}

function getKnownCount() {

    return Object.values(
        learningState
    ).filter(
        value =>
            value === "known"
    ).length;

}

/* =========================================================
   Position
========================================================= */

function getPositionKey(
    deckId
) {

    return (
        "myflashcards_position_" +
        deckId
    );

}

function savePosition() {

    if (!currentDeck) {
        return;
    }

    localStorage.setItem(
        getPositionKey(
            currentDeck.id
        ),
        String(currentIndex)
    );

}

function restorePosition() {

    if (!currentDeck) {
        return;
    }

    const value =
        localStorage.getItem(
            getPositionKey(
                currentDeck.id
            )
        );

    if (value === null) {
        return;
    }

    const index =
        parseInt(
            value,
            10
        );

    if (
        Number.isInteger(index) &&
        index >= 0 &&
        index < currentWords.length
    ) {

        currentIndex = index;

    }

}

/* =========================================================
   Library
========================================================= */

function renderLibrary() {

    const container =
        document.getElementById(
            "deckList"
        );

    container.innerHTML = "";

    decks.forEach(deck => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "deck-card";

        const learned =
            getDeckLearnedCount(
                deck.id
            );

        card.innerHTML = `
            <div class="deck-card-title">
                ${escapeHTML(deck.name)}
            </div>

            <div class="deck-card-info">
                已学习 ${learned} 个
            </div>
        `;

        card.addEventListener(
            "click",
            async () => {

                await loadDeck(deck);

                showPage("study");

            }
        );

        container.appendChild(
            card
        );

    });

}

function getDeckLearnedCount(
    deckId
) {

    try {

        const value =
            localStorage.getItem(
                getLearningStorageKey(
                    deckId
                )
            );

        if (!value) {
            return 0;
        }

        const data =
            JSON.parse(value);

        return Object.keys(
            data
        ).length;

    } catch (e) {

        return 0;

    }

}

/* =========================================================
   Statistics
========================================================= */

function updateStats() {

    const total =
        currentWords.length;

    const learned =
        Object.keys(
            learningState
        ).length;

    const known =
        getKnownCount();

    const mastery =
        total > 0
            ? Math.round(
                known / total * 100
            )
            : 0;

    document.getElementById(
        "statTotal"
    ).textContent =
        total;

    document.getElementById(
        "statLearned"
    ).textContent =
        learned;

    document.getElementById(
        "statKnown"
    ).textContent =
        known;

    document.getElementById(
        "statMastery"
    ).textContent =
        `${mastery}%`;

}

/* =========================================================
   Page Navigation
========================================================= */

function showPage(
    page
) {

    const pages = [
        "study",
        "library",
        "stats"
    ];

    pages.forEach(name => {

        const element =
            document.getElementById(
                name + "Page"
            );

        if (!element) {
            return;
        }

        element.classList.toggle(
            "active",
            name === page
        );

    });

    document
        .getElementById("navStudy")
        .classList.toggle(
            "active",
            page === "study"
        );

    document
        .getElementById("navLibrary")
        .classList.toggle(
            "active",
            page === "library"
        );

    document
        .getElementById("navStats")
        .classList.toggle(
            "active",
            page === "stats"
        );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

/* =========================================================
   Dark Mode
========================================================= */

function loadDarkMode() {

    const dark =
        localStorage.getItem(
            DARK_MODE_KEY
        ) === "true";

    document.body.classList.toggle(
        "dark",
        dark
    );

    updateDarkModeButton();

}

function toggleDarkMode() {

    const dark =
        !document.body.classList.contains(
            "dark"
        );

    document.body.classList.toggle(
        "dark",
        dark
    );

    localStorage.setItem(
        DARK_MODE_KEY,
        String(dark)
    );

    updateDarkModeButton();

}

function updateDarkModeButton() {

    const button =
        document.getElementById(
            "darkModeBtn"
        );

    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent = "☀️";
        button.title = "浅色模式";

    } else {

        button.textContent = "🌙";
        button.title = "深色模式";

    }

}

/* =========================================================
   Loading
========================================================= */

function showLoading(
    visible
) {

    document.getElementById(
        "loading"
    ).style.display =
        visible
            ? "flex"
            : "none";

}

/* =========================================================
   Error
========================================================= */

function showError(
    error
) {

    showLoading(false);

    document.getElementById(
        "errorMessage"
    ).textContent =
        error.message ||
        String(error);

    document.getElementById(
        "errorOverlay"
    ).style.display =
        "flex";

}

/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

/* =========================================================
   Keyboard
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * 如果用户正在输入，
         * 不触发快捷键。
         */
        if (
            event.target.tagName ===
            "INPUT" ||
            event.target.tagName ===
            "TEXTAREA" ||
            event.target.tagName ===
            "SELECT"
        ) {

            return;

        }

        switch (
            event.key
                .toLowerCase()
        ) {

            case " ":

                event.preventDefault();

                flipCard();

                break;

            case "arrowright":

                nextCard();

                break;

            case "arrowleft":

                previousCard();

                break;

            case "r":

                randomCard();

                break;

            case "s":

                speakCurrent();

                break;

            case "k":

                markKnown();

                break;

            case "x":

                markUnknown();

                break;

        }

    }
);

/* =========================================================
   Initial Position
========================================================= */

async function initialize() {

    try {

        loadDarkMode();

        /*
         * 第一件事情：
         * 检查版本。
         */
        await checkVersion();

        /*
         * 加载词库列表。
         */
        await loadDecks();

        /*
         * 默认加载第一个词库。
         */
        await loadDeck(
            decks[0]
        );

        /*
         * 恢复学习位置。
         */
        restorePosition();

        renderDeck();

        renderLibrary();

        updateStats();

        showLoading(false);

    } catch (error) {

        console.error(
            "Initialization error:",
            error
        );

        showError(error);

    }

}

/* =========================================================
   Start
========================================================= */

initialize();

</script>

</body>
</html>

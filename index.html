<style>
/* =========================================================
   Peppa Pig English
   Responsive Mobile / Tablet / Desktop
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #f7f7f7,
            #e9e9e9
        );

    color: #222;

    overflow-x: hidden;

    /* 防止微信浏览器出现奇怪的文字缩放 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font-family: inherit;
    border: 0;
    outline: none;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.hidden {
    display: none !important;
}


/* =========================================================
   APP 主容器
   ========================================================= */

.app {
    width: min(
        calc(100% - 32px),
        720px
    );

    min-height: 100vh;
    min-height: 100dvh;

    margin: 0 auto;

    padding-top:
        max(
            16px,
            env(safe-area-inset-top)
        );

    padding-bottom:
        max(
            30px,
            env(safe-area-inset-bottom)
        );
}


/* =========================================================
   通用 Page
   ========================================================= */

.page {
    width: 100%;
    min-width: 0;
}


/* =========================================================
   首页
   ========================================================= */

.home-header {
    text-align: center;

    padding-top:
        clamp(
            8px,
            3vh,
            30px
        );

    padding-bottom: 8px;
}

.logo {
    font-size:
        clamp(
            40px,
            12vw,
            58px
        );

    line-height: 1;

    margin-bottom: 8px;
}

.home-title {
    margin: 0;

    font-size:
        clamp(
            24px,
            7vw,
            32px
        );

    line-height: 1.2;

    font-weight: 800;
}

.home-subtitle {
    margin-top: 8px;

    color: #777;

    font-size:
        clamp(
            13px,
            3.5vw,
            15px
        );
}


/* =========================================================
   Section
   ========================================================= */

.section-title {
    font-size:
        clamp(
            18px,
            5vw,
            21px
        );

    font-weight: 750;

    margin:
        clamp(20px, 5vh, 30px)
        0
        12px;

    text-align: left;
}


/* =========================================================
   首页菜单
   ========================================================= */

.menu-list {
    display: flex;
    flex-direction: column;

    gap:
        clamp(
            8px,
            2vw,
            13px
        );
}

.menu-item {
    width: 100%;

    background: white;

    border-radius:
        clamp(
            14px,
            4vw,
            19px
        );

    padding:
        clamp(
            13px,
            4vw,
            18px
        );

    display: flex;
    align-items: center;

    text-align: left;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.07);

    transition:
        transform .15s ease;
}

.menu-item:active {
    transform: scale(.98);
}

.menu-icon {
    width:
        clamp(
            42px,
            12vw,
            50px
        );

    height:
        clamp(
            42px,
            12vw,
            50px
        );

    border-radius:
        clamp(
            12px,
            3vw,
            15px
        );

    background: #f3f3f3;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size:
        clamp(
            21px,
            6vw,
            26px
        );

    flex-shrink: 0;

    margin-right:
        clamp(
            10px,
            3vw,
            14px
        );
}

.menu-content {
    flex: 1;
    min-width: 0;
}

.menu-title {
    font-size:
        clamp(
            15px,
            4.2vw,
            18px
        );

    font-weight: 700;

    margin-bottom: 4px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.menu-desc {
    color: #888;

    font-size:
        clamp(
            12px,
            3.3vw,
            14px
        );

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.menu-arrow {
    color: #aaa;

    font-size:
        clamp(
            20px,
            6vw,
            24px
        );

    margin-left: 8px;
}


/* =========================================================
   首页统计
   ========================================================= */

.stats {
    margin-top:
        clamp(
            14px,
            4vw,
            21px
        );

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap:
        clamp(
            6px,
            2vw,
            10px
        );
}

.stat {
    background: white;

    border-radius:
        clamp(
            12px,
            3vw,
            17px
        );

    padding:
        clamp(
            11px,
            3vw,
            16px
        )
        5px;

    text-align: center;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);
}

.stat-number {
    font-size:
        clamp(
            19px,
            6vw,
            25px
        );

    font-weight: 800;
}

.stat-label {
    color: #888;

    font-size:
        clamp(
            10px,
            3vw,
            13px
        );

    margin-top: 3px;
}


/* =========================================================
   顶部导航
   ========================================================= */

.topbar {
    width: 100%;

    min-height:
        clamp(
            38px,
            10vw,
            44px
        );

    display: flex;
    align-items: center;

    margin-bottom:
        clamp(
            10px,
            3vw,
            16px
        );
}

.back-btn {
    flex-shrink: 0;

    background: white;

    border-radius:
        clamp(
            9px,
            3vw,
            13px
        );

    padding:
        clamp(
            8px,
            2.5vw,
            11px
        )
        clamp(
            10px,
            3vw,
            15px
        );

    font-size:
        clamp(
            13px,
            3.5vw,
            15px
        );

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.06);
}

.topbar-title {
    flex: 1;

    min-width: 0;

    text-align: center;

    font-weight: 750;

    font-size:
        clamp(
            15px,
            4.5vw,
            18px
        );

    margin:
        0
        clamp(6px, 2vw, 10px);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.topbar-placeholder {
    width:
        clamp(
            60px,
            18vw,
            75px
        );

    flex-shrink: 0;
}


/* =========================================================
   Episode
   ========================================================= */

.episode-list {
    display: flex;
    flex-direction: column;

    gap:
        clamp(
            8px,
            2.5vw,
            13px
        );
}

.episode-card {
    width: 100%;

    background: white;

    border-radius:
        clamp(
            14px,
            4vw,
            19px
        );

    padding:
        clamp(
            14px,
            4vw,
            19px
        );

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.07);

    text-align: left;

    transition:
        transform .15s ease;
}

.episode-card:active {
    transform: scale(.985);
}

.episode-row {
    display: flex;
    align-items: center;
    min-width: 0;
}

.episode-icon {
    width:
        clamp(
            42px,
            13vw,
            52px
        );

    height:
        clamp(
            42px,
            13vw,
            52px
        );

    flex-shrink: 0;

    background: #f3f3f3;

    border-radius:
        clamp(
            12px,
            3.5vw,
            16px
        );

    display: flex;
    justify-content: center;
    align-items: center;

    font-size:
        clamp(
            21px,
            6vw,
            27px
        );

    margin-right:
        clamp(
            10px,
            3vw,
            15px
        );
}

.episode-info {
    flex: 1;
    min-width: 0;
}

.episode-title {
    font-size:
        clamp(
            15px,
            4.2vw,
            18px
        );

    font-weight: 750;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.episode-cn {
    color: #888;

    font-size:
        clamp(
            12px,
            3.3vw,
            14px
        );

    margin-top: 5px;
}

.episode-count {
    flex-shrink: 0;

    color: #999;

    font-size:
        clamp(
            11px,
            3vw,
            14px
        );

    margin-left: 8px;
}

.episode-progress {
    width: 100%;

    height:
        clamp(
            4px,
            1.3vw,
            6px
        );

    background: #eee;

    border-radius: 999px;

    margin-top:
        clamp(
            10px,
            3vw,
            15px
        );

    overflow: hidden;
}

.episode-progress-bar {
    height: 100%;

    background: #222;

    border-radius: 999px;

    transition:
        width .25s ease;
}


/* =========================================================
   学习页面
   ========================================================= */

.learning-header {
    text-align: center;

    width: 100%;
}

.learning-title {
    font-size:
        clamp(
            17px,
            5vw,
            20px
        );

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.learning-subtitle {
    color: #888;

    font-size:
        clamp(
            12px,
            3.3vw,
            14px
        );

    margin-top: 4px;
}

.progress {
    font-size:
        clamp(
            12px,
            3.5vw,
            15px
        );

    color: #666;

    margin:
        clamp(
            9px,
            2.5vw,
            14px
        )
        0
        9px;

    text-align: center;
}

.progress-bar {
    width: 100%;

    height:
        clamp(
            4px,
            1.2vw,
            6px
        );

    background: #ddd;

    border-radius: 999px;

    overflow: hidden;

    margin-bottom:
        clamp(
            10px,
            3vw,
            16px
        );
}

.progress-fill {
    height: 100%;

    background: #222;

    border-radius: 999px;

    transition:
        width .25s ease;
}


/* =========================================================
   ⭐ 核心：Flash Card 自适应高度
   ========================================================= */

.card-wrap {
    width: 100%;

    /*
       根据屏幕高度自动计算。

       手机：
       约 45~52vh

       大屏：
       最大 410px

       最小：
       300px
    */

    height:
        clamp(
            300px,
            50dvh,
            410px
        );

    min-height: 300px;
    max-height: 410px;

    perspective: 1200px;

    cursor: pointer;

    user-select: none;

    touch-action: pan-y;
}

.card {
    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform .45s ease;
}

.card.flipped {
    transform:
        rotateY(180deg);
}

.face {
    position: absolute;

    inset: 0;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    border-radius:
        clamp(
            18px,
            5vw,
            25px
        );

    background: white;

    box-shadow:
        0 14px 40px
        rgba(0,0,0,.12);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding:
        clamp(
            18px,
            6vw,
            34px
        );

    overflow: hidden;
}

.front {
    text-align: center;
}

.back {
    transform:
        rotateY(180deg);

    text-align: left;

    align-items: stretch;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}


/* =========================================================
   单词
   ========================================================= */

.word {
    font-size:
        clamp(
            38px,
            10vw,
            76px
        );

    line-height: 1.05;

    font-weight: 800;

    margin-bottom:
        clamp(
            8px,
            2.5vw,
            13px
        );

    max-width: 100%;

    overflow-wrap: break-word;

    word-break: break-word;
}

.ipa {
    color: #777;

    font-size:
        clamp(
            16px,
            5vw,
            21px
        );

    line-height: 1.2;

    margin-bottom:
        clamp(
            16px,
            5vw,
            26px
        );
}

.hint {
    color: #aaa;

    font-size:
        clamp(
            12px,
            3.5vw,
            15px
        );

    line-height: 1.5;

    text-align: center;
}


/* =========================================================
   卡片背面
   ========================================================= */

.tag {
    display: inline-block;

    align-self: center;

    padding:
        5px
        11px;

    border-radius: 999px;

    background: #eee;

    color: #666;

    font-size:
        clamp(
            11px,
            3vw,
            14px
        );

    margin-bottom:
        clamp(
            9px,
            3vw,
            15px
        );
}

.meaning {
    font-size:
        clamp(
            25px,
            8vw,
            35px
        );

    line-height: 1.2;

    font-weight: 750;

    margin-bottom:
        clamp(
            10px,
            3vw,
            20px
        );

    text-align: center;
}

.example {
    font-size:
        clamp(
            17px,
            5vw,
            23px
        );

    line-height: 1.45;

    margin:
        8px 0;

    overflow-wrap: break-word;
}

.translation {
    color: #666;

    font-size:
        clamp(
            14px,
            4vw,
            19px
        );

    line-height: 1.5;

    overflow-wrap: break-word;
}


/* =========================================================
   学习按钮
   ========================================================= */

.controls {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap:
        clamp(
            6px,
            2vw,
            11px
        );

    margin-top:
        clamp(
            10px,
            3vw,
            18px
        );
}

.controls button {
    min-width: 0;

    background: white;

    border-radius:
        clamp(
            11px,
            3.5vw,
            15px
        );

    padding:
        clamp(
            11px,
            3.5vw,
            15px
        )
        5px;

    font-size:
        clamp(
            13px,
            3.8vw,
            16px
        );

    white-space: nowrap;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.08);
}

.controls button:active {
    transform: scale(.97);
}


/* =========================================================
   学习工具
   ========================================================= */

.learning-tools {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap:
        clamp(
            6px,
            2vw,
            11px
        );

    margin-top:
        clamp(
            7px,
            2vw,
            11px
        );
}

.learning-tools button {
    min-width: 0;

    background: white;

    border-radius:
        clamp(
            11px,
            3.5vw,
            15px
        );

    padding:
        clamp(
            10px,
            3vw,
            13px
        )
        4px;

    font-size:
        clamp(
            12px,
            3.5vw,
            15px
        );

    white-space: nowrap;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);
}

.learning-tools button:active {
    transform: scale(.97);
}

.favorite.active {
    background: #f1f1f1;

    font-weight: 700;
}

.mastered.active {
    background: #222;

    color: white;

    font-weight: 700;
}


/* =========================================================
   提示
   ========================================================= */

.tip {
    margin-top:
        clamp(
            9px,
            2.5vw,
            16px
        );

    color: #999;

    font-size:
        clamp(
            10px,
            3vw,
            13px
        );

    text-align: center;

    line-height: 1.4;
}


/* =========================================================
   单词列表
   ========================================================= */

.word-list {
    display: flex;
    flex-direction: column;

    gap:
        clamp(
            7px,
            2vw,
            11px
        );
}

.word-item {
    width: 100%;

    background: white;

    border-radius:
        clamp(
            13px,
            4vw,
            17px
        );

    padding:
        clamp(
            12px,
            3.5vw,
            16px
        );

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);

    display: flex;
    align-items: center;

    min-width: 0;
}

.word-main {
    flex: 1;

    min-width: 0;
}

.word-title {
    font-size:
        clamp(
            18px,
            5vw,
            21px
        );

    font-weight: 750;

    overflow-wrap: break-word;
}

.word-meaning {
    color: #666;

    margin-top: 4px;

    font-size:
        clamp(
            13px,
            3.5vw,
            15px
        );
}

.word-episode {
    color: #999;

    font-size:
        clamp(
            10px,
            3vw,
            13px
        );

    margin-top: 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.word-actions {
    display: flex;

    gap:
        clamp(
            4px,
            1.5vw,
            7px
        );

    margin-left: 8px;

    flex-shrink: 0;
}

.small-btn {
    background: #f3f3f3;

    border-radius:
        clamp(
            8px,
            2.5vw,
            11px
        );

    padding:
        clamp(
            7px,
            2.5vw,
            10px
        );

    font-size:
        clamp(
            13px,
            4vw,
            16px
        );
}


/* =========================================================
   Empty
   ========================================================= */

.empty {
    background: white;

    border-radius:
        clamp(
            15px,
            4vw,
            19px
        );

    padding:
        clamp(
            35px,
            12vw,
            48px
        )
        20px;

    text-align: center;

    color: #888;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.06);
}

.empty-icon {
    font-size:
        clamp(
            38px,
            12vw,
            48px
        );

    margin-bottom: 12px;
}

.empty-title {
    font-size:
        clamp(
            16px,
            5vw,
            19px
        );

    font-weight: 700;

    color: #555;

    margin-bottom: 8px;
}

.empty-desc {
    font-size:
        clamp(
            12px,
            3.5vw,
            14px
        );

    line-height: 1.6;
}


/* =========================================================
   Toast
   ========================================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom:
        max(
            25px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.82);

    color: white;

    padding:
        9px
        16px;

    border-radius: 999px;

    font-size:
        clamp(
            12px,
            3.5vw,
            14px
        );

    z-index: 9999;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s ease;

    white-space: nowrap;

    max-width:
        calc(100vw - 40px);

    overflow: hidden;

    text-overflow: ellipsis;
}

.toast.show {
    opacity: 1;
}


/* =========================================================
   小屏手机
   ========================================================= */

@media (max-width: 380px) {

    .app {
        width: calc(100% - 24px);
    }

    .card-wrap {
        height:
            clamp(
                285px,
                47dvh,
                350px
            );

        min-height: 285px;
    }

    .face {
        padding: 18px;
    }

    .word {
        font-size: 39px;
    }

    .meaning {
        font-size: 24px;
    }

    .example {
        font-size: 16px;
    }

    .translation {
        font-size: 14px;
    }

    .controls button {
        font-size: 12px;
    }

    .learning-tools button {
        font-size: 11px;
    }

    .tip {
        font-size: 10px;
    }
}


/* =========================================================
   普通手机
   ========================================================= */

@media (min-width: 381px) and (max-width: 600px) {

    .card-wrap {
        height:
            clamp(
                320px,
                50dvh,
                395px
            );

        min-height: 320px;
    }
}


/* =========================================================
   手机横屏
   ========================================================= */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    .app {
        padding-top: 10px;
        padding-bottom: 15px;
    }

    .card-wrap {
        height: 58dvh;
        min-height: 230px;
        max-height: 330px;
    }

    .home-header {
        padding-top: 5px;
    }

    .logo {
        font-size: 34px;
    }

    .home-title {
        font-size: 22px;
    }

    .section-title {
        margin-top: 15px;
    }

}


/* =========================================================
   平板
   ========================================================= */

@media (min-width: 601px) {

    .app {
        width: min(
            calc(100% - 48px),
            720px
        );
    }

    .card-wrap {
        height: min(
            52dvh,
            410px
        );
    }

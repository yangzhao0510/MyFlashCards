<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>胖哥学英语</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                Arial,
                sans-serif;
            background: #f6f7f9;
            color: #111827;
        }

        body {
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 16px 28px;
        }

        /* =========================
           Header
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* =========================
           Progress
        ========================= */

        .progress-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 2px;
            color: #9ca3af;
            font-size: 13px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #111827;
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        /* =========================
           Main Card
        ========================= */

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 22px 18px 24px;
            min-height: 520px;

            display: flex;
            flex-direction: column;
            align-items: center;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .sentence-number {
            width: 100%;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 18px;
        }

        /* =========================
           Listening Prompt
        ========================= */

        .listen-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: center;
        }

        .listen-tip {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        /* =========================
           Play Area
        ========================= */

        .play-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .play-button {
            width: 76px;
            height: 76px;

            border: none;
            border-radius: 50%;

            background: #111827;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(17, 24, 39, 0.18);

            transition:
                transform 0.15s ease,
                background 0.2s ease;
        }

        .play-button:hover {
            background: #1f2937;
        }

        .play-button:active {
            transform: scale(0.94);
        }

        .play-hint {
            margin-top: 9px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* =========================
           Answer Button
        ========================= */

        .answer-btn {
            width: 100%;
            max-width: 360px;
            height: 46px;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            background: #f9fafb;
            color: #374151;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .answer-btn:hover {
            background: #f3f4f6;
        }

        .answer-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           Answer Content
        ========================= */

        .answer {
            width: 100%;
            max-width: 360px;

            margin-top: 14px;
            margin-bottom: 16px;

            padding: 16px;

            border-radius: 12px;
            background: #f9fafb;

            text-align: center;
        }

        .answer-en {
            font-size: 17px;
            line-height: 1.6;
            font-weight: 600;
            color: #111827;
        }

        .answer-zh {
            margin-top: 8px;
            font-size: 15px;
            line-height: 1.6;
            color: #6b7280;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           Judge Buttons
        ========================= */

        .actions {
            width: 100%;
            max-width: 360px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 10px;
        }

        .judge-row {
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .judge-btn {
            width: 100%;
            height: 48px;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            /* 默认两个按钮完全一样 */
            background: #f3f4f6;
            color: #374151;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                all 0.2s ease;
        }

        .judge-btn:hover {
            background: #e5e7eb;
        }

        .judge-btn:active {
            transform: scale(0.97);
        }

        /* =========================
           Selected States
        ========================= */

        /* 听懂了 -> 绿色 */
        .judge-btn.understood.selected {
            background: #22c55e;
            border-color: #22c55e;
            color: #ffffff;
        }

        /* 没听懂 -> 红色 */
        .judge-btn.not-understood.selected {
            background: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
        }

        /* =========================
           Next Button
        ========================= */

        .next-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .next-btn:hover {
            background: #1f2937;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           Bottom Stats
        ========================= */

        .stats {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-top: 16px;

            color: #9ca3af;
            font-size: 12px;
        }

        .stats span {
            white-space: nowrap;
        }

        /* =========================
           Review Button
        ========================= */

        .review-btn {
            display: block;

            margin: 14px auto 0;

            border: none;
            background: transparent;

            color: #6b7280;

            font-size: 13px;

            cursor: pointer;
        }

        .review-btn:hover {
            color: #111827;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 380px) {

            .app {
                padding-left: 12px;
                padding-right: 12px;
            }

            .card {
                padding-left: 14px;
                padding-right: 14px;
            }

            .title {
                font-size: 22px;
            }

            .play-button {
                width: 70px;
                height: 70px;
                font-size: 27px;
            }

            .answer-en {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         Header
    ========================= -->

    <header class="header">

        <h1 class="title">
            胖哥学英语
        </h1>

        <div class="subtitle">
            每天听一点，慢慢就听懂了
        </div>

    </header>


    <!-- =========================
         Progress
    ========================= -->

    <div class="progress-info">

        <span id="progressText">

        </span>

        <span id="todayText">

        </span>

    </div>

    <div class="progress-bar">

        <div
            id="progressFill"

    </div>


    <!-- =========================
         Main Card

    <main class="card">

        <div

            第 1 句
        </div>

        <div class="listen-title">

        </div>

        <button
            id="answerBtn"

        <!-- =========================
             Answer Content

        <div

                id="answerEn"

        <div class="actions">

                <button
                    id="understoodBtn"

                <button

                </button>

            <button
                id="nextBtn"

                下一句 →
            </button>

        </div>

    </main>


    <!-- =========================
         Stats

    <div class="stats">

        <span id="understoodText">
            已听懂 0

        <span>
            ·

    <button

    >
        随机复习
    </button>

</div>


<!-- =========================
     Sentence Data
========================= -->

<script src="./data/listening-sentences.js?v=20260905"></script>


<script>
"use strict";


/* =========================================================
   Basic Configuration
========================================================= */

const STORAGE_KEY = "pangge_english_listening_v3";

const sentences = window.listeningSentences || [];


/* =========================================================
   Validate Sentence Data
========================================================= */

if (!Array.isArray(sentences) || sentences.length === 0) {

    document.body.innerHTML = `
        <div style="
            padding:40px 20px;
            text-align:center;
            font-family:Arial,sans-serif;
        ">
            <h2>句子数据加载失败</h2>
            <p style="color:#777;">
                请检查 data/listening-sentences.js 是否存在。
            </p>
        </div>
    `;

    throw new Error(
        "listeningSentences 数据不存在或为空"
    );
}


/* =========================================================
   DOM
========================================================= */

const sentenceNumber =
    document.getElementById("sentenceNumber");

const progressText =
    document.getElementById("progressText");

const todayText =
    document.getElementById("todayText");

const progressFill =
    document.getElementById("progressFill");

const playBtn =
    document.getElementById("playBtn");

const playHint =
    document.getElementById("playHint");

const answerBtn =
    document.getElementById("answerBtn");

const answer =
    document.getElementById("answer");

const answerEn =
    document.getElementById("answerEn");

const answerZh =
    document.getElementById("answerZh");

const understoodBtn =
    document.getElementById("understoodBtn");

const notUnderstoodBtn =
    document.getElementById("notUnderstoodBtn");

const nextBtn =
    document.getElementById("nextBtn");

const reviewBtn =
    document.getElementById("reviewBtn");

const understoodText =
    document.getElementById("understoodText");

const notUnderstoodText =
    document.getElementById("notUnderstoodText");


/* =========================================================
   Local Date
========================================================= */

function getLocalDateKey() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(now.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================================================
   Progress
========================================================= */

let progress = {

    current: 0,

    understood: {},

    notUnderstood: {},

    today: {},

    todayDate: getLocalDateKey()

};


function loadProgress() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return;
        }

        const data =
            JSON.parse(saved);

        if (
            data &&
            typeof data === "object"
        ) {

            progress = {

                current:
                    Number.isInteger(data.current)
                        ? data.current
                        : 0,

                understood:
                    data.understood &&
                    typeof data.understood === "object"
                        ? data.understood
                        : {},

                notUnderstood:
                    data.notUnderstood &&
                    typeof data.notUnderstood === "object"
                        ? data.notUnderstood
                        : {},

                today:
                    data.today &&
                    typeof data.today === "object"
                        ? data.today
                        : {},

                todayDate:
                    data.todayDate ||
                    getLocalDateKey()

            };

        }

    } catch (error) {

        console.warn(
            "读取学习进度失败:",
            error
        );

    }


    /* =========================
       New Day
    ========================= */

    const today =
        getLocalDateKey();

    if (
        progress.todayDate !== today
    ) {

        progress.today = {};

        progress.todayDate = today;

        saveProgress();

    }


    /* =========================
       Fix Index
    ========================= */

    if (
        progress.current < 0 ||
        progress.current >= sentences.length
    ) {

        progress.current = 0;

    }

}


function saveProgress() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(progress)
        );

    } catch (error) {

        console.warn(
            "保存学习进度失败:",
            error
        );

    }

}


/* =========================================================
   Speech Synthesis
   稳定版
========================================================= */

let speechToken = 0;

let speechTimer = null;

let isSpeaking = false;


function stopSpeech() {

    speechToken++;

    isSpeaking = false;

    if (speechTimer) {

        clearTimeout(
            speechTimer
        );

        speechTimer = null;

    }

    try {

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis.cancel();

        }

    } catch (error) {

        console.warn(
            "停止语音失败:",
            error
        );

    }

    playBtn.textContent = "▶";

    playHint.textContent = "点击播放";

}


function speakCurrent() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "当前浏览器不支持语音播放。"
        );

        return;

    }


    /* =========================
       If Speaking -> Stop
    ========================= */

    if (isSpeaking) {

        stopSpeech();

        return;

    }


    stopSpeech();


    const token =
        speechToken;

    const current =
        sentences[progress.current];


    if (!current) {
        return;
    }


    speechTimer =
        setTimeout(() => {

            if (
                token !== speechToken
            ) {

                return;

            }


            const utterance =
                new SpeechSynthesisUtterance(
                    current.en
                );


            utterance.lang =
                "en-US";

            utterance.rate =
                0.82;

            utterance.pitch =
                1;

            utterance.volume =
                1;


            utterance.onstart =
                () => {

                    if (
                        token !== speechToken
                    ) {

                        return;

                    }

                    isSpeaking = true;

                    playBtn.textContent =
                        "■";

                    playHint.textContent =
                        "点击停止";

                };


            utterance.onend =
                () => {

                    if (
                        token !== speechToken
                    ) {

                        return;

                    }

                    isSpeaking = false;

                    playBtn.textContent =
                        "▶";

                    playHint.textContent =
                        "再次播放";

                };


            utterance.onerror =
                (event) => {

                    if (
                        token !== speechToken
                    ) {

                        return;

                    }

                    isSpeaking = false;

                    playBtn.textContent =
                        "▶";

                    playHint.textContent =
                        "点击播放";

                    console.warn(
                        "语音播放错误:",
                        event
                    );

                };


            try {

                window.speechSynthesis.speak(
                    utterance
                );

            } catch (error) {

                isSpeaking = false;

                playBtn.textContent =
                    "▶";

                playHint.textContent =
                    "点击播放";

                console.warn(
                    "语音播放失败:",
                    error
                );

            }

        }, 150);

}


/* =========================================================
   Reset Judge Buttons
========================================================= */

function resetJudgeButtons() {

    understoodBtn.classList.remove(
        "selected"
    );

    notUnderstoodBtn.classList.remove(
        "selected"
    );

}


/* =========================================================
   Load Current Sentence
========================================================= */

function loadCurrent(
    autoPlay = false
) {

    stopSpeech();

    resetJudgeButtons();


    const current =
        sentences[progress.current];


    if (!current) {
        return;
    }


    /* =========================
       Number
    ========================= */

    const number =
        progress.current + 1;


    sentenceNumber.textContent =
        `第 ${number} 句`;

    progressText.textContent =
        `第 ${number} 句`;


    /* =========================
       Hide Answer
    ========================= */

    answer.classList.add(
        "hidden"
    );


    answerBtn.textContent =
        "显示答案";


    /* =========================
       Fill Answer
    ========================= */

    answerEn.textContent =
        current.en || "";

    answerZh.textContent =
        current.zh || "";


    /* =========================
       Progress
    ========================= */

    const percent =
        (number / sentences.length) *
        100;

    progressFill.style.width =
        `${percent}%`;


    updateStats();


    /* =========================
       Auto Play
    ========================= */

    if (autoPlay) {

        setTimeout(() => {

            speakCurrent();

        }, 250);

    }

}


/* =========================================================
   Show Answer
========================================================= */

function showAnswer() {

    stopSpeech();

    answer.classList.remove(
        "hidden"
    );

    answerBtn.textContent =
        "隐藏答案";

}


/* =========================================================
   Toggle Answer
========================================================= */

function toggleAnswer() {

    if (
        answer.classList.contains(
            "hidden"
        )
    ) {

        showAnswer();

    } else {

        answer.classList.add(
            "hidden"
        );

        answerBtn.textContent =
            "显示答案";

    }

}


/* =========================================================
   Record Today
========================================================= */

function recordToday() {

    const id =
        sentences[progress.current].id;

    progress.today[id] = true;

}


/* =========================================================
   Mark Understood
========================================================= */

function markUnderstood() {

    const id =
        sentences[progress.current].id;


    /* 保存学习结果 */

    progress.understood[id] =
        true;

    delete progress.notUnderstood[id];


    /* 当前按钮变绿 */

    understoodBtn.classList.add(
        "selected"
    );

    notUnderstoodBtn.classList.remove(
        "selected"
    );


    recordToday();

    saveProgress();


    /* 稍微停留一下，让用户看到颜色 */

    setTimeout(() => {

        nextSentence();

    }, 200);

}


/* =========================================================
   Mark Not Understood
========================================================= */

function markNotUnderstood() {

    const id =
        sentences[progress.current].id;


    /* 保存学习结果 */

    progress.notUnderstood[id] =
        true;

    delete progress.understood[id];


    /* 当前按钮变红 */

    notUnderstoodBtn.classList.add(
        "selected"
    );

    understoodBtn.classList.remove(
        "selected"
    );


    recordToday();

    saveProgress();


    /* 稍微停留一下，让用户看到颜色 */

    setTimeout(() => {

        nextSentence();

    }, 200);

}


/* =========================================================
   Next Sentence
========================================================= */

function nextSentence() {

    stopSpeech();

    resetJudgeButtons();


    progress.current++;


    if (
        progress.current >=
        sentences.length
    ) {

        progress.current = 0;

        alert(
            "这一轮已经完成啦 🎉\n继续加油！"
        );

    }


    saveProgress();

    loadCurrent();

}


/* =========================================================
   Random Review
========================================================= */

function randomSentence() {

    stopSpeech();

    resetJudgeButtons();


    const notUnderstoodIds =
        Object.keys(
            progress.notUnderstood
        );


    /* =========================
       优先复习没听懂的
    ========================= */

    if (
        notUnderstoodIds.length > 0
    ) {

        const randomId =
            notUnderstoodIds[
                Math.floor(
                    Math.random() *
                    notUnderstoodIds.length
                )
            ];


        const index =
            sentences.findIndex(
                item =>
                    String(item.id) ===
                    String(randomId)
            );


        if (index >= 0) {

            progress.current =
                index;

        }

    } else {

        /* =========================
           没有待复习 -> 随机一句
        ========================= */

        let index =
            Math.floor(
                Math.random() *
                sentences.length
            );


        /* 尽量不要连续出现同一句 */

        if (
            sentences.length > 1 &&
            index === progress.current
        ) {

            index =
                (index + 1) %
                sentences.length;

        }


        progress.current =
            index;

    }


    saveProgress();

    loadCurrent(true);

}


/* =========================================================
   Update Statistics
========================================================= */

function updateStats() {

    const understoodCount =
        Object.keys(
            progress.understood
        ).length;


    const notUnderstoodCount =
        Object.keys(
            progress.notUnderstood
        ).length;


    const todayCount =
        Object.keys(
            progress.today
        ).length;


    understoodText.textContent =
        `已听懂 ${understoodCount}`;


    notUnderstoodText.textContent =
        `待复习 ${notUnderstoodCount}`;


    todayText.textContent =
        `今日 ${todayCount} 句`;

}


/* =========================================================
   Events
========================================================= */

playBtn.addEventListener(
    "click",
    speakCurrent
);


answerBtn.addEventListener(
    "click",
    toggleAnswer
);


understoodBtn.addEventListener(
    "click",
    markUnderstood
);


notUnderstoodBtn.addEventListener(
    "click",
    markNotUnderstood
);


nextBtn.addEventListener(
    "click",
    nextSentence
);


reviewBtn.addEventListener(
    "click",
    randomSentence
);


/* =========================================================
   Keyboard Shortcuts
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        /* 空格：播放 / 停止 */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            speakCurrent();

            return;

        }


        /* Enter：显示答案 */

        if (
            event.code === "Enter"
        ) {

            event.preventDefault();

            toggleAnswer();

            return;

        }


        /* 右方向键：下一句 */

        if (
            event.code === "ArrowRight"
        ) {

            event.preventDefault();

            nextSentence();

        }

    }
);


/* =========================================================
   Page Visibility
   防止切换页面后声音异常
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            stopSpeech();

        }

    }
);


window.addEventListener(
    "pagehide",
    () => {

        stopSpeech();

    }
);


window.addEventListener(
    "pageshow",
    () => {

        stopSpeech();

    }
);


/* =========================================================
   Keep Speech Engine Alive
========================================================= */

setInterval(() => {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    try {

        if (
            window.speechSynthesis.paused &&
            isSpeaking
        ) {

            window.speechSynthesis.resume();

        }

    } catch (error) {

        console.warn(
            "恢复语音引擎失败:",
            error
        );

    }

}, 8000);


/* =========================================================
   Initialize
========================================================= */

loadProgress();

loadCurrent();

</script>

</body>
</html>

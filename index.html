```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>胖哥学英语</title>

    <meta name="description"
          content="胖哥学英语 - 简洁高效的英语闪卡学习工具">

    <meta name="theme-color" content="#ffffff">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;

            background: #f6f7f9;
            color: #171717;

            transition:
                background .25s ease,
                color .25s ease;

            overflow-x: hidden;
        }

        button,
        select {
            font: inherit;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

            padding-bottom:
                calc(20px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            height: 64px;

            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,.92);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid #e9e9eb;
        }

        .header-inner {
            width: min(820px, calc(100% - 32px));

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -.3px;
        }

        .theme-btn {
            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background: #f2f3f5;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background .2s,
                transform .15s;
        }

        .theme-btn:hover {
            background: #e9eaec;
        }

        .theme-btn:active {
            transform: scale(.94);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            width: min(820px, calc(100% - 32px));

            margin: 0 auto;

            flex: 1;

            padding:
                26px 0
                calc(40px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }


        /* =====================================================
           TOP AREA
        ===================================================== */

        .learning-top {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 12px;
        }

        .deck-select {
            flex: 1;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #dedfe2;
            border-radius: 13px;

            background: #fff;

            color: #222;

            font-size: 14px;
            font-weight: 500;

            outline: none;

            cursor: pointer;
        }

        .deck-select:focus {
            border-color: #aaa;
        }

        .progress-info {
            flex-shrink: 0;

            color: #858585;

            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            height: 4px;

            background: #e5e6e8;

            border-radius: 999px;

            overflow: hidden;

            margin-bottom: 20px;
        }

        .progress-bar {
            width: 0;
            height: 100%;

            background: #181818;

            border-radius: inherit;

            transition: width .25s ease;
        }


        /* =====================================================
           FLASH CARD
        ===================================================== */

        .card-container {
            width: 100%;

            height: min(510px, 58vh);
            min-height: 390px;

            perspective: 1400px;

            cursor: pointer;

            user-select: none;
        }

        .flashcard {
            position: relative;

            width: 100%;
            height: 100%;

            transform-style: preserve-3d;

            transition:
                transform .5s cubic-bezier(.2,.7,.2,1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;

            inset: 0;

            padding: 40px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: #fff;

            border: 1px solid #e5e5e7;

            border-radius: 26px;

            box-shadow:
                0 12px 40px rgba(0,0,0,.055);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }


        /* =====================================================
           FRONT
        ===================================================== */

        .word-label {
            margin-bottom: 12px;

            color: #a0a0a0;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .word {
            max-width: 100%;

            font-size: clamp(42px, 8vw, 72px);

            line-height: 1.05;

            font-weight: 750;

            letter-spacing: -2px;

            word-break: break-word;
        }

        .phonetic {
            margin-top: 16px;

            color: #858585;

            font-size: 17px;
        }


        /* =====================================================
           SPEAK BUTTON
        ===================================================== */

        .speak-main {
            width: 52px;
            height: 52px;

            margin-top: 24px;

            border: 0;
            border-radius: 50%;

            background: #181818;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            box-shadow:
                0 6px 18px rgba(0,0,0,.15);

            transition:
                transform .15s,
                background .2s;
        }

        .speak-main:hover {
            background: #303030;
        }

        .speak-main:active {
            transform: scale(.92);
        }

        .speak-icon {
            display: block;
            transform: translateX(1px);
        }


        /* =====================================================
           CARD HINT
        ===================================================== */

        .card-hint {
            position: absolute;

            bottom: 24px;

            color: #aaa;

            font-size: 12px;
        }


        /* =====================================================
           BACK
        ===================================================== */

        .meaning {
            max-width: 90%;

            font-size: clamp(25px, 5vw, 38px);

            line-height: 1.35;

            font-weight: 700;
        }

        .example {
            max-width: 650px;

            margin-top: 24px;

            color: #4e4e4e;

            font-size: 16px;

            line-height: 1.7;
        }

        .example-cn {
            margin-top: 6px;

            color: #999;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {
            display: grid;

            grid-template-columns:
                1fr 1.15fr 1fr;

            gap: 10px;

            margin-top: 14px;
        }

        .nav-control {
            height: 50px;

            border: 1px solid #dedfe2;

            border-radius: 14px;

            background: #fff;

            color: #252525;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background .18s,
                transform .12s;
        }

        .nav-control:hover {
            background: #f6f6f7;
        }

        .nav-control:active {
            transform: scale(.97);
        }

        .nav-control.primary {
            border-color: #181818;

            background: #181818;

            color: #fff;
        }

        .nav-control.primary:hover {
            background: #303030;
        }


        /* =====================================================
           KNOWLEDGE
        ===================================================== */

        .knowledge {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 10px;
        }

        .knowledge-btn {
            height: 52px;

            border-radius: 14px;

            background: #fff;

            font-size: 14px;
            font-weight: 650;

            cursor: pointer;

            transition:
                transform .12s,
                background .18s;
        }

        .knowledge-btn:active {
            transform: scale(.97);
        }

        .known {
            border: 1px solid #b7dec9;

            color: #067647;

            background: #f7fcf9;
        }

        .known:hover {
            background: #eef9f3;
        }

        .unknown {
            border: 1px solid #edc3bf;

            color: #b42318;

            background: #fff9f8;
        }

        .unknown:hover {
            background: #fff2f0;
        }


        /* =====================================================
           LIBRARY
        ===================================================== */

        .page-title {
            margin: 4px 0 18px;

            font-size: 25px;
            font-weight: 750;
        }

        .deck-list {
            display: grid;
            gap: 10px;
        }

        .deck-item {
            width: 100%;

            padding: 18px;

            text-align: left;

            border: 1px solid #e2e3e5;

            border-radius: 16px;

            background: #fff;

            cursor: pointer;

            transition:
                transform .12s,
                background .18s;
        }

        .deck-item:hover {
            background: #fafafa;
        }

        .deck-item:active {
            transform: scale(.985);
        }

        .deck-name {
            font-size: 16px;
            font-weight: 650;
        }

        .deck-meta {
            margin-top: 6px;

            color: #999;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }

        .stat-card {
            padding: 22px;

            border: 1px solid #e2e3e5;

            border-radius: 16px;

            background: #fff;
        }

        .stat-label {
            color: #888;

            font-size: 13px;
        }

        .stat-value {
            margin-top: 8px;

            font-size: 32px;
            font-weight: 750;
        }

        .stat-wide {
            grid-column: span 2;
        }

        .mastery-wrap {
            margin-top: 15px;
        }

        .mastery-track {
            height: 8px;

            background: #e8e8ea;

            border-radius: 999px;

            overflow: hidden;
        }

        .mastery-bar {
            width: 0;
            height: 100%;

            background: #181818;

            border-radius: inherit;

            transition: width .3s ease;
        }


        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: fixed;

            left: 50%;
            bottom: 14px;

            transform: translateX(-50%);

            width: min(430px, calc(100% - 24px));

            height: 62px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            background: rgba(255,255,255,.94);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid #e2e2e4;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0,0,0,.08);

            z-index: 200;

            padding-bottom:
                env(safe-area-inset-bottom);
        }

        .nav-btn {
            border: 0;

            background: transparent;

            color: #999;

            cursor: pointer;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            font-size: 11px;
        }

        .nav-btn.active {
            color: #181818;

            font-weight: 650;
        }

        .nav-icon {
            font-size: 18px;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading,
        .error-box {
            padding: 80px 20px;

            text-align: center;

            color: #888;
        }

        .error-box {
            color: #b42318;
        }

        .error-title {
            margin-bottom: 8px;

            font-weight: 700;
        }

        .error-detail {
            font-size: 13px;

            line-height: 1.6;

            word-break: break-word;
        }

        .retry-btn {
            margin-top: 18px;

            padding: 10px 18px;

            border: 0;

            border-radius: 10px;

            background: #181818;

            color: #fff;

            cursor: pointer;
        }


        /* =====================================================
           UPDATE
        ===================================================== */

        .update-toast {
            position: fixed;

            left: 50%;
            top: 76px;

            transform: translateX(-50%);

            z-index: 500;

            padding: 10px 16px;

            border-radius: 10px;

            background: #181818;

            color: #fff;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: opacity .2s;
        }

        .update-toast.show {
            opacity: 1;
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark {
            background: #101010;
            color: #eee;
        }

        body.dark .header {
            background: rgba(18,18,18,.94);

            border-color: #292929;
        }

        body.dark .theme-btn {
            background: #292929;
            color: #eee;
        }

        body.dark .deck-select,
        body.dark .card-face,
        body.dark .nav-control,
        body.dark .knowledge-btn,
        body.dark .deck-item,
        body.dark .stat-card {
            background: #1a1a1a;

            color: #eee;

            border-color: #303030;
        }

        body.dark .deck-select {
            color: #eee;
        }

        body.dark .progress {
            background: #333;
        }

        body.dark .progress-bar,
        body.dark .mastery-bar {
            background: #eee;
        }

        body.dark .phonetic,
        body.dark .progress-info,
        body.dark .card-hint,
        body.dark .deck-meta,
        body.dark .stat-label {
            color: #888;
        }

        body.dark .example {
            color: #bbb;
        }

        body.dark .example-cn {
            color: #888;
        }

        body.dark .nav-control.primary {
            background: #eee;

            border-color: #eee;

            color: #111;
        }

        body.dark .speak-main {
            background: #eee;

            color: #111;
        }

        body.dark .bottom-nav {
            background: rgba(20,20,20,.94);

            border-color: #303030;
        }

        body.dark .nav-btn {
            color: #777;
        }

        body.dark .nav-btn.active {
            color: #eee;
        }

        body.dark .known {
            background: #142019;

            border-color: #28533d;

            color: #6ee7a0;
        }

        body.dark .unknown {
            background: #241615;

            border-color: #5b302d;

            color: #ff8b82;
        }


        /* =====================================================
           TABLET / DESKTOP
        ===================================================== */

        @media (min-width: 768px) {

            .main {
                padding-top: 32px;
            }

            .card-container {
                height: 500px;
            }

            .bottom-nav {
                bottom: 16px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 56px;
            }

            .header-inner {
                width: calc(100% - 24px);
            }

            .logo {
                font-size: 17px;
            }

            .main {
                width: calc(100% - 20px);

                padding-top: 14px;

                padding-bottom: 105px;
            }

            .learning-top {
                gap: 8px;

                margin-bottom: 8px;
            }

            .deck-select {
                height: 42px;

                border-radius: 12px;

                padding: 0 11px;

                font-size: 13px;
            }

            .progress-info {
                font-size: 12px;
            }

            .progress {
                margin-bottom: 12px;
            }

            .card-container {
                height: min(60vh, 440px);

                min-height: 340px;
            }

            .card-face {
                padding: 25px 18px;

                border-radius: 20px;
            }

            .word {
                font-size: clamp(40px, 12vw, 58px);

                letter-spacing: -1.5px;
            }

            .phonetic {
                margin-top: 12px;

                font-size: 15px;
            }

            .speak-main {
                width: 48px;
                height: 48px;

                margin-top: 18px;
            }

            .card-hint {
                bottom: 18px;

                font-size: 11px;
            }

            .meaning {
                font-size: 25px;
            }

            .example {
                margin-top: 18px;

                font-size: 14px;
            }

            .navigation {
                gap: 7px;

                margin-top: 10px;
            }

            .nav-control {
                height: 46px;

                border-radius: 12px;

                font-size: 13px;
            }

            .knowledge {
                gap: 7px;

                margin-top: 7px;
            }

            .knowledge-btn {
                height: 48px;

                border-radius: 12px;

                font-size: 13px;
            }

            .bottom-nav {
                bottom: 10px;

                height: 58px;

                border-radius: 18px;
            }

            .page-title {
                font-size: 22px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .card-container {
                height: 325px;

                min-height: 325px;
            }

            .word {
                font-size: 39px;
            }

            .speak-main {
                width: 44px;
                height: 44px;

                margin-top: 14px;
            }

            .navigation {
                grid-template-columns:
                    1fr 1fr 1fr;
            }

            .nav-control {
                font-size: 12px;
            }

            .knowledge-btn {
                height: 44px;

                font-size: 12px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-inner">

            <div class="logo">
                胖哥学英语
            </div>

            <button
                id="themeBtn"
                class="theme-btn"
                aria-label="切换主题"
                title="切换主题">
                ☾
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <!-- ================= Learning ================= -->

        <section
            id="learningPage"
            class="page active">

            <div
                id="loadingBox"
                class="loading">

                正在加载词库...

            </div>


            <div
                id="errorBox"
                class="error-box"
                style="display:none;">

                <div class="error-title">
                    词库加载失败
                </div>

                <div
                    id="errorDetail"
                    class="error-detail">
                </div>

                <button
                    id="retryBtn"
                    class="retry-btn">

                    重新加载

                </button>

            </div>


            <div
                id="learningContent"
                style="display:none;">

                <!-- 词库 -->

                <div class="learning-top">

                    <select
                        id="deckSelect"
                        class="deck-select">
                    </select>

                    <div class="progress-info">

                        <span id="currentNumber">
                            1
                        </span>

                        /

                        <span id="totalNumber">
                            0
                        </span>

                    </div>

                </div>


                <!-- 进度 -->

                <div class="progress">

                    <div
                        id="progressBar"
                        class="progress-bar">
                    </div>

                </div>


                <!-- =================================================
                     FLASH CARD
                ================================================== -->

                <div
                    id="cardContainer"
                    class="card-container"
                    aria-label="英语单词卡片">

                    <div
                        id="flashcard"
                        class="flashcard">


                        <!-- ================= FRONT ================= -->

                        <div
                            class="card-face card-front">

                            <div class="word-label">
                                WORD
                            </div>

                            <div
                                id="word"
                                class="word">

                                —

                            </div>

                            <div
                                id="phonetic"
                                class="phonetic">

                                —

                            </div>


                            <!-- 播放按钮 -->

                            <button
                                id="frontSpeakBtn"
                                class="speak-main"
                                aria-label="播放单词">

                                <span class="speak-icon">
                                    ▶
                                </span>

                            </button>


                            <div class="card-hint">
                                点击卡片查看中文
                            </div>

                        </div>


                        <!-- ================= BACK ================= -->

                        <div
                            class="card-face card-back">

                            <div
                                id="meaning"
                                class="meaning">

                                —

                            </div>

                            <div
                                id="example"
                                class="example">

                                —

                            </div>

                            <div
                                id="exampleCn"
                                class="example example-cn">
                            </div>


                            <button
                                id="backSpeakBtn"
                                class="speak-main"
                                aria-label="播放单词">

                                <span class="speak-icon">
                                    ▶
                                </span>

                            </button>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     上一个 / 翻转 / 下一个
                ================================================== -->

                <div class="navigation">

                    <button
                        id="prevBtn"
                        class="nav-control">

                        ← 上一个

                    </button>

                    <button
                        id="flipBtn"
                        class="nav-control primary">

                        翻转

                    </button>

                    <button
                        id="nextBtn"
                        class="nav-control">

                        下一个 →

                    </button>

                </div>


                <!-- =================================================
                     记住 / 没记住
                ================================================== -->

                <div class="knowledge">

                    <button
                        id="unknownBtn"
                        class="knowledge-btn unknown">

                        ✕ 没记住

                    </button>

                    <button
                        id="knownBtn"
                        class="knowledge-btn known">

                        ✓ 记住了

                    </button>

                </div>

            </div>

        </section>


        <!-- ================= Library ================= -->

        <section
            id="libraryPage"
            class="page">

            <div class="page-title">
                词库
            </div>

            <div
                id="deckList"
                class="deck-list">
            </div>

        </section>


        <!-- ================= Stats ================= -->

        <section
            id="statsPage"
            class="page">

            <div class="page-title">
                学习统计
            </div>

            <div class="stats-grid">

                <div class="stat-card">

                    <div class="stat-label">
                        总词数
                    </div>

                    <div
                        id="statTotal"
                        class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        已学习
                    </div>

                    <div
                        id="statLearned"
                        class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        已记住
                    </div>

                    <div
                        id="statKnown"
                        class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        没记住
                    </div>

                    <div
                        id="statUnknown"
                        class="stat-value">
                        0
                    </div>

                </div>


                <div class="stat-card stat-wide">

                    <div class="stat-label">
                        掌握率
                    </div>

<script>
"use strict";


/* =========================================================
   基础配置
========================================================= */

const SITE_ROOT = "/MyFlashCards/";
const DATA_ROOT = SITE_ROOT + "data/";

const DECK_INDEX = DATA_ROOT + "index.json";
const VERSION_URL = DATA_ROOT + "version.json";

const VERSION_STORAGE_KEY =
    "myflashcards_site_version";

const STATE_STORAGE_PREFIX =
    "myflashcards_state_";

const THEME_STORAGE_KEY =
    "myflashcards_theme";

const CURRENT_DECK_KEY =
    "myflashcards_current_deck";


/* =========================================================
   全局状态
========================================================= */

let decks = [];

let currentDeck = null;

let currentWords = [];

let currentIndex = 0;

let isFlipped = false;

let learningState = {};


/* =========================================================
   DOM
========================================================= */

const loadingBox =
    document.getElementById("loadingBox");

const errorBox =
    document.getElementById("errorBox");

const errorDetail =
    document.getElementById("errorDetail");

const retryBtn =
    document.getElementById("retryBtn");

const learningContent =
    document.getElementById("learningContent");

const deckSelect =
    document.getElementById("deckSelect");

const currentNumber =
    document.getElementById("currentNumber");

const totalNumber =
    document.getElementById("totalNumber");

const progressBar =
    document.getElementById("progressBar");

const cardContainer =
    document.getElementById("cardContainer");

const flashcard =
    document.getElementById("flashcard");

const wordEl =
    document.getElementById("word");

const phoneticEl =
    document.getElementById("phonetic");

const meaningEl =
    document.getElementById("meaning");

const exampleEl =
    document.getElementById("example");

const exampleCnEl =
    document.getElementById("exampleCn");

const frontSpeakBtn =
    document.getElementById("frontSpeakBtn");

const backSpeakBtn =
    document.getElementById("backSpeakBtn");

const prevBtn =
    document.getElementById("prevBtn");

const flipBtn =
    document.getElementById("flipBtn");

const nextBtn =
    document.getElementById("nextBtn");

const unknownBtn =
    document.getElementById("unknownBtn");

const knownBtn =
    document.getElementById("knownBtn");

const deckList =
    document.getElementById("deckList");

const statTotal =
    document.getElementById("statTotal");

const statLearned =
    document.getElementById("statLearned");

const statKnown =
    document.getElementById("statKnown");

const statUnknown =
    document.getElementById("statUnknown");

const statMastery =
    document.getElementById("statMastery");

const masteryBar =
    document.getElementById("masteryBar");

const themeBtn =
    document.getElementById("themeBtn");

const updateToast =
    document.getElementById("updateToast");


/* =========================================================
   JSON
========================================================= */

async function getJSON(url) {

    const separator =
        url.includes("?") ? "&" : "?";

    const finalUrl =
        url +
        separator +
        "_=" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            10000
        );

    try {

        const response =
            await fetch(
                finalUrl,
                {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal,
                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status} ${response.statusText}`
            );

        }

        const text =
            await response.text();

        if (!text.trim()) {

            throw new Error(
                "服务器返回空内容"
            );

        }

        try {

            return JSON.parse(text);

        } catch (e) {

            throw new Error(
                "JSON 格式错误：" +
                e.message
            );

        }

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "请求超时：10 秒内没有收到响应"
            );

        }

        throw error;

    } finally {

        clearTimeout(timeout);

    }

}


/* =========================================================
   VERSION
========================================================= */

async function checkVersion() {

    try {

        const data =
            await getJSON(VERSION_URL);

        if (
            !data ||
            !data.version
        ) {

            return;

        }

        const serverVersion =
            String(data.version);

        const localVersion =
            localStorage.getItem(
                VERSION_STORAGE_KEY
            );

        if (!localVersion) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            return;

        }

        if (
            localVersion !==
            serverVersion
        ) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            updateToast
                .classList
                .add("show");

            setTimeout(
                () => {

                    const newUrl =
                        window.location.pathname +
                        "?v=" +
                        encodeURIComponent(
                            serverVersion
                        );

                    window.location.replace(
                        newUrl
                    );

                },
                700
            );

        }

    } catch (error) {

        console.warn(
            "版本检测失败：",
            error
        );

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

    loadingBox.style.display =
        "block";

    errorBox.style.display =
        "none";

    learningContent.style.display =
        "none";

}


function showError(error) {

    loadingBox.style.display =
        "none";

    learningContent.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorDetail.textContent =
        error instanceof Error
            ? error.message
            : String(error);

}


function showContent() {

    loadingBox.style.display =
        "none";

    errorBox.style.display =
        "none";

    learningContent.style.display =
        "block";

}


/* =========================================================
   LOAD DECKS
========================================================= */

async function loadDecks() {

    showLoading();

    try {

        const data =
            await getJSON(DECK_INDEX);

        if (!Array.isArray(data)) {

            throw new Error(
                "index.json 必须是数组格式"
            );

        }

        decks = data;

        if (!decks.length) {

            throw new Error(
                "index.json 中没有任何词库"
            );

        }

        renderDeckSelect();

        renderLibrary();

        const savedDeck =
            localStorage.getItem(
                CURRENT_DECK_KEY
            );

        let targetDeck =
            decks.find(
                deck =>
                    deck.id ===
                    savedDeck
            );

        if (!targetDeck) {

            targetDeck =
                decks[0];

        }

        await loadDeck(
            targetDeck.id
        );

        showContent();

    } catch (error) {

        console.error(
            "加载词库失败：",
            error
        );

        showError(error);

    }

}


/* =========================================================
   DECK SELECT
========================================================= */

function renderDeckSelect() {

    deckSelect.innerHTML = "";

    decks.forEach(
        deck => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                deck.id;

            option.textContent =
                deck.name ||
                deck.id;

            deckSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   LOAD DECK
========================================================= */

async function loadDeck(deckId) {

    const deck =
        decks.find(
            item =>
                item.id ===
                deckId
        );

    if (!deck) {

        throw new Error(
            "找不到词库：" +
            deckId
        );

    }

    if (!deck.file) {

        throw new Error(
            "词库缺少 file 字段：" +
            deckId
        );

    }

    const url =
        DATA_ROOT +
        deck.file;

    const data =
        await getJSON(url);

    if (!Array.isArray(data)) {

        throw new Error(
            `${deck.file} 必须是数组格式`
        );

    }

    if (!data.length) {

        throw new Error(
            `${deck.file} 没有单词`
        );

    }

    currentDeck =
        deck;

    currentWords =
        data;

    localStorage.setItem(
        CURRENT_DECK_KEY,
        deck.id
    );

    loadLearningState();

    const savedPosition =
        Number(
            learningState.position
        );

    if (
        Number.isInteger(
            savedPosition
        ) &&
        savedPosition >= 0 &&
        savedPosition <
            currentWords.length
    ) {

        currentIndex =
            savedPosition;

    } else {

        currentIndex = 0;

    }

    isFlipped = false;

    deckSelect.value =
        deck.id;

    renderCurrentCard();

    updateStats();

}


/* =========================================================
   LEARNING STATE
========================================================= */

function getStateKey() {

    return (
        STATE_STORAGE_PREFIX +
        (
            currentDeck
                ? currentDeck.id
                : "unknown"
        )
    );

}


function loadLearningState() {

    try {

        const raw =
            localStorage.getItem(
                getStateKey()
            );

        if (!raw) {

            learningState = {};

            return;

        }

        const parsed =
            JSON.parse(raw);

        if (
            parsed &&
            typeof parsed ===
                "object"
        ) {

            learningState =
                parsed;

        } else {

            learningState = {};

        }

    } catch (error) {

        console.warn(
            "学习状态读取失败：",
            error
        );

        learningState = {};

    }

}


function saveLearningState() {

    if (!currentDeck) {

        return;

    }

    learningState.position =
        currentIndex;

    try {

        localStorage.setItem(
            getStateKey(),
            JSON.stringify(
                learningState
            )
        );

    } catch (error) {

        console.warn(
            "学习状态保存失败：",
            error
        );

    }

}


/* =========================================================
   WORD STATE
========================================================= */

function getWordKey(index) {

    const item =
        currentWords[index];

    if (!item) {

        return String(index);

    }

    return (
        item.word +
        "_" +
        index
    );

}


function getWordStatus(index) {

    return (
        learningState[
            getWordKey(index)
        ] ||
        null
    );

}


function setWordStatus(
    index,
    status
) {

    learningState[
        getWordKey(index)
    ] = status;

    saveLearningState();

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCurrentCard() {

    if (
        !currentWords.length
    ) {

        return;

    }

    const item =
        currentWords[
            currentIndex
        ];

    if (!item) {

        return;

    }

    wordEl.textContent =
        item.word || "—";

    phoneticEl.textContent =
        item.phonetic || "";

    meaningEl.textContent =
        item.meaning || "—";

    exampleEl.textContent =
        item.example || "";

    exampleCnEl.textContent =
        item.example_cn || "";

    totalNumber.textContent =
        currentWords.length;

    currentNumber.textContent =
        currentIndex + 1;

    const percent =
        (
            (currentIndex + 1) /
            currentWords.length
        ) * 100;

    progressBar.style.width =
        percent + "%";

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

}


/* =========================================================
   FLIP
========================================================= */

function flipCard() {

    isFlipped =
        !isFlipped;

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousCard() {

    if (!currentWords.length) {

        return;

    }

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex =
            currentWords.length - 1;

    }

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   NEXT
========================================================= */

function nextCard() {

    if (!currentWords.length) {

        return;

    }

    currentIndex++;

    if (
        currentIndex >=
        currentWords.length
    ) {

        currentIndex = 0;

    }

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   RANDOM
========================================================= */

function randomCard() {

    if (
        currentWords.length <= 1
    ) {

        return;

    }

    let nextIndex;

    do {

        nextIndex =
            Math.floor(
                Math.random() *
                currentWords.length
            );

    } while (
        nextIndex ===
        currentIndex
    );

    currentIndex =
        nextIndex;

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   SPEAK
========================================================= */

function speakWord() {

    if (
        !currentWords.length
    ) {

        return;

    }

    const item =
        currentWords[
            currentIndex
        ];

    if (
        !item ||
        !item.word
    ) {

        return;

    }

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "当前浏览器不支持英语朗读"
        );

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            item.word
        );

    utterance.lang =
        "en-US";

    utterance.rate =
        0.85;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   KNOWLEDGE
========================================================= */

function markKnown() {

    setWordStatus(
        currentIndex,
        "known"
    );

    updateStats();

    nextCard();

}


function markUnknown() {

    setWordStatus(
        currentIndex,
        "unknown"
    );

    updateStats();

    nextCard();

}


/* =========================================================
   STATS
========================================================= */

function calculateStats() {

    const total =
        currentWords.length;

    let known = 0;

    let unknown = 0;

    for (
        let i = 0;
        i < currentWords.length;
        i++
    ) {

        const status =
            getWordStatus(i);

        if (
            status === "known"
        ) {

            known++;

        }

        if (
            status === "unknown"
        ) {

            unknown++;

        }

    }

    const learned =
        known + unknown;

    const mastery =
        total > 0
            ? Math.round(
                (known / total) *
                100
            )
            : 0;

    return {
        total,
        learned,
        known,
        unknown,
        mastery
    };

}


function updateStats() {

    const stats =
        calculateStats();

    statTotal.textContent =
        stats.total;

    statLearned.textContent =
        stats.learned;

    statKnown.textContent =
        stats.known;

    statUnknown.textContent =
        stats.unknown;

    statMastery.textContent =
        stats.mastery + "%";

    masteryBar.style.width =
        stats.mastery + "%";

}


/* =========================================================
   LIBRARY
========================================================= */

function renderLibrary() {

    deckList.innerHTML = "";

    decks.forEach(
        deck => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "deck-item";

            const name =
                escapeHTML(
                    deck.name ||
                    deck.id
                );

            const description =
                deck.description
                    ? escapeHTML(
                        deck.description
                    )
                    : "";

            button.innerHTML = `
                <div class="deck-name">
                    ${name}
                </div>

                ${
                    description
                        ? `
                            <div class="deck-meta">
                                ${description}
                            </div>
                          `
                        : ""
                }
            `;

            button.addEventListener(
                "click",
                async () => {

                    try {

                        await loadDeck(
                            deck.id
                        );

                        showPage(
                            "learningPage"
                        );

                    } catch (error) {

                        showError(
                            error
                        );

                        showPage(
                            "learningPage"
                        );

                    }

                }
            );

            deckList.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   PAGE
========================================================= */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(
            page => {

                page.classList.toggle(
                    "active",
                    page.id === pageId
                );

            }
        );

    document
        .querySelectorAll(".nav-btn")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page ===
                    pageId
                );

            }
        );

    if (
        pageId === "statsPage"
    ) {

        updateStats();

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   THEME
========================================================= */

function loadTheme() {

    const savedTheme =
        localStorage.getItem(
            THEME_STORAGE_KEY
        );

    if (
        savedTheme === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

        themeBtn.textContent =
            "☀";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeBtn.textContent =
            "☾";

    }

}


function toggleTheme() {

    const isDark =
        document.body.classList.toggle(
            "dark"
        );

    localStorage.setItem(
        THEME_STORAGE_KEY,
        isDark
            ? "dark"
            : "light"
    );

    themeBtn.textContent =
        isDark
            ? "☀"
            : "☾";

}


/* =========================================================
   CARD CLICK
========================================================= */

cardContainer.addEventListener(
    "click",
    event => {

        if (
            event.target.closest(
                ".speak-main"
            )
        ) {

            return;

        }

        flipCard();

    }
);


/* =========================================================
   SPEAK
========================================================= */

frontSpeakBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        speakWord();

    }
);


backSpeakBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        speakWord();

    }
);


/* =========================================================
   BUTTONS
========================================================= */

flipBtn.addEventListener(
    "click",
    flipCard
);

prevBtn.addEventListener(
    "click",
    previousCard
);

nextBtn.addEventListener(
    "click",
    nextCard
);

unknownBtn.addEventListener(
    "click",
    markUnknown
);

knownBtn.addEventListener(
    "click",
    markKnown
);


/* =========================================================
   DECK SELECT
========================================================= */

deckSelect.addEventListener(
    "change",
    async event => {

        try {

            await loadDeck(
                event.target.value
            );

        } catch (error) {

            showError(error);

        }

    }
);


/* =========================================================
   RETRY
========================================================= */

retryBtn.addEventListener(
    "click",
    () => {

        loadDecks();

    }
);


/* =========================================================
   THEME
========================================================= */

themeBtn.addEventListener(
    "click",
    toggleTheme
);


/* =========================================================
   BOTTOM NAV
========================================================= */

document
    .querySelectorAll(".nav-btn")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    showPage(
                        button.dataset.page
                    );

                }
            );

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const tag =
            event.target.tagName;

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"
        ) {

            return;

        }

        switch (
            event.key.toLowerCase()
        ) {

            case " ":

                event.preventDefault();

                flipCard();

                break;

            case "arrowleft":

                previousCard();

                break;

            case "arrowright":

                nextCard();

                break;

            case "r":

                randomCard();

                break;

            case "s":

                speakWord();

                break;

            case "k":

                markKnown();

                break;

            case "x":

                markUnknown();

                break;

        }

    }
);


/* =========================================================
   TOUCH
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();

        if (
            now - lastTouchEnd <=
            300
        ) {

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    {
        passive: false
    }
);


/* =========================================================
   INIT
========================================================= */

async function init() {

    loadTheme();

    await checkVersion();

    await loadDecks();

}


init().catch(
    error => {

        console.error(
            "程序初始化失败：",
            error
        );

        showError(error);

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>胖哥学英语</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
            background: #f6f7fb;
            color: #202124;
            transition: background 0.25s, color 0.25s;
            overflow-x: hidden;
        }

        button,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           Header
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            height: 62px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e9eaf0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-inner {
            width: min(1100px, calc(100% - 32px));
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f0f1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, background 0.2s;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* =========================
           Main
        ========================= */

        .main {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding-top: 18px;
            padding-bottom: 110px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================
           Loading / Error
        ========================= */

        .loading {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 14px;
        }

        .error-box {
            display: none;
            margin: 30px auto;
            padding: 20px;
            max-width: 700px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid #f0caca;
            color: #c62828;
            line-height: 1.7;
            font-size: 14px;
        }

        /* =========================
           Learning
        ========================= */

        .learning-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .deck-select {
            flex: 1;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #dedfe6;
            border-radius: 12px;
            background: #fff;
            color: #202124;
            font-size: 14px;
            outline: none;
        }

        .progress-info {
            white-space: nowrap;
            font-size: 12px;
            color: #777;
        }

        .progress {
            width: 100%;
            height: 4px;
            margin-bottom: 14px;
            border-radius: 999px;
            overflow: hidden;
            background: #e6e7ec;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: #202124;
            transition: width 0.25s ease;
        }

        /* =========================
           Flash Card
        ========================= */

        .card-container {
            width: 100%;
            height: 430px;
            min-height: 430px;
            perspective: 1200px;
            margin-bottom: 0;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.55s ease;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 24px;
            background: #fff;
            border: 1px solid #e9eaf0;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .word-label {
            margin-bottom: 10px;
            color: #999;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .word {
            max-width: 95%;
            text-align: center;
            font-size: clamp(46px, 7vw, 76px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -2px;
            word-break: break-word;
        }

        .phonetic {
            margin-top: 12px;
            color: #777;
            font-size: 16px;
        }

        .speak-main {
            width: 48px;
            height: 48px;
            margin-top: 18px;
            border-radius: 50%;
            background: #202124;
            color: #fff;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .speak-main:active {
            transform: scale(0.9);
        }

        .card-hint {
            position: absolute;
            bottom: 18px;
            color: #aaa;
            font-size: 11px;
        }

        .meaning {
            max-width: 90%;
            text-align: center;
            font-size: 30px;
            line-height: 1.35;
            font-weight: 700;
        }

        .example {
            max-width: 90%;
            margin-top: 18px;
            text-align: center;
            font-size: 16px;
            line-height: 1.7;
            color: #555;
        }

        .example-cn {
            margin-top: 5px;
            color: #888;
        }

        /* =========================
           Navigation Buttons
        ========================= */

        .navigation {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .nav-control {
            height: 46px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #e2e3e8;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-control:active {
            transform: scale(0.98);
        }

        .flip-btn {
            background: #202124;
            color: #fff;
            border-color: #202124;
        }

        .knowledge {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .knowledge-btn {
            height: 46px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .unknown-btn {
            background: #fff0f0;
            color: #c62828;
            border: 1px solid #ffd3d3;
        }

        .known-btn {
            background: #eef8f0;
            color: #25813a;
            border: 1px solid #cfe8d4;
        }

        /* =========================
           Library
        ========================= */

        .page-title {
            margin: 4px 0 18px;
            font-size: 28px;
            font-weight: 800;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }

        .deck-card {
            padding: 20px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #e8e9ee;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .deck-card:active {
            transform: scale(0.98);
        }

        .deck-name {
            font-size: 17px;
            font-weight: 750;
        }

        .deck-description {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }

        .deck-count {
            margin-top: 14px;
            color: #999;
            font-size: 12px;
        }

        /* =========================
           Stats
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #e8e9ee;
        }

        .stat-label {
            color: #777;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 7px;
            font-size: 32px;
            font-weight: 800;
        }

        .mastery-wrap {
            margin-top: 14px;
        }

        .mastery-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            color: #777;
            font-size: 12px;
        }

        .mastery-bar {
            height: 7px;
            border-radius: 999px;
            background: #e8e9ee;
            overflow: hidden;
        }

        .mastery-progress {
            width: 0;
            height: 100%;
            background: #202124;
            border-radius: inherit;
        }

        /* =========================
           Bottom Navigation
        ========================= */

        .bottom-nav {
            position: fixed;
            z-index: 200;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            width: min(500px, calc(100% - 32px));
            height: 62px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 4px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e4e5ea;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-btn {
            border-radius: 15px;
            background: transparent;
            color: #888;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .nav-btn.active {
            background: #202124;
            color: #fff;
        }

        .nav-icon {
            font-size: 19px;
            line-height: 1;
        }

        /* =========================
           Dark Mode
        ========================= */

        body.dark {
            background: #111214;
            color: #f3f3f3;
        }

        body.dark .header {
            background: rgba(24, 25, 28, 0.96);
            border-color: #2a2b30;
        }

        body.dark .theme-toggle {
            background: #2b2c31;
        }

        body.dark .deck-select,
        body.dark .card-face,
        body.dark .nav-control,
        body.dark .deck-card,
        body.dark .stat-card,
        body.dark .bottom-nav {
            background: #1b1c20;
            border-color: #2d2e34;
            color: #f3f3f3;
        }

        body.dark .phonetic,
        body.dark .progress-info,
        body.dark .deck-description,
        body.dark .deck-count,
        body.dark .stat-label,
        body.dark .mastery-label {
            color: #999;
        }

        body.dark .example {
            color: #bbb;
        }

        body.dark .example-cn {
            color: #888;
        }

        body.dark .progress {
            background: #303138;
        }

        body.dark .nav-control {
            color: #eee;
        }

        body.dark .flip-btn {
            background: #f3f3f3;
            color: #111;
        }

        body.dark .bottom-nav {
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        body.dark .nav-btn.active {
            background: #f3f3f3;
            color: #111;
        }

        body.dark .unknown-btn {
            background: #321c1e;
            border-color: #52282c;
        }

        body.dark .known-btn {
            background: #193020;
            border-color: #294d31;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 54px;
            }

            .header-inner {
                width: calc(100% - 24px);
            }

            .logo {
                font-size: 17px;
            }

            .main {
                width: calc(100% - 20px);
                padding-top: 10px;

                /*
                 * Bottom navigation is fixed.
                 * Reserve enough space so the knowledge buttons
                 * never get covered.
                 */
                padding-bottom: calc(78px + env(safe-area-inset-bottom));
            }

            .learning-top {
                gap: 7px;
                margin-bottom: 6px;
            }

            .deck-select {
                height: 40px;
                border-radius: 10px;
                padding: 0 10px;
                font-size: 13px;
            }

            .progress-info {
                font-size: 11px;
            }

            .progress {
                height: 3px;
                margin-bottom: 9px;
            }

            /*
             * Slightly smaller than desktop,
             * but not aggressively compressed.
             */
            .card-container {
                height: 360px;
                min-height: 360px;
            }

            .card-face {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .word-label {
                margin-bottom: 8px;
                font-size: 10px;
                letter-spacing: 1.2px;
            }

            .word {
                font-size: clamp(40px, 11vw, 54px);
                letter-spacing: -1px;
                line-height: 1.06;
            }

            .phonetic {
                margin-top: 10px;
                font-size: 15px;
            }

            .speak-main {
                width: 44px;
                height: 44px;
                margin-top: 14px;
                font-size: 18px;
            }

            .card-hint {
                bottom: 14px;
                font-size: 10px;
            }

            .meaning {
                max-width: 92%;
                font-size: 25px;
                line-height: 1.3;
            }

            .example {
                max-width: 95%;
                margin-top: 14px;
                font-size: 14px;
                line-height: 1.55;
            }

            .example-cn {
                margin-top: 4px;
            }

            .navigation {
                gap: 7px;
                margin-top: 8px;
            }

            .nav-control {
                height: 42px;
                border-radius: 10px;
                font-size: 13px;
            }

            .knowledge {
                gap: 7px;
                margin-top: 7px;
            }

            .knowledge-btn {
                height: 42px;
                border-radius: 10px;
                font-size: 13px;
            }

            .bottom-nav {
                bottom: calc(8px + env(safe-area-inset-bottom));
                width: calc(100% - 20px);
                height: 54px;
                border-radius: 16px;
            }

            .nav-btn {
                font-size: 10px;
                gap: 2px;
            }

            .nav-icon {
                font-size: 16px;
            }

            .page-title {
                margin-top: 2px;
                font-size: 21px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
            }

            .stat-card {
                padding: 16px;
                border-radius: 13px;
            }

            .stat-label {
                font-size: 12px;
            }

            .stat-value {
                margin-top: 5px;
                font-size: 27px;
            }

            .mastery-wrap {
                margin-top: 10px;
            }

            .deck-grid {
                grid-template-columns: 1fr;
                gap: 9px;
            }

            .deck-card {
                padding: 16px;
                border-radius: 13px;
            }
        }

        /* =========================
           Small Phones
        ========================= */

        @media (max-width: 380px) {

            .header {
                height: 52px;
            }

            .logo {
                font-size: 16px;
            }

            .main {
                width: calc(100% - 16px);
                padding-top: 8px;
                padding-bottom: calc(74px + env(safe-area-inset-bottom));
            }

            .learning-top {
                gap: 5px;
                margin-bottom: 5px;
            }

            .deck-select {
                height: 38px;
                padding: 0 8px;
                font-size: 12px;
                border-radius: 9px;
            }

            .progress-info {
                font-size: 10px;
            }

            .progress {
                margin-bottom: 8px;
            }

            /*
             * Keep a reasonably large card.
             * This is only for narrow phones.
             */
            .card-container {
                height: 330px;
                min-height: 330px;
            }

            .card-face {
                padding: 20px 15px;
                border-radius: 17px;
            }

            .word-label {
                margin-bottom: 6px;
                font-size: 9px;
            }

            .word {
                font-size: 40px;
                letter-spacing: -.8px;
            }

            .phonetic {
                margin-top: 9px;
                font-size: 14px;
            }

            .speak-main {
                width: 42px;
                height: 42px;
                margin-top: 12px;
                font-size: 17px;
            }

            .card-hint {
                bottom: 11px;
                font-size: 9px;
            }

            .meaning {
                font-size: 22px;
            }

            .example {
                margin-top: 11px;
                font-size: 13px;
                line-height: 1.45;
            }

            .navigation {
                gap: 6px;
                margin-top: 7px;
            }

            .nav-control {
                height: 40px;
                border-radius: 9px;
                font-size: 12px;
            }

            .knowledge {
                gap: 6px;
                margin-top: 6px;
            }

            .knowledge-btn {
                height: 40px;
                border-radius: 9px;
                font-size: 12px;
            }

            .bottom-nav {
                bottom: calc(6px + env(safe-area-inset-bottom));
                width: calc(100% - 16px);
                height: 50px;
                border-radius: 15px;
            }

            .nav-btn {
                font-size: 9px;
            }

            .nav-icon {
                font-size: 15px;
            }
        }

        /* =========================
           Short Mobile Screens
        ========================= */

        @media (max-width: 600px) and (max-height: 700px) {

            .main {
                padding-top: 7px;
                padding-bottom: calc(72px + env(safe-area-inset-bottom));
            }

            .learning-top {
                margin-bottom: 4px;
            }

            .deck-select {
                height: 36px;
            }

            .progress {
                margin-bottom: 7px;
            }

            /*
             * For short screens, reduce moderately.
             * Do not reduce to the previous 255px size.
             */
            .card-container {
                height: 310px;
                min-height: 310px;
            }

            .card-face {
                padding: 18px 14px;
            }

            .word {
                font-size: 38px;
            }

            .phonetic {
                margin-top: 8px;
                font-size: 13px;
            }

            .speak-main {
                width: 40px;
                height: 40px;
                margin-top: 10px;
            }

            .card-hint {
                bottom: 9px;
            }

            .navigation {
                margin-top: 6px;
            }

            .nav-control {
                height: 38px;
            }

            .knowledge {
                margin-top: 5px;
            }

            .knowledge-btn {
                height: 38px;
            }

            .bottom-nav {
                height: 48px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">胖哥学英语</div>

        <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="切换主题"
        >
            ☀️
        </button>
    </div>
</header>

<main class="main">

    <!-- =========================
         Loading
    ========================== -->

    <div id="loading" class="loading">
        正在加载词库...
    </div>

    <div id="errorBox" class="error-box"></div>

    <!-- =========================
         Learning Page
    ========================== -->

    <section id="learningPage" class="page">

        <div class="learning-top">

            <select id="deckSelect" class="deck-select">
                <option value="">请选择词库</option>
            </select>

            <div id="progressInfo" class="progress-info">
                0 / 0
            </div>

        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>

        <div class="card-container">

            <div
                id="flashcard"
                class="flashcard"
                onclick="flipCard()"
            >

                <!-- Front -->
                <div class="card-face card-front">

                    <div class="word-label">
                        WORD
                    </div>

                    <div
                        id="cardWord"
                        class="word"
                    >
                        —
                    </div>

                    <div
                        id="cardPhonetic"
                        class="phonetic"
                    >
                        —
                    </div>

                    <button
                        id="speakMain"
                        class="speak-main"
                        type="button"
                        onclick="event.stopPropagation(); speakWord();"
                    >
                        🔊
                    </button>

                    <div class="card-hint">
                        点击卡片查看释义
                    </div>

                </div>

                <!-- Back -->
                <div class="card-face card-back">

                    <div
                        id="cardMeaning"
                        class="meaning"
                    >
                        —
                    </div>

                    <div
                        id="cardExample"
                        class="example"
                    >
                        —
                    </div>

                    <div
                        id="cardExampleCn"
                        class="example example-cn"
                    >
                        —
                    </div>

                </div>

            </div>

        </div>

        <!-- Previous / Flip / Next -->
        <div class="navigation">

            <button
                id="previousBtn"
                class="nav-control"
                type="button"
                onclick="previousCard()"
            >
                ← 上一个
            </button>

            <button
                class="nav-control flip-btn"
                type="button"
                onclick="flipCard()"
            >
                翻转
            </button>

            <button
                id="nextBtn"
                class="nav-control"
                type="button"
                onclick="nextCard()"
            >
                下一个 →
            </button>

        </div>

        <!-- Knowledge -->
        <div class="knowledge">

            <button
                class="knowledge-btn unknown-btn"
                type="button"
                onclick="markUnknown()"
            >
                没记住
            </button>

            <button
                class="knowledge-btn known-btn"
                type="button"
                onclick="markKnown()"
            >
                记住了
            </button>

        </div>

    </section>

    <!-- =========================
         Library Page
    ========================== -->

    <section id="libraryPage" class="page">

        <h1 class="page-title">
            词库
        </h1>

        <div
            id="deckGrid"
            class="deck-grid"
        ></div>

    </section>

    <!-- =========================
         Stats Page
    ========================== -->

    <section id="statsPage" class="page">

        <h1 class="page-title">
            学习统计
        </h1>

        <div class="stats-grid">

            <div class="stat-card">
                <div class="stat-label">
                    总词数
                </div>

                <div
                    id="totalWords"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    已记住
                </div>

                <div
                    id="knownWords"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    未记住
                </div>

                <div
                    id="unknownWords"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    掌握率
                </div>

                <div
                    id="masteryRate"
                    class="stat-value"
                >
                    0%
                </div>
            </div>

        </div>

        <div class="mastery-wrap">

            <div class="mastery-label">
                <span>整体学习进度</span>
                <span id="masteryText">0%</span>
            </div>

            <div class="mastery-bar">
                <div
                    id="masteryProgress"
                    class="mastery-progress"
                ></div>
            </div>

        </div>

    </section>

</main>

<!-- =========================
     Bottom Navigation
========================== -->

<nav class="bottom-nav">

    <button
        id="learningNav"
        class="nav-btn active"
        type="button"
        onclick="showPage('learning')"
    >
        <span class="nav-icon">📖</span>
        <span>学习</span>
    </button>

    <button
        id="libraryNav"
        class="nav-btn"
        type="button"
        onclick="showPage('library')"
    >
        <span class="nav-icon">📚</span>
        <span>词库</span>
    </button>

    <button
        id="statsNav"
        class="nav-btn"
        type="button"
        onclick="showPage('stats')"
    >
        <span class="nav-icon">📊</span>
        <span>统计</span>
    </button>

</nav>

<script>

    /* =========================================================
       Configuration
    ========================================================= */

    const SITE_ROOT = "/MyFlashCards/";
    const DATA_ROOT = SITE_ROOT + "data/";
    const DECK_INDEX = DATA_ROOT + "index.json";
    const VERSION_URL = DATA_ROOT + "version.json";

    const VERSION_STORAGE_KEY =
        "myflashcards_site_version";

    const STATE_STORAGE_PREFIX =
        "myflashcards_state_";

    const THEME_STORAGE_KEY =
        "myflashcards_theme";

    const CURRENT_DECK_KEY =
        "myflashcards_current_deck";


    /* =========================================================
       Global State
    ========================================================= */

    let decks = [];

    let currentDeck = null;

    let currentWords = [];

    let currentIndex = 0;

    let isFlipped = false;


    /* =========================================================
       DOM
    ========================================================= */

    const loadingEl =
        document.getElementById("loading");

    const errorBoxEl =
        document.getElementById("errorBox");

    const learningPageEl =
        document.getElementById("learningPage");

    const libraryPageEl =
        document.getElementById("libraryPage");

    const statsPageEl =
        document.getElementById("statsPage");

    const deckSelectEl =
        document.getElementById("deckSelect");

    const deckGridEl =
        document.getElementById("deckGrid");

    const flashcardEl =
        document.getElementById("flashcard");

    const cardWordEl =
        document.getElementById("cardWord");

    const cardPhoneticEl =
        document.getElementById("cardPhonetic");

    const cardMeaningEl =
        document.getElementById("cardMeaning");

    const cardExampleEl =
        document.getElementById("cardExample");

    const cardExampleCnEl =
        document.getElementById("cardExampleCn");

    const progressInfoEl =
        document.getElementById("progressInfo");

    const progressBarEl =
        document.getElementById("progressBar");


    /* =========================================================
       Utility
    ========================================================= */

    async function getJSON(url) {

        const response = await fetch(
            url,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}: ${url}`
            );
        }

        return await response.json();
    }


    function showLoading() {

        loadingEl.style.display = "flex";

        errorBoxEl.style.display = "none";

        learningPageEl.classList.remove("active");

        libraryPageEl.classList.remove("active");

        statsPageEl.classList.remove("active");
    }


    function showError(message) {

        loadingEl.style.display = "none";

        errorBoxEl.style.display = "block";

        errorBoxEl.innerHTML =
            escapeHTML(message);
    }


    function showContent() {

        loadingEl.style.display = "none";

        errorBoxEl.style.display = "none";

        learningPageEl.classList.add("active");
    }


    function escapeHTML(value) {

        if (value === null ||
            value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================================
       Version
    ========================================================= */

    async function checkVersion() {

        try {

            const data =
                await getJSON(VERSION_URL);

            if (!data) {
                return;
            }

            const version =
                typeof data === "string"
                    ? data
                    : data.version;

            if (!version) {
                return;
            }

            const oldVersion =
                localStorage.getItem(
                    VERSION_STORAGE_KEY
                );

            if (oldVersion &&
                oldVersion !== version) {

                console.log(
                    "Site version changed:",
                    oldVersion,
                    "->",
                    version
                );

                /*
                 * Do not clear learning progress.
                 * Browser cache is bypassed through cache:no-store.
                 */
            }

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                version
            );

        } catch (error) {

            console.warn(
                "Version check failed:",
                error
            );
        }
    }


    /* =========================================================
       Deck Loading
    ========================================================= */

    async function loadDecks() {

        const data =
            await getJSON(DECK_INDEX);

        if (Array.isArray(data)) {

            decks = data;

        } else if (Array.isArray(data.decks)) {

            decks = data.decks;

        } else {

            throw new Error(
                "data/index.json 格式不正确"
            );
        }

        renderDeckSelect();

        renderLibrary();

        const savedDeck =
            localStorage.getItem(
                CURRENT_DECK_KEY
            );

        let deckToLoad = null;

        if (savedDeck) {

            deckToLoad =
                decks.find(
                    deck => String(deck.id) === String(savedDeck)
                );
        }

        if (!deckToLoad && decks.length > 0) {
            deckToLoad = decks[0];
        }

        if (deckToLoad) {

            deckSelectEl.value =
                deckToLoad.id;

            await loadDeck(deckToLoad.id);

        } else {

            throw new Error(
                "没有找到可用词库"
            );
        }
    }


    function renderDeckSelect() {

        deckSelectEl.innerHTML =
            '<option value="">请选择词库</option>';

        decks.forEach(deck => {

            const option =
                document.createElement("option");

            option.value =
                deck.id;

            option.textContent =
                deck.name || deck.id;

            deckSelectEl.appendChild(option);
        });
    }


    async function loadDeck(deckId) {

        const deck =
            decks.find(
                item =>
                    String(item.id) === String(deckId)
            );

        if (!deck) {
            return;
        }

        currentDeck = deck;

        localStorage.setItem(
            CURRENT_DECK_KEY,
            deck.id
        );

        const file =
            deck.file ||
            `${deck.id}.json`;

        const url =
            file.startsWith("/")
                ? file
                : DATA_ROOT + file;

        const data =
            await getJSON(url);

        if (Array.isArray(data)) {

            currentWords = data;

        } else if (Array.isArray(data.words)) {

            currentWords = data.words;

        } else {

            throw new Error(
                `词库 ${deck.name || deck.id} 格式不正确`
            );
        }

        currentIndex = 0;

        const state =
            loadLearningState();

        if (
            state &&
            Number.isInteger(state.currentIndex) &&
            state.currentIndex >= 0 &&
            state.currentIndex < currentWords.length
        ) {

            currentIndex =
                state.currentIndex;
        }

        isFlipped = false;

        renderCurrentCard();

        updateStats();
    }


    /* =========================================================
       Learning State
    ========================================================= */

    function getStateKey() {

        if (!currentDeck) {
            return null;
        }

        return (
            STATE_STORAGE_PREFIX +
            currentDeck.id
        );
    }


    function loadLearningState() {

        const key =
            getStateKey();

        if (!key) {
            return null;
        }

        try {

            const raw =
                localStorage.getItem(key);

            if (!raw) {
                return null;
            }

            return JSON.parse(raw);

        } catch (error) {

            console.warn(
                "读取学习进度失败:",
                error
            );

            return null;
        }
    }


    function saveLearningState() {

        const key =
            getStateKey();

        if (!key) {
            return;
        }

        const state =
            loadLearningState() || {
                statuses: {}
            };

        state.currentIndex =
            currentIndex;

        if (!state.statuses) {
            state.statuses = {};
        }

        try {

            localStorage.setItem(
                key,
                JSON.stringify(state)
            );

        } catch (error) {

            console.warn(
                "保存学习进度失败:",
                error
            );
        }
    }


    /* =========================================================
       Word State
    ========================================================= */

    function getWordKey(word, index) {

        if (!word) {
            return String(index);
        }

        if (word.id !== undefined) {
            return String(word.id);
        }

        if (word.word) {
            return String(word.word);
        }

        return String(index);
    }


    function getWordStatus(index) {

        const state =
            loadLearningState();

        if (!state ||
            !state.statuses) {

            return null;
        }

        const word =
            currentWords[index];

        const key =
            getWordKey(word, index);

        return state.statuses[key] || null;
    }


    function setWordStatus(
        index,
        status
    ) {

        const key =
            getStateKey();

        if (!key) {
            return;
        }

        const state =
            loadLearningState() || {
                currentIndex: 0,
                statuses: {}
            };

        if (!state.statuses) {
            state.statuses = {};
        }

        const word =
            currentWords[index];

        const wordKey =
            getWordKey(word, index);

        state.statuses[wordKey] =
            status;

        state.currentIndex =
            currentIndex;

        try {

            localStorage.setItem(
                key,
                JSON.stringify(state)
            );

        } catch (error) {

            console.warn(
                "保存单词状态失败:",
                error
            );
        }

        updateStats();
    }


    /* =========================================================
       Render Card
    ========================================================= */

    function renderCurrentCard() {

        if (!currentWords.length) {

            cardWordEl.textContent = "暂无单词";

            cardPhoneticEl.textContent = "";

            cardMeaningEl.textContent = "";

            cardExampleEl.textContent = "";

            cardExampleCnEl.textContent = "";

            progressInfoEl.textContent = "0 / 0";

            progressBarEl.style.width = "0%";

            return;
        }

        if (
            currentIndex < 0 ||
            currentIndex >= currentWords.length
        ) {

            currentIndex = 0;
        }

        const word =
            currentWords[currentIndex];

        cardWordEl.textContent =
            word.word || "—";

        cardPhoneticEl.textContent =
            word.phonetic || "";

        cardMeaningEl.textContent =
            word.meaning || "";

        cardExampleEl.textContent =
            word.example || "";

        cardExampleCnEl.textContent =
            word.example_cn ||
            word.exampleCn ||
            "";

        flashcardEl.classList.remove(
            "flipped"
        );

        isFlipped = false;

        progressInfoEl.textContent =
            `${currentIndex + 1} / ${currentWords.length}`;

        const percent =
            ((currentIndex + 1) /
                currentWords.length) *
            100;

        progressBarEl.style.width =
            `${percent}%`;

        saveLearningState();
    }


    /* =========================================================
       Card Actions
    ========================================================= */

    function flipCard() {

        if (!currentWords.length) {
            return;
        }

        isFlipped =
            !isFlipped;

        flashcardEl.classList.toggle(
            "flipped",
            isFlipped
        );
    }


    function previousCard() {

        if (!currentWords.length) {
            return;
        }

        currentIndex--;

        if (currentIndex < 0) {
            currentIndex =
                currentWords.length - 1;
        }

        renderCurrentCard();
    }


    function nextCard() {

        if (!currentWords.length) {
            return;
        }

        currentIndex++;

        if (
            currentIndex >=
            currentWords.length
        ) {
            currentIndex = 0;
        }

        renderCurrentCard();
    }


    function randomCard() {

        if (currentWords.length <= 1) {
            return;
        }

        let nextIndex;

        do {

            nextIndex =
                Math.floor(
                    Math.random() *
                    currentWords.length
                );

        } while (
            nextIndex === currentIndex
        );

        currentIndex =
            nextIndex;

        renderCurrentCard();
    }


    /* =========================================================
       Speech
    ========================================================= */

    function speakWord() {

        if (!currentWords.length) {
            return;
        }

        const word =
            currentWords[currentIndex];

        const text =
            word.word || "";

        if (!text) {
            return;
        }

        if (!("speechSynthesis" in window)) {
            return;
        }

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = "en-GB";

        utterance.rate = 0.85;

        window.speechSynthesis.speak(
            utterance
        );
    }


    /* =========================================================
       Knowledge
    ========================================================= */

    function markKnown() {

        if (!currentWords.length) {
            return;
        }

        setWordStatus(
            currentIndex,
            "known"
        );

        nextCard();
    }


    function markUnknown() {

        if (!currentWords.length) {
            return;
        }

        setWordStatus(
            currentIndex,
            "unknown"
        );

        nextCard();
    }


    /* =========================================================
       Statistics
    ========================================================= */

    function calculateStats() {

        let totalWords = 0;

        let knownWords = 0;

        let unknownWords = 0;

        decks.forEach(deck => {

            /*
             * For the currently loaded deck we already have
             * the words in memory.
             *
             * Other decks are counted through saved statuses
             * where possible.
             */
        });

        totalWords =
            currentWords.length;

        if (currentDeck) {

            const state =
                loadLearningState();

            const statuses =
                state &&
                state.statuses
                    ? state.statuses
                    : {};

            Object.values(statuses)
                .forEach(status => {

                    if (status === "known") {
                        knownWords++;
                    }

                    if (status === "unknown") {
                        unknownWords++;
                    }
                });
        }

        return {
            totalWords,
            knownWords,
            unknownWords
        };
    }


    function updateStats() {

        const stats =
            calculateStats();

        const total =
            stats.totalWords;

        const known =
            stats.knownWords;

        const unknown =
            stats.unknownWords;

        const mastery =
            total > 0
                ? Math.round(
                    (known / total) * 100
                )
                : 0;

        document.getElementById(
            "totalWords"
        ).textContent =
            total;

        document.getElementById(
            "knownWords"
        ).textContent =
            known;

        document.getElementById(
            "unknownWords"
        ).textContent =
            unknown;

        document.getElementById(
            "masteryRate"
        ).textContent =
            `${mastery}%`;

        document.getElementById(
            "masteryText"
        ).textContent =
            `${mastery}%`;

        document.getElementById(
            "masteryProgress"
        ).style.width =
            `${mastery}%`;
    }


    /* =========================================================
       Library
    ========================================================= */

    function renderLibrary() {

        deckGridEl.innerHTML = "";

        if (!decks.length) {

            deckGridEl.innerHTML =
                '<div class="deck-card">暂无词库</div>';

            return;
        }

        decks.forEach(deck => {

            const card =
                document.createElement("div");

            card.className =
                "deck-card";

            const name =
                escapeHTML(
                    deck.name || deck.id
                );

            const description =
                escapeHTML(
                    deck.description || ""
                );

            const count =
                deck.count ||
                deck.word_count ||
                deck.words_count ||
                "";

            card.innerHTML = `
                <div class="deck-name">
                    ${name}
                </div>

                ${
                    description
                        ? `
                            <div class="deck-description">
                                ${description}
                            </div>
                          `
                        : ""
                }

                ${
                    count
                        ? `
                            <div class="deck-count">
                                ${escapeHTML(count)} 个单词
                            </div>
                          `
                        : ""
                }
            `;

            card.addEventListener(
                "click",
                async () => {

                    showPage("learning");

                    deckSelectEl.value =
                        deck.id;

                    try {

                        showLoading();

                        await loadDeck(
                            deck.id
                        );

                        showContent();

                    } catch (error) {

                        console.error(
                            error
                        );

                        showError(
                            `词库加载失败：${error.message}`
                        );
                    }
                }
            );

            deckGridEl.appendChild(
                card
            );
        });
    }


    /* =========================================================
       Pages
    ========================================================= */

    function showPage(page) {

        learningPageEl.classList.remove(
            "active"
        );

        libraryPageEl.classList.remove(
            "active"
        );

        statsPageEl.classList.remove(
            "active"
        );

        document
            .getElementById("learningNav")
            .classList.remove("active");

        document
            .getElementById("libraryNav")
            .classList.remove("active");

        document
            .getElementById("statsNav")
            .classList.remove("active");

        if (page === "learning") {

            learningPageEl.classList.add(
                "active"
            );

            document
                .getElementById("learningNav")
                .classList.add("active");

        } else if (page === "library") {

            libraryPageEl.classList.add(
                "active"
            );

            document
                .getElementById("libraryNav")
                .classList.add("active");

            renderLibrary();

        } else if (page === "stats") {

            statsPageEl.classList.add(
                "active"
            );

            document
                .getElementById("statsNav")
                .classList.add("active");

            updateStats();
        }

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* =========================================================
       Theme
    ========================================================= */

    function loadTheme() {

        const theme =
            localStorage.getItem(
                THEME_STORAGE_KEY
            );

        if (theme === "dark") {

            document.body.classList.add(
                "dark"
            );

            document.getElementById(
                "themeToggle"
            ).textContent = "🌙";

        } else {

            document.body.classList.remove(
                "dark"
            );

            document.getElementById(
                "themeToggle"
            ).textContent = "☀️";
        }
    }


    function toggleTheme() {

        const dark =
            document.body.classList.toggle(
                "dark"
            );

        localStorage.setItem(
            THEME_STORAGE_KEY,
            dark ? "dark" : "light"
        );

        document.getElementById(
            "themeToggle"
        ).textContent =
            dark ? "🌙" : "☀️";
    }


    /* =========================================================
       Events
    ========================================================= */

    deckSelectEl.addEventListener(
        "change",
        async function () {

            const deckId =
                this.value;

            if (!deckId) {
                return;
            }

            try {

                await loadDeck(
                    deckId
                );

            } catch (error) {

                console.error(
                    error
                );

                showError(
                    `词库加载失败：${error.message}`
                );
            }
        }
    );


    document
        .getElementById("themeToggle")
        .addEventListener(
            "click",
            toggleTheme
        );


    /* =========================================================
       Keyboard
    ========================================================= */

    document.addEventListener(
        "keydown",
        function (event) {

            /*
             * Avoid hijacking keyboard when
             * selecting a deck.
             */

            if (
                event.target.tagName ===
                "SELECT"
            ) {
                return;
            }

            if (event.code === "ArrowLeft") {

                previousCard();

            } else if (

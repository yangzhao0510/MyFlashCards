<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <meta name="description"
          content="胖哥学英语 - 简洁高效的英语闪卡学习工具">

    <title>胖哥学英语</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;

            background: #f6f7f9;
            color: #171717;

            overflow-x: hidden;

            transition:
                background .25s ease,
                color .25s ease;
        }

        button,
        select {
            font: inherit;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

            padding-bottom:
                calc(20px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            height: 64px;

            position: sticky;
            top: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .92);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid #e9e9eb;
        }

        .header-inner {
            width: min(820px, calc(100% - 32px));

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -.3px;
        }

        .theme-btn {
            width: 38px;
            height: 38px;

            padding: 0;

            border: 0;
            border-radius: 50%;

            background: #f2f3f5;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background .2s,
                transform .15s;
        }

        .theme-btn:hover {
            background: #e9eaec;
        }

        .theme-btn:active {
            transform: scale(.94);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            width: min(820px, calc(100% - 32px));

            margin: 0 auto;

            flex: 1;

            padding:
                26px 0
                calc(120px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }


        /* =====================================================
           TOP
        ===================================================== */

        .learning-top {
            display: flex;
            align-items: center;

            gap: 14px;

            margin-bottom: 12px;
        }

        .deck-select {
            flex: 1;

            min-width: 0;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #dedfe2;
            border-radius: 13px;

            background: #fff;
            color: #222;

            font-size: 14px;
            font-weight: 500;

            outline: none;

            cursor: pointer;
        }

        .deck-select:focus {
            border-color: #aaa;
        }

        .progress-info {
            flex-shrink: 0;

            color: #858585;

            font-size: 13px;

            font-variant-numeric: tabular-nums;
        }

        .progress {
            height: 4px;

            margin-bottom: 18px;

            background: #e5e6e8;

            border-radius: 999px;

            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;

            background: #181818;

            border-radius: inherit;

            transition: width .25s ease;
        }


        /* =====================================================
           FLASH CARD
        ===================================================== */

        .card-container {
            width: 100%;

            height: min(500px, 58vh);

            min-height: 390px;

            perspective: 1400px;

            cursor: pointer;

            user-select: none;

            -webkit-user-select: none;
        }

        .flashcard {
            position: relative;

            width: 100%;
            height: 100%;

            transform-style: preserve-3d;

            transition:
                transform .5s cubic-bezier(.2, .7, .2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;

            inset: 0;

            padding: 36px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: #fff;

            border: 1px solid #e5e5e7;

            border-radius: 24px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, .055);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            overflow: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }


        /* =====================================================
           FRONT
        ===================================================== */

        .word-label {
            margin-bottom: 12px;

            color: #a0a0a0;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .word {
            max-width: 100%;

            font-size: clamp(42px, 8vw, 72px);

            line-height: 1.05;

            font-weight: 750;

            letter-spacing: -2px;

            word-break: break-word;
        }

        .phonetic {
            margin-top: 15px;

            color: #858585;

            font-size: 17px;
        }


        /* =====================================================
           SPEAK
        ===================================================== */

        .speak-main {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            margin-top: 22px;

            padding: 0;

            border: 0;
            border-radius: 50%;

            background: #181818;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;

            cursor: pointer;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, .15);

            transition:
                transform .15s,
                background .2s;
        }

        .speak-main:hover {
            background: #303030;
        }

        .speak-main:active {
            transform: scale(.92);
        }

        .speak-icon {
            display: block;
            transform: translateX(1px);
        }


        /* =====================================================
           HINT
        ===================================================== */

        .card-hint {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 20px;

            color: #aaa;

            font-size: 12px;
        }


        /* =====================================================
           BACK
        ===================================================== */

        .meaning {
            max-width: 90%;

            font-size: clamp(25px, 5vw, 38px);

            line-height: 1.35;

            font-weight: 700;

            word-break: break-word;
        }

        .example {
            max-width: 650px;

            margin-top: 22px;

            color: #4e4e4e;

            font-size: 16px;

            line-height: 1.65;

            word-break: break-word;
        }

        .example-cn {
            margin-top: 5px;

            color: #999;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {
            display: grid;

            grid-template-columns:
                1fr 1.15fr 1fr;

            gap: 10px;

            margin-top: 12px;
        }

        .nav-control {
            height: 48px;

            padding: 0 8px;

            border: 1px solid #dedfe2;

            border-radius: 14px;

            background: #fff;

            color: #252525;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background .18s,
                transform .12s;
        }

        .nav-control:hover {
            background: #f6f6f7;
        }

        .nav-control:active {
            transform: scale(.97);
        }

        .nav-control.primary {
            border-color: #181818;

            background: #181818;

            color: #fff;
        }

        .nav-control.primary:hover {
            background: #303030;
        }


        /* =====================================================
           KNOWLEDGE
        ===================================================== */

        .knowledge {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 9px;
        }

        .knowledge-btn {
            height: 50px;

            padding: 0 8px;

            border-radius: 14px;

            background: #fff;

            font-size: 14px;
            font-weight: 650;

            cursor: pointer;

            transition:
                transform .12s,
                background .18s;
        }

        .knowledge-btn:active {
            transform: scale(.97);
        }

        .known {
            border: 1px solid #b7dec9;

            color: #067647;

            background: #f7fcf9;
        }

        .known:hover {
            background: #eef9f3;
        }

        .unknown {
            border: 1px solid #edc3bf;

            color: #b42318;

            background: #fff9f8;
        }

        .unknown:hover {
            background: #fff2f0;
        }


        /* =====================================================
           LIBRARY
        ===================================================== */

        .page-title {
            margin: 4px 0 18px;

            font-size: 25px;

            font-weight: 750;
        }

        .deck-list {
            display: grid;

            gap: 10px;
        }

        .deck-item {
            width: 100%;

            padding: 18px;

            text-align: left;

            border: 1px solid #e2e3e5;

            border-radius: 16px;

            background: #fff;

            cursor: pointer;

            transition:
                transform .12s,
                background .18s;
        }

        .deck-item:hover {
            background: #fafafa;
        }

        .deck-item:active {
            transform: scale(.985);
        }

        .deck-name {
            font-size: 16px;
            font-weight: 650;
        }

        .deck-meta {
            margin-top: 6px;

            color: #999;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }

        .stat-card {
            padding: 22px;

            border: 1px solid #e2e3e5;

            border-radius: 16px;

            background: #fff;
        }

        .stat-label {
            color: #888;

            font-size: 13px;
        }

        .stat-value {
            margin-top: 8px;

            font-size: 32px;

            font-weight: 750;
        }

        .stat-wide {
            grid-column: span 2;
        }

        .mastery-wrap {
            margin-top: 15px;
        }

        .mastery-track {
            height: 8px;

            background: #e8e8ea;

            border-radius: 999px;

            overflow: hidden;
        }

        .mastery-bar {
            width: 0;
            height: 100%;

            background: #181818;

            border-radius: inherit;

            transition: width .3s ease;
        }


        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: fixed;

            left: 50%;

            bottom:
                calc(12px + env(safe-area-inset-bottom));

            transform: translateX(-50%);

            width: min(430px, calc(100% - 24px));

            height: 62px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            background: rgba(255, 255, 255, .94);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid #e2e2e4;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .08);

            z-index: 200;
        }

        .nav-btn {
            border: 0;

            background: transparent;

            color: #999;

            cursor: pointer;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            font-size: 11px;
        }

        .nav-btn.active {
            color: #181818;

            font-weight: 650;
        }

        .nav-icon {
            font-size: 18px;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading,
        .error-box {
            padding: 80px 20px;

            text-align: center;

            color: #888;
        }

        .error-box {
            color: #b42318;
        }

        .error-title {
            margin-bottom: 8px;

            font-weight: 700;
        }

        .error-detail {
            font-size: 13px;

            line-height: 1.6;

            word-break: break-word;
        }

        .retry-btn {
            margin-top: 18px;

            padding: 10px 18px;

            border: 0;

            border-radius: 10px;

            background: #181818;

            color: #fff;

            cursor: pointer;
        }


        /* =====================================================
           UPDATE TOAST
        ===================================================== */

        .update-toast {
            position: fixed;

            left: 50%;
            top: 76px;

            transform: translateX(-50%);

            z-index: 500;

            padding: 10px 16px;

            border-radius: 10px;

            background: #181818;

            color: #fff;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: opacity .2s;
        }

        .update-toast.show {
            opacity: 1;
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark {
            background: #101010;
            color: #eee;
        }

        body.dark .header {
            background: rgba(18, 18, 18, .94);

            border-color: #292929;
        }

        body.dark .theme-btn {
            background: #292929;
            color: #eee;
        }

        body.dark .deck-select,
        body.dark .card-face,
        body.dark .nav-control,
        body.dark .knowledge-btn,
        body.dark .deck-item,
        body.dark .stat-card {
            background: #1a1a1a;

            color: #eee;

            border-color: #303030;
        }

        body.dark .deck-select {
            color: #eee;
        }

        body.dark .progress {
            background: #333;
        }

        body.dark .progress-bar,
        body.dark .mastery-bar {
            background: #eee;
        }

        body.dark .phonetic,
        body.dark .progress-info,
        body.dark .card-hint,
        body.dark .deck-meta,
        body.dark .stat-label {
            color: #888;
        }

        body.dark .example {
            color: #bbb;
        }

        body.dark .example-cn {
            color: #888;
        }

        body.dark .nav-control.primary {
            background: #eee;

            border-color: #eee;

            color: #111;
        }

        body.dark .speak-main {
            background: #eee;

            color: #111;
        }

        body.dark .bottom-nav {
            background: rgba(20, 20, 20, .94);

            border-color: #303030;
        }

        body.dark .nav-btn {
            color: #777;
        }

        body.dark .nav-btn.active {
            color: #eee;
        }

        body.dark .known {
            background: #142019;

            border-color: #28533d;

            color: #6ee7a0;
        }

        body.dark .unknown {
            background: #241615;

            border-color: #5b302d;

            color: #ff8b82;
        }


        /* =====================================================
           TABLET / DESKTOP
        ===================================================== */

        @media (min-width: 768px) {

            .main {
                padding-top: 32px;

                padding-bottom:
                    calc(120px + env(safe-area-inset-bottom));
            }

            .card-container {
                height: 500px;
            }

            .bottom-nav {
                bottom:
                    calc(16px + env(safe-area-inset-bottom));
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 56px;
            }

            .header-inner {
                width: calc(100% - 24px);
            }

            .logo {
                font-size: 17px;
            }

            .main {
                width: calc(100% - 20px);

                padding-top: 10px;

                padding-bottom:
                    calc(94px + env(safe-area-inset-bottom));
            }

            .learning-top {
                gap: 8px;

                margin-bottom: 7px;
            }

            .deck-select {
                height: 40px;

                border-radius: 11px;

                padding: 0 10px;

                font-size: 13px;
            }

            .progress-info {
                font-size: 11px;
            }

            .progress {
                height: 3px;

                margin-bottom: 9px;
            }

            /* 手机卡片 */
            .card-container {
                height: 360px;

                min-height: 360px;
            }

            .card-face {
                padding: 24px 18px;

                border-radius: 18px;
            }

            .word-label {
                margin-bottom: 8px;

                font-size: 10px;

                letter-spacing: 1.2px;
            }

            .word {
                font-size: clamp(40px, 11vw, 54px);

                letter-spacing: -1px;

                line-height: 1.06;
            }

            .phonetic {
                margin-top: 10px;

                font-size: 15px;
            }

            .speak-main {
                width: 44px;
                height: 44px;

                margin-top: 14px;

                font-size: 17px;
            }

            .card-hint {
                bottom: 14px;

                font-size: 10px;
            }

            .meaning {
                max-width: 92%;

                font-size: 25px;

                line-height: 1.3;
            }

            .example {
                max-width: 95%;

                margin-top: 14px;

                font-size: 14px;

                line-height: 1.55;
            }

            .navigation {
                gap: 7px;

                margin-top: 8px;
            }

            .nav-control {
                height: 42px;

                border-radius: 10px;

                font-size: 13px;
            }

            .knowledge {
                gap: 7px;

                margin-top: 7px;
            }

            .knowledge-btn {
                height: 42px;

                border-radius: 10px;

                font-size: 13px;
            }

            .bottom-nav {
                bottom:
                    calc(8px + env(safe-area-inset-bottom));

                width: calc(100% - 20px);

                height: 54px;

                border-radius: 16px;
            }

            .page-title {
                font-size: 22px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .main {
                width: calc(100% - 16px);

                padding-top: 8px;

                padding-bottom:
                    calc(88px + env(safe-area-inset-bottom));
            }

            .card-container {
                height: 330px;

                min-height: 330px;
            }

            .card-face {
                padding: 20px 15px;

                border-radius: 17px;
            }

            .word {
                font-size: 39px;
            }

            .phonetic {
                margin-top: 8px;

                font-size: 14px;
            }

            .speak-main {
                width: 42px;
                height: 42px;

                margin-top: 12px;
            }

            .navigation {
                grid-template-columns:
                    1fr 1fr 1fr;
            }

            .nav-control {
                height: 40px;

                font-size: 12px;
            }

            .knowledge-btn {
                height: 42px;

                font-size: 12px;
            }
        }


        /* =====================================================
           SHORT SCREEN
        ===================================================== */

        @media (max-width: 600px) and (max-height: 700px) {

            .main {
                padding-top: 7px;
            }

            .card-container {
                height: 310px;

                min-height: 310px;
            }

            .card-face {
                padding: 18px 15px;
            }

            .word {
                font-size: 38px;
            }

            .phonetic {
                margin-top: 7px;
            }

            .speak-main {
                width: 40px;
                height: 40px;

                margin-top: 10px;
            }

            .card-hint {
                bottom: 11px;
            }

            .navigation {
                margin-top: 6px;
            }

            .knowledge {
                margin-top: 6px;
            }

            .nav-control {
                height: 39px;
            }

            .knowledge-btn {
                height: 39px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="header-inner">

            <div class="logo">
                胖哥学英语
            </div>

            <button
                id="themeBtn"
                class="theme-btn"
                aria-label="切换主题"
                title="切换主题">
                ☾
            </button>

        </div>

    </header>


    <main class="main">

        <!-- =================================================
             LEARNING
        ================================================== -->

        <section
            id="learningPage"
            class="page active">

            <div
                id="loadingBox"
                class="loading">

                正在加载词库...

            </div>


            <div
                id="errorBox"
                class="error-box"
                style="display:none;">

                <div class="error-title">
                    词库加载失败
                </div>

                <div
                    id="errorDetail"
                    class="error-detail">
                </div>

                <button
                    id="retryBtn"
                    class="retry-btn">

                    重新加载

                </button>

            </div>


            <div
                id="learningContent"
                style="display:none;">

                <div class="learning-top">

                    <select
                        id="deckSelect"
                        class="deck-select">
                    </select>

                    <div class="progress-info">

                        <span id="currentNumber">
                            1
                        </span>

                        /

                        <span id="totalNumber">
                            0
                        </span>

                    </div>

                </div>


                <div class="progress">

                    <div
                        id="progressBar"
                        class="progress-bar">
                    </div>

                </div>


                <!-- =================================================
                     FLASH CARD
                ================================================== -->

                <div
                    id="cardContainer"
                    class="card-container"
                    aria-label="英语单词卡片">

                    <div
                        id="flashcard"
                        class="flashcard">


                        <!-- FRONT -->

                        <div
                            class="card-face card-front">

                            <div class="word-label">
                                WORD
                            </div>

                            <div
                                id="word"
                                class="word">

                                —

                            </div>

                            <div
                                id="phonetic"
                                class="phonetic">

                                —

                            </div>

                            <button
                                id="frontSpeakBtn"
                                class="speak-main"
                                aria-label="播放单词">

                                <span class="speak-icon">
                                    ▶
                                </span>

                            </button>

                            <div class="card-hint">
                                点击卡片查看中文
                            </div>

                        </div>


                        <!-- BACK -->

                        <div
                            class="card-face card-back">

                            <div
                                id="meaning"
                                class="meaning">

                                —

                            </div>

                            <div
                                id="example"
                                class="example">

                                —

                            </div>

                            <div
                                id="exampleCn"
                                class="example example-cn">
                            </div>

                            <button
                                id="backSpeakBtn"
                                class="speak-main"
                                aria-label="播放单词">

                                <span class="speak-icon">
                                    ▶
                                </span>

                            </button>

                        </div>

                    </div>

                </div>


                <!-- NAVIGATION -->

                <div class="navigation">

                    <button
                        id="prevBtn"
                        class="nav-control">

                        ← 上一个

                    </button>

                    <button
                        id="flipBtn"
                        class="nav-control primary">

                        翻转

                    </button>

                    <button
                        id="nextBtn"

<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const SITE_ROOT = "/MyFlashCards/";

const DATA_ROOT =

const DECK_INDEX =
    DATA_ROOT + "index.json";

const VERSION_URL =

    "myflashcards_site_version";

const STATE_STORAGE_PREFIX =
    "myflashcards_state_";

const THEME_STORAGE_KEY =
    "myflashcards_theme";

const CURRENT_DECK_KEY =
    "myflashcards_current_deck";


/* =========================================================
   STATE
========================================================= */

let decks = [];

let currentDeck = null;

let currentWords = [];

const themeBtn =
    document.getElementById("themeBtn");

const updateToast =
    document.getElementById("updateToast");


/* =========================================================
   JSON
========================================================= */

async function getJSON(url) {

    const separator =
        url.includes("?")
            ? "&"
            : "?";

    const finalUrl =
        url +
        separator +
        "_=" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2);

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function () {
                controller.abort();
            },
            10000
        );

    try {

        const response =
            await fetch(
                finalUrl,
                {
                    method: "GET",

                    cache: "no-store",

                    signal: controller.signal,

                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );

        }

        const text =
            await response.text();

        if (!text.trim()) {

            throw new Error(
                "服务器返回空内容"
            );

        }

        try {

            return JSON.parse(text);

        } catch (error) {

            throw new Error(
                "JSON 格式错误：" +
                error.message
            );

        }

    } catch (error) {

        if (
            error &&
            error.name === "AbortError"
        ) {

            throw new Error(
                "请求超时：10 秒内没有收到响应"
            );

        }

        throw error;

    } finally {

        clearTimeout(timeout);

    }

}


/* =========================================================
   VERSION
========================================================= */

async function checkVersion() {

    try {

        const data =
            await getJSON(
                VERSION_URL
            );

        if (
            !data ||
            !data.version
        ) {

            return;

        }

        const serverVersion =
            String(data.version);

        const localVersion =
            localStorage.getItem(
                VERSION_STORAGE_KEY
            );

        if (!localVersion) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            return;

        }

        if (
            localVersion !==
            serverVersion
        ) {

            localStorage.setItem(
                VERSION_STORAGE_KEY,
                serverVersion
            );

            updateToast.classList.add(
                "show"
            );

            setTimeout(
                function () {

                    const newUrl =
                        window.location.pathname +
                        "?v=" +
                        encodeURIComponent(
                            serverVersion
                        );

                    window.location.replace(
                        newUrl
                    );

                },
                700
            );

        }

    } catch (error) {

        /*
         * version.json 只是辅助功能。
         * 即使版本检测失败，也不能阻塞词库加载。
         */

        console.warn(
            "版本检测失败：",
            error
        );

    }

}


/* =========================================================
   UI STATE
========================================================= */

function showLoading() {

    loadingBox.style.display =
        "block";

    errorBox.style.display =
        "none";

    learningContent.style.display =
        "none";

}


function showError(error) {

    loadingBox.style.display =
        "none";

    learningContent.style.display =
        "none";

    errorBox.style.display =
        "block";

    let message =
        error instanceof Error
            ? error.message
            : String(error);

    if (!message) {

        message =
            "未知错误";

    }

    errorDetail.textContent =
        message;

}


function showContent() {

    loadingBox.style.display =
        "none";

    errorBox.style.display =
        "none";

    learningContent.style.display =
        "block";

}


/* =========================================================
   DECK NORMALIZATION
========================================================= */

function normalizeDeck(raw, index) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {

        throw new Error(
            "index.json 第 " +
            (index + 1) +
            " 项格式错误"
        );

    }

    const id =
        raw.id ??
        raw.slug ??
        raw.key ??
        raw.name;

    const name =
        raw.name ??
        raw.title ??
        raw.display_name ??
        id;

    const file =
        raw.file ??
        raw.path ??
        raw.url ??
        raw.src;

    if (!id) {

        throw new Error(
            "index.json 第 " +
            (index + 1) +
            " 项缺少 id"
        );

    }

    if (!file) {

        throw new Error(
            "词库 " +
            id +
            " 缺少 file 字段"
        );

    }

    return {
        ...raw,
        id: String(id),
        name: String(name || id),
        file: String(file)
    };

}


/* =========================================================
   WORD NORMALIZATION
========================================================= */

function normalizeWord(raw, index) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {

        throw new Error(
            "第 " +
            (index + 1) +
            " 个单词数据格式错误"
        );

    }

    const word =
        raw.word ??
        raw.term ??
        raw.text ??
        raw.name;

    if (!word) {

        throw new Error(
            "第 " +
            (index + 1) +
            " 个单词缺少 word 字段"
        );

    }

    return {
        ...raw,

        word: String(word),

        phonetic:
            raw.phonetic ??
            raw.ipa ??
            raw.pronunciation ??
            "",

        meaning:
            raw.meaning ??
            raw.definition ??
            raw.translation ??
            raw.cn ??
            "",

        example:
            raw.example ??
            raw.sentence ??
            "",

        example_cn:
            raw.example_cn ??
            raw.exampleCn ??
            raw.example_zh ??
            raw.translation_example ??
            ""
    };

}


/* =========================================================
   LOAD DECKS
========================================================= */

async function loadDecks() {

    showLoading();

    try {

        const data =
            await getJSON(
                DECK_INDEX
            );

        /*
         * 兼容多种 index.json 格式。
         */

        let list;

        if (Array.isArray(data)) {

            list = data;

        } else if (
            data &&
            Array.isArray(data.decks)
        ) {

            list = data.decks;

        } else if (
            data &&
            Array.isArray(data.items)
        ) {

            list = data.items;

        } else if (
            data &&
            Array.isArray(data.data)
        ) {

            list = data.data;

        } else {

            throw new Error(
                "index.json 必须是数组，或包含 decks/items/data 数组"
            );

        }

        if (!list.length) {

            throw new Error(
                "index.json 中没有任何词库"
            );

        }

        decks =
            list.map(
                normalizeDeck
            );

        renderDeckSelect();

        renderLibrary();

        const savedDeck =
            localStorage.getItem(
                CURRENT_DECK_KEY
            );

        let targetDeck =
            decks.find(
                function (deck) {

                    return (
                        deck.id ===
                        savedDeck
                    );

                }
            );

        if (!targetDeck) {

            targetDeck =
                decks[0];

        }

        await loadDeck(
            targetDeck.id
        );

        showContent();

    } catch (error) {

        console.error(
            "加载词库失败：",
            error
        );

        showError(error);

    }

}


/* =========================================================
   DECK SELECT
========================================================= */

function renderDeckSelect() {

    deckSelect.innerHTML = "";

    decks.forEach(
        function (deck) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                deck.id;

            option.textContent =
                deck.name;

            deckSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   LOAD DECK
========================================================= */

async function loadDeck(deckId) {

    if (loadingDeck) {

        return;

    }

    loadingDeck = true;

    try {

        const deck =
            decks.find(
                function (item) {

                    return (
                        item.id ===
                        deckId
                    );

                }
            );

        if (!deck) {

            throw new Error(
                "找不到词库：" +
                deckId
            );

        }

        if (!deck.file) {

            throw new Error(
                "词库缺少 file 字段：" +
                deckId
            );

        }

        /*
         * 如果 file 本身已经是完整路径，
         * 则直接使用。
         */

        let url;

        if (
            /^https?:\/\//i.test(
                deck.file
            ) ||
            deck.file.startsWith("/")
        ) {

            url =
                deck.file;

        } else {

            url =
                DATA_ROOT +
                deck.file;
        }

        const data =
            await getJSON(url);

        let list;

        if (Array.isArray(data)) {

            list = data;

        } else if (
            data &&
            Array.isArray(data.words)
        ) {

            list = data.words;

        } else if (
            data &&
            Array.isArray(data.items)
        ) {

            list = data.items;

        } else if (
            data &&
            Array.isArray(data.data)
        ) {

            list = data.data;

        } else {

            throw new Error(
                deck.file +
                " 必须是数组，或包含 words/items/data 数组"
            );

        }

        if (!list.length) {

            throw new Error(
                deck.file +
                " 没有单词"
            );

        }

        const normalizedWords =
            list.map(
                normalizeWord
            );

        currentDeck =
            deck;

        currentWords =
            normalizedWords;

        localStorage.setItem(
            CURRENT_DECK_KEY,
            deck.id
        );

        loadLearningState();

        const savedPosition =
            Number(
                learningState.position
            );

        if (
            Number.isInteger(
                savedPosition
            ) &&
            savedPosition >= 0 &&
            savedPosition <
                currentWords.length
        ) {

            currentIndex =
                savedPosition;

        } else {

            currentIndex = 0;

        }

        isFlipped = false;

        deckSelect.value =
            deck.id;

        renderCurrentCard();

        updateStats();

    } finally {

        loadingDeck = false;

    }

}


/* =========================================================
   LEARNING STATE
========================================================= */

function getStateKey() {

    return (
        STATE_STORAGE_PREFIX +
        (
            currentDeck
                ? currentDeck.id
                : "unknown"
        )
    );

}


function loadLearningState() {

    if (!currentDeck) {

        learningState = {};

        return;

    }

    try {

        const raw =
            localStorage.getItem(
                getStateKey()
            );

        if (!raw) {

            learningState = {};

            return;

        }

        const parsed =
            JSON.parse(raw);

        if (
            parsed &&
            typeof parsed ===
                "object" &&
            !Array.isArray(parsed)
        ) {

            learningState =
                parsed;

        } else {

            learningState = {};

        }

    } catch (error) {

        console.warn(
            "学习状态读取失败：",
            error
        );

        learningState = {};

    }

}


function saveLearningState() {

    if (!currentDeck) {

        return;

    }

    learningState.position =
        currentIndex;

    try {

        localStorage.setItem(
            getStateKey(),
            JSON.stringify(
                learningState
            )
        );

    } catch (error) {

        console.warn(
            "学习状态保存失败：",
            error
        );

    }

}


/* =========================================================
   WORD STATE
========================================================= */

function getWordKey(index) {

    const item =
        currentWords[index];

    if (!item) {

        return String(index);

    }

    return (
        String(item.word) +
        "_" +
        index
    );

}


function getWordStatus(index) {

    return (
        learningState[
            getWordKey(index)
        ] ||
        null
    );

}


function setWordStatus(
    index,
    status
) {

    if (
        !currentWords[index]
    ) {

        return;

    }

    learningState[
        getWordKey(index)
    ] = status;

    saveLearningState();

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCurrentCard() {

    if (
        !currentWords.length
    ) {

        wordEl.textContent =
            "—";

        phoneticEl.textContent =
            "";

        meaningEl.textContent =
            "—";

        exampleEl.textContent =
            "";

        exampleCnEl.textContent =
            "";

        return;

    }

    /*
     * 防止 currentIndex 越界。
     */

    if (
        currentIndex < 0 ||
        currentIndex >=
            currentWords.length
    ) {

        currentIndex = 0;

    }

    const item =
        currentWords[
            currentIndex
        ];

    if (!item) {

        return;

    }

    wordEl.textContent =
        item.word || "—";

    phoneticEl.textContent =
        item.phonetic || "";

    meaningEl.textContent =
        item.meaning || "—";

    exampleEl.textContent =
        item.example || "";

    exampleCnEl.textContent =
        item.example_cn || "";

    totalNumber.textContent =
        currentWords.length;

    currentNumber.textContent =
        currentIndex + 1;

    const percent =
        (
            (currentIndex + 1) /
            currentWords.length
        ) * 100;

    progressBar.style.width =
        Math.min(
            100,
            Math.max(
                0,
                percent
            )
        ) + "%";

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

}


/* =========================================================
   FLIP
========================================================= */

function flipCard() {

    if (
        !currentWords.length
    ) {

        return;

    }

    isFlipped =
        !isFlipped;

    flashcard.classList.toggle(
        "flipped",
        isFlipped
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousCard() {

    if (
        !currentWords.length
    ) {

        return;

    }

    currentIndex--;

    if (
        currentIndex < 0
    ) {

        currentIndex =
            currentWords.length - 1;

    }

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   NEXT
========================================================= */

function nextCard() {

    if (
        !currentWords.length
    ) {

        return;

    }

    currentIndex++;

    if (
        currentIndex >=
        currentWords.length
    ) {

        currentIndex = 0;

    }

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   RANDOM
========================================================= */

function randomCard() {

    if (
        currentWords.length <= 1
    ) {

        return;

    }

    let nextIndex;

    do {

        nextIndex =
            Math.floor(
                Math.random() *
                currentWords.length
            );

    } while (
        nextIndex ===
        currentIndex
    );

    currentIndex =
        nextIndex;

    isFlipped = false;

    saveLearningState();

    renderCurrentCard();

}


/* =========================================================
   SPEAK
========================================================= */

function speakWord() {

    if (
        !currentWords.length
    ) {

        return;

    }

    const item =
        currentWords[
            currentIndex
        ];

    if (
        !item ||
        !item.word
    ) {

        return;

    }

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "当前浏览器不支持英语朗读"
        );

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            item.word
        );

    /*
     * 使用美式英语发音。
     * 如果以后需要英国发音，可以改成 en-GB。
     */

    utterance.lang =
        "en-US";

    utterance.rate =
        0.85;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   KNOWLEDGE
========================================================= */

function markKnown() {

    if (
        !currentWords.length
    ) {

        return;

    }

    setWordStatus(
        currentIndex,
        "known"
    );

    updateStats();

    nextCard();

}


function markUnknown() {

    if (
        !currentWords.length
    ) {

        return;

    }

    setWordStatus(
        currentIndex,
        "unknown"
    );

    updateStats();

    nextCard();

}


/* =========================================================
   STATS
========================================================= */

function calculateStats() {

    const total =
        currentWords.length;

    let known = 0;

    let unknown = 0;

    for (
        let i = 0;
        i < currentWords.length;
        i++
    ) {

        const status =
            getWordStatus(i);

        if (
            status === "known"
        ) {

            known++;

        } else if (
            status === "unknown"
        ) {

            unknown++;

        }

    }

    const learned =
        known + unknown;

    const mastery =
        total > 0
            ? Math.round(
                (
                    known /
                    total
                ) * 100
            )
            : 0;

    return {
        total,
        learned,
        known,
        unknown,
        mastery
    };

}


function updateStats() {

    if (
        !currentWords.length
    ) {

        statTotal.textContent =
            "0";

        statLearned.textContent =
            "0";

        statKnown.textContent =
            "0";

        statUnknown.textContent =
            "0";

        statMastery.textContent =
            "0%";

        masteryBar.style.width =
            "0%";

        return;

    }

    const stats =
        calculateStats();

    statTotal.textContent =
        stats.total;

    statLearned.textContent =
        stats.learned;

    statKnown.textContent =
        stats.known;

    statUnknown.textContent =
        stats.unknown;

    statMastery.textContent =
        stats.mastery +
        "%";

    masteryBar.style.width =
        stats.mastery +
        "%";

}


/* =========================================================
   LIBRARY
========================================================= */

function renderLibrary() {

    deckList.innerHTML = "";

    decks.forEach(
        function (deck) {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "deck-item";

            const name =
                escapeHTML(
                    deck.name ||
                    deck.id
                );

            const description =
                deck.description
                    ? escapeHTML(
                        deck.description
                    )
                    : "";

            button.innerHTML =
                `
                <div class="deck-name">
                    ${name}
                </div>

                ${
                    description
                        ? `
                            <div class="deck-meta">
                                ${description}
                            </div>
                          `
                        : ""
                }
                `;

            button.addEventListener(
                "click",
                async function () {

                    try {

                        await loadDeck(
                            deck.id
                        );

                        showContent();

                        showPage(
                            "learningPage"
                        );

                    } catch (error) {

                        console.error(
                            "切换词库失败：",
                            error
                        );

                        showPage(
                            "learningPage"
                        );

                        showError(
                            error
                        );

                    }

                }
            );

            deckList.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   PAGE
========================================================= */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(
            function (page) {

                page.classList.toggle(
                    "active",
                    page.id === pageId
                );

            }
        );

    document
        .querySelectorAll(".nav-btn")
        .forEach(
            function (button) {

                button.classList.toggle(
                    "active",
                    button.dataset.page ===
                    pageId
                );

            }
        );

    if (
        pageId === "statsPage"
    ) {

        updateStats();

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   THEME
========================================================= */

function loadTheme() {

    let savedTheme = null;

    try {

        savedTheme =
            localStorage.getItem(
                THEME_STORAGE_KEY
            );

    } catch (error) {

        console.warn(
            "主题读取失败：",
            error
        );

    }

    if (
        savedTheme === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

        themeBtn.textContent =
            "☀";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeBtn.textContent =
            "☾";

    }

}


function toggleTheme() {

    const isDark =
        document.body.classList.toggle(
            "dark"
        );

    try {

        localStorage.setItem(
            THEME_STORAGE_KEY,
            isDark
                ? "dark"
                : "light"
        );

    } catch (error) {

        console.warn(
            "主题保存失败：",
            error
        );

    }

    themeBtn.textContent =
        isDark
            ? "☀"
            : "☾";

}

========================================================= */

cardContainer.addEventListener(

   THEME
========================================================= */

/* =========================================================
   BOTTOM NAV
========================================================= */

    .querySelectorAll(".nav-btn")
    .forEach(

            button.addEventListener(
                "click",
                function () {

                    showPage(
                        button.dataset.page
                    );

                }
            );

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        const tag =
            event.target &&
            event.target.tagName
                ? event.target.tagName
                : "";

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"
        ) {

            return;

        }

        switch (
            event.key.toLowerCase()
        ) {

            case " ":

                event.preventDefault();

                flipCard();

                break;

            case "arrowleft":

                previousCard();

                break;

            case "arrowright":

                nextCard();

                break;

            case "r":

                randomCard();

                break;

            case "s":

                speakWord();

                break;

            case "k":

                markKnown();

                break;

            case "x":

                markUnknown();

                break;

        }

    }
);


/* =========================================================
   TOUCH
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function (event) {

        const now =
            Date.now();

        if (
            now - lastTouchEnd <=
            300
        ) {

            event.preventDefault();

        }

        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);


/* =========================================================
   INIT
========================================================= */

async function init() {

    if (initialized) {

        return;

    }

    initialized = true;

    loadTheme();

    /*
     * 版本检测不能阻塞词库。
     * 两者并行执行。
     */

    checkVersion();

    await loadDecks();

}


init().catch(
    function (error) {

        console.error(
            "程序初始化失败：",
            error
        );

        showError(error);

    }
);
</script>
